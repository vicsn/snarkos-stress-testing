- name: Install Grafana Agent
  hosts: prometheus_server
  become: true

  vars:
    grafana_cloud_api_ke: REDACTED_GRAFANA_CLOUD_API_TOKEN
    logs_username: 1272055
    loki_url: https://prometheus-prod-13-prod-us-east-0.grafana.net/api/prom/push 
    ansible_user: ubuntu 
  tasks:
    - name: Install Grafana Agent
      vars:
        grafana_agent_logs_config:
          configs:
            - clients:
                - basic_auth:
                    password: '{{ grafana_cloud_api_key }}'
                    username: '{{ logs_username }}'
                  url: '{{ loki_url }}'
              name: default
              positions:
                filename: /tmp/positions.yaml
              scrape_configs:
                - job_name: integrations/node_exporter_direct_scrape
                  static_configs:
                    - targets:
                        - localhost
                      labels:
                        instance: hostname
                        __path__: /var/log/*.log
                        job: integrations/node_exporter
              target_config:
                sync_period: 10s
