- name: Copy files to EC2 instance
  hosts: prometheus_server  # Use the hostname of your Prometheus server instance
  become: yes  # Run tasks with elevated privileges if necessary
  gather_facts: false  # Enable gathering facts
  vars:
    ansible_user: ubuntu 

  tasks:
    - name: Copy docker-compose.yml
      copy:
        src: docker-compose.yml  # Replace with the actual path to your docker-compose.yml
        dest: /home/ubuntu/docker-compose.yml
        owner: ubuntu  # Update with the appropriate username
        group: ubuntu  # Update with the appropriate group
      become_user: ubuntu

    #- name: Copy prometheus.yml
    #  copy:
