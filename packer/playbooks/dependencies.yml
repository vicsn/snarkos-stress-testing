# ------------------------------------------------
# Purge unattended-upgrades
- name: Purge unattended-upgrades
  hosts: all
  become: true
  gather_facts: true
  remote_user: ubuntu
  any_errors_fatal: true
  tasks:
    - name: Stop unattended-upgrades service because it can block apt
      ansible.builtin.systemd:
        name: unattended-upgrades
        state: stopped
      ignore_errors: yes

    - name: Purge unattended-upgrades package
      ansible.builtin.apt:
        name: unattended-upgrades
        state: absent
        purge: yes
        autoremove: yes
      register: apt_result
      retries: 20
      delay: 30
      until: apt_result is success

# ------------------------------------------------
# Ensure python and boto3
- name: Install python, pip and boto3
  hosts: all
  become: true
  gather_facts: true
  remote_user: ubuntu
  any_errors_fatal: true
  tasks:
    - name: Update APT package index
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure Python3 is installed
      apt:
        name: python3
        state: present

    - name: Ensure pip3 is installed
      apt:
        name: python3-pip
        state: present
      register: apt_result
      retries: 5
      delay: 30
      until: apt_result is success

    - name: Ensure Python boto3 is installed
      pip:
        name: boto3
        state: present
        executable: pip3
