  become: true
  gather_facts: true
  remote_user: ubuntu
  any_errors_fatal: true
  roles:
    - logstash_setup
  vars:
    tags: {} # noqa var-naming[no-reserved]
    devnet_name: "image_setup"
    cloud_id: "image_setup"
    elastic_api_key: "image_setup"
  tags: logstash

