# dependencies.yml
# Dependencies baked into the GCP stress-testing base image.
# Installs Docker, monitoring exporters, gcloud CLI, and build tools.
---
- name: Install dependencies
  hosts: all
  become: true
  gather_facts: true
  remote_user: ubuntu
  vars:
    docker_compose_version: 'v2.24.6'

  tasks:
    - name: Install GitHub CLI
      ansible.builtin.shell: |
        set -o pipefail
        type -p curl >/dev/null || (apt-get update && apt-get install curl -y)
        curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
          | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg \
        && chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg \
        && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
          | tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
        && apt-get update \
        && apt-get install gh -y
      args:
        executable: /bin/bash

    - name: Install Docker and build dependencies
      ansible.builtin.apt:
        name:
          - linux-tools-common
          - linux-tools-generic
          - build-essential
          - docker.io
          #- docker-compose
          - libclang-dev
          - acl
        state: present
        update_cache: true

    - name: Install Docker Compose
      ansible.builtin.get_url:
        url: "https://github.com/docker/compose/releases/download/{{ docker_compose_version }}/docker-compose-{{ ansible_system }}-{{ ansible_architecture }}"
        dest: /usr/local/bin/docker-compose
        mode: "u+x,g+x"

    - name: Ensure Docker service is started
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Install zip/unzip
      ansible.builtin.apt:
        name:
          - zip
          - unzip
        state: present
        update_cache: true
      register: apt_result
      retries: 10
      delay: 15
      until: apt_result is success

    - name: Install Google Cloud CLI
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg \
          | gpg --batch --yes --dearmor -o /usr/share/keyrings/cloud.google.gpg
        echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" \
          | tee /etc/apt/sources.list.d/google-cloud-sdk.list > /dev/null
        apt-get update && apt-get install -y google-cloud-cli
      args:
        executable: /bin/bash
        creates: /usr/bin/gcloud

    - name: Install Rust and Python3
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - rust-all
          - cargo
          - rustfmt
          - rust-clippy
        state: present
      register: apt_result
      retries: 5
      delay: 15
      until: apt_result is success

# ------------------------------------------------
# Process Exporter

- name: Install and Configure Process Exporter
  hosts: all
  become: true
  gather_facts: true
  remote_user: ubuntu
  any_errors_fatal: true
  roles:
    - process_exporter_setup
  tags: process_exporter

# ------------------------------------------------
# Node Exporter

- name: Install and Configure Node Exporter
  hosts: all
  become: true
  gather_facts: true
  remote_user: ubuntu
  any_errors_fatal: true
  roles:
    - node_exporter_setup
  tags: node_exporter

# ------------------------------------------------
# Google Cloud Ops Agent (log + metrics collection)

- name: Install Google Cloud Ops Agent
  hosts: all
  become: true
  gather_facts: true
  remote_user: ubuntu
  any_errors_fatal: true
  tasks:
    - name: Download Ops Agent install script
      ansible.builtin.get_url:
        url: https://dl.google.com/cloudagents/add-google-cloud-ops-agent-repo.sh
        dest: /tmp/add-google-cloud-ops-agent-repo.sh
        mode: "0755"

    - name: Install Ops Agent
      ansible.builtin.command:
        cmd: bash /tmp/add-google-cloud-ops-agent-repo.sh --also-install
        creates: /opt/google-cloud-ops-agent/libexec/google_cloud_ops_agent_engine
      register: ops_agent_install
      retries: 3
      delay: 15
      until: ops_agent_install is success

    - name: Deploy Ops Agent default config (Ansible role re-renders with runtime labels at setup time)
      ansible.builtin.copy:
        src: files/ops_agent_config.yaml
        dest: /etc/google-cloud-ops-agent/config.yaml
        owner: root
        group: root
        mode: "0644"
  tags: ops_agent

# ------------------------------------------------
# Purge unattended-upgrades (blocks apt during provisioning)

- name: Purge unattended-upgrades
  hosts: all
  become: true
  gather_facts: true
  remote_user: ubuntu
  any_errors_fatal: true
  tasks:
    - name: Stop unattended-upgrades service
      ansible.builtin.systemd:
        name: unattended-upgrades
        state: stopped
      ignore_errors: true

    - name: Purge unattended-upgrades package
      ansible.builtin.apt:
        name: unattended-upgrades
        state: absent
        purge: true
        autoremove: true
      register: apt_result
      retries: 10
      delay: 15
      until: apt_result is success
