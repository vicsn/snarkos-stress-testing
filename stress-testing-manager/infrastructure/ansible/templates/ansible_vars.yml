# Observability keys received from Infra team.
cloud_id: "{{ elastic_cloud_id }}"
elastic_api_key: "{{ elastic_api_key }}"
grafana_cloud_api_key: "{{ grafana_cloud_api_key }}"

# Your own github access token.
github_token: "{{ github_token }}" # link to generate: https://github.com/settings/tokens/new?scopes=repo&description=burn-in-testing-snarkos

# Observability infra vars
create_flamegraph: false
flamegraph_node_id: "0" # Validator node ID to generate flamegraph for

s3_bucket: "{{ releases_bucket }}"

# Other vars
snarkos_malice_tag: "malice-2349f3eda-with-batch-transmission-request-and-txcache-skip-tx-checks" # NOTE: test_skip_tx_checks feature may cause a fork due to accepting invalid txs. Only GitHub build installation method currently supported.

# Application vars
snarkos_verbosity: "6"
rest_rps: 1000000000

test_runner_ip: {{ stress_testing_manager_ip }}

txs_target_consensus_version: 10