- name: Update stress testing manager source and pueue
  hosts: all
  become: true
  gather_facts: false
  remote_user: ubuntu
  become_user: ubuntu
  vars:
    update_stress_testing: "{{ update_target | default('both') in ['both', 'stress-testing'] }}"
    update_pueue: "{{ update_target | default('both') in ['both', 'pueue'] }}"
  tasks:
    - name: Update the stress-testing repository
      git:
        repo: git@github.com:ProvableHQ/snarkos-stress-testing.git
        dest: "/home/ubuntu/snarkos-stress-testing"
        version: "{{ stress_testing_branch | default('main') }}"
        force: true
      when: update_stress_testing

    - name: Stop pueued service if it exists
      become: true
      become_user: root
      systemd:
        name: pueued.service
        state: stopped
      failed_when: false
      when: update_pueue

    - name: Update pueue via cargo (reinstall; provides pueue + pueued)
      shell: |
        set -euo pipefail
        source $HOME/.cargo/env
        cargo install --locked --force {% if pueue_version | default('') | length > 0 %}--version {{ pueue_version }} {% endif %}pueue
      args:
        executable: /bin/bash
      environment:
        RUSTC_WRAPPER: '/usr/local/bin/sccache'
        SCCACHE_BUCKET: 'snarkos-compiler-cache'
        SCCACHE_REGION: 'us-west-2'
        SCCACHE_S3_USE_SSL: 'true'
        SCCACHE_S3_KEY_PREFIX: 'pueue_linux_rust/'
        CARGO_INCREMENTAL: '0'
      async: 7200
      poll: 15
      when: update_pueue

    - name: Deploy the pueued systemd service file
      become: true
      become_user: root
      template:
        src: pueued.service
        dest: /etc/systemd/system/pueued.service
        mode: '0644'
      when: update_pueue

    - name: Reload systemd to read updated pueued service file
      become: true
      become_user: root
      systemd:
        daemon_reload: true
      when: update_pueue

    - name: Get IP from inside the stress testing manager EC2 instance
      shell: curl -s http://checkip.amazonaws.com
      register: ip_result
      when: update_pueue

    - name: Set fact for the stress testing manager IP
      set_fact:
        stress_testing_manager_ip: "{{ ip_result.stdout | trim }}"
      when: update_pueue

    - name: Set up testing ansible vars
      template:
        src: ansible_vars.yml
        dest: /home/ubuntu/snarkos-stress-testing/test_suites/single-region-tests/playbooks/vars.yml
        mode: '0600'
      become: true
      when: update_pueue

    - name: Set up sync network testing ansible vars
      template:
        src: sync_network_test_ansible_vars.yml
        dest: /home/ubuntu/snarkos-stress-testing/test_suites/network-sync-tests/playbooks/vars.yml
        mode: '0600'
      become: true
      when: update_pueue

    - name: Enable and (re)start pueued service
      become: true
      become_user: root
      systemd:
        name: pueued
        enabled: true
        state: restarted
        daemon_reload: true
      when: update_pueue
