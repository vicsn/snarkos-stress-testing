- name: Setup the stress testing manager machine
  hosts: all
  become: true
  gather_facts: true
  remote_user: ubuntu
  become_user: ubuntu
  vars:
    _setup_target: "{{ setup_target | default('full') }}"
    setup_full: "{{ _setup_target == 'full' }}"
    setup_stress_testing: "{{ _setup_target in ['full', 'both', 'stress-testing'] }}"
    setup_pueue: "{{ _setup_target in ['full', 'both', 'pueue'] }}"
  tasks:
    - name: Install shared SSH keys from repo keys.pub
      ansible.builtin.include_role:
        name: shared_ssh_keys
      when: setup_full

    - name: Ensure .ssh directory exists
      file:
        path: /home/ubuntu/.ssh
        state: directory
        mode: '0700'
      when: setup_full

    - name: Ensure GitHub is in known_hosts
      shell: |
        grep -q '^github.com' ~/.ssh/known_hosts 2>/dev/null || \
        ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts
      args:
        executable: /bin/bash
      when: setup_full

    - name: Ensure stress-testing repo destination exists
      file:
        path: /home/ubuntu/snarkos-stress-testing
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'
      when: setup_stress_testing

    - name: Sync local snarkos-stress-testing checkout to manager
      ansible.posix.synchronize:
        src: "{{ stress_testing_local_path }}/"
        dest: /home/ubuntu/snarkos-stress-testing/
        mode: push
        delete: true
        use_ssh_args: true
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=**/.terraform"
          - "--exclude=**/.terraform.lock.hcl"
          - "--exclude=**/target"
          - "--exclude=**/__pycache__"
          - "--exclude=**/.venv"
          - "--exclude=**/.venv-lint"
          - "--exclude=**/node_modules"
          - "--exclude=devnet-key"
          - "--exclude=devnet-key.pub"
          - "--exclude=stress-testing-manager-ip.txt"
      delegate_to: localhost
      become: false
      when: setup_stress_testing

    - name: Check local devnet-key exists
      ansible.builtin.stat:
        path: "{{ stress_testing_local_path }}/devnet-key"
      delegate_to: localhost
      become: false
      register: local_devnet_key
      when: setup_stress_testing

    - name: Copy devnet-key pair to manager
      ansible.builtin.copy:
        src: "{{ stress_testing_local_path }}/{{ item.src }}"
        dest: "/home/ubuntu/snarkos-stress-testing/{{ item.dest }}"
        mode: "{{ item.mode }}"
        owner: ubuntu
        group: ubuntu
      loop:
        - { src: devnet-key, dest: devnet-key, mode: '0400' }
        - { src: devnet-key.pub, dest: devnet-key.pub, mode: '0644' }
      when: setup_stress_testing and local_devnet_key.stat.exists

    - name: Set ownership on synced stress-testing repo
      file:
        path: /home/ubuntu/snarkos-stress-testing
        state: directory
        owner: ubuntu
        group: ubuntu
        recurse: true
      become: true
      become_user: root
      when: setup_stress_testing

    - name: Update APT package index and install dependencies
      become: true
      become_user: root
      apt:
        update_cache: yes
        cache_valid_time: 3600
        name:
          - apt-transport-https
          - ca-certificates
          - gnupg
          - lsb-release
          - jq
          - python3-pip
          - python3-venv
          - build-essential
          - curl
          - pkg-config
          - libssl-dev
          - libssh2-1-dev
          - clang
          - libclang-dev
          - llvm-dev
          - pkg-config
          - lld
          - cmake
          - wget
      when: setup_full

    - name: Ensure Python boto3 is installed
      apt:
        name: python3-boto3
        state: present
        executable: pip3
      when: setup_full

    - name: Download rustup-init script
      become: false
      run_once: false
      ansible.builtin.get_url:
        url: https://sh.rustup.rs
        dest: /tmp/rustup-init.sh
        mode: '0755'
      when: setup_full

    - name: Run rustup-init.sh to install Rust and Cargo
      become: false
      run_once: false
      ansible.builtin.command: >
        /tmp/rustup-init.sh -y --no-modify-path
      environment:
        CARGO_HOME: /home/ubuntu/.cargo
        RUSTUP_HOME: /home/ubuntu/.rustup
        HOME: /home/ubuntu
      args:
        creates: /home/ubuntu/.cargo/bin/cargo
      register: rustup_result
      changed_when: "'Rust is installed now' in rustup_result.stdout or rustup_result.rc == 0"
      become_user: ubuntu
      when: setup_full

    - name: Add Cargo to PATH in .bashrc
      lineinfile:
        path: /home/ubuntu/.bashrc
        line: 'export PATH="$HOME/.cargo/bin:$PATH"'
        insertafter: EOF
      become: false
      become_user: ubuntu
      when: setup_full

    - name: Add Cargo to PATH for this session
      shell: |
        source $HOME/.cargo/env
        echo $PATH
      args:
        executable: /bin/bash
      register: cargo_path
      when: setup_full

    - name: Show cargo path
      debug:
        var: cargo_path.stdout
      when: setup_full

    - name: Check if sccache exists
      stat:
        path: /usr/local/bin/sccache
      register: sccache
      when: setup_full

    - name: Install sccache
      shell: |
        wget https://github.com/mozilla/sccache/releases/download/v0.10.0/sccache-v0.10.0-x86_64-unknown-linux-musl.tar.gz
        tar -xf sccache-v0.10.0-x86_64-unknown-linux-musl.tar.gz
        sudo install -m 0755 sccache-*/sccache /usr/local/bin/sccache
      when: setup_full and not sccache.stat.exists
      args:
        executable: /bin/bash

    - name: Load Slack vars from vars.yml
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/templates/vars.yml"
      failed_when: false
      when: setup_pueue

    - name: Ensure snarkos-stress-testing config directory exists
      become: true
      become_user: ubuntu
      file:
        path: /home/ubuntu/.config/snarkos-stress-testing
        state: directory
        mode: '0700'
      when: setup_pueue

    - name: Deploy Slack env for ubuntu shell sessions
      become: true
      become_user: ubuntu
      template:
        src: slack_env.sh
        dest: /home/ubuntu/.config/snarkos-stress-testing/slack_env.sh
        mode: '0600'
      no_log: true
      when:
        - setup_pueue
        - slack_token | default('') | length > 0
        - slack_channel_id | default('') | length > 0

    - name: Remove Slack env file when vars not configured
      become: true
      become_user: ubuntu
      file:
        path: /home/ubuntu/.config/snarkos-stress-testing/slack_env.sh
        state: absent
      when:
        - setup_pueue
        - slack_token | default('') | length == 0 or slack_channel_id | default('') | length == 0

    - name: Source Slack env from .bashrc
      become: true
      become_user: ubuntu
      blockinfile:
        path: /home/ubuntu/.bashrc
        marker: "# {mark} ANSIBLE MANAGED - snarkos stress testing slack"
        block: |
          # Slack notifications for snarkos-stress-testing (from ansible vars.yml)
          if [[ -f "$HOME/.config/snarkos-stress-testing/slack_env.sh" ]]; then
            # shellcheck source=/dev/null
            . "$HOME/.config/snarkos-stress-testing/slack_env.sh"
          fi
        state: "{{ 'present' if (slack_token | default('') | length > 0 and slack_channel_id | default('') | length > 0) else 'absent' }}"
      when: setup_pueue

    - name: Source Slack env from .profile
      become: true
      become_user: ubuntu
      blockinfile:
        path: /home/ubuntu/.profile
        marker: "# {mark} ANSIBLE MANAGED - snarkos stress testing slack"
        block: |
          # Slack notifications for snarkos-stress-testing (from ansible vars.yml)
          if [[ -f "$HOME/.config/snarkos-stress-testing/slack_env.sh" ]]; then
            # shellcheck source=/dev/null
            . "$HOME/.config/snarkos-stress-testing/slack_env.sh"
          fi
        state: "{{ 'present' if (slack_token | default('') | length > 0 and slack_channel_id | default('') | length > 0) else 'absent' }}"
      when: setup_pueue

    - name: Stop pueued before install
      become: true
      become_user: root
      systemd:
        name: pueued.service
        state: stopped
      failed_when: false
      when: setup_pueue

    - name: Stop pueued user service if present
      become: true
      become_user: ubuntu
      shell: systemctl --user stop pueued
      failed_when: false
      changed_when: false
      when: setup_pueue

    - name: Remove pueued user systemd unit if present
      become: true
      become_user: ubuntu
      file:
        path: /home/ubuntu/.config/systemd/user/pueued.service
        state: absent
      when: setup_pueue

    - name: Install pueue via cargo (provides pueue + pueued)
      shell: |
        set -euo pipefail
        source $HOME/.cargo/env
        cargo install --locked --force {% if pueue_version | default('') | length > 0 %}--version {{ pueue_version }} {% endif %}pueue
      args:
        executable: /bin/bash
      environment:
        RUSTC_WRAPPER: '/usr/local/bin/sccache'
        SCCACHE_BUCKET: 'snarkos-compiler-cache'
        SCCACHE_REGION: 'us-west-2'
        SCCACHE_S3_USE_SSL: 'true'
        SCCACHE_S3_KEY_PREFIX: 'pueue_linux_rust/'
        CARGO_INCREMENTAL: '0'
      async: 7200
      poll: 15
      when: setup_pueue

    - name: Ensure pueue config directory exists
      become: true
      become_user: ubuntu
      file:
        path: /home/ubuntu/.config/pueue
        state: directory
        mode: '0755'
      when: setup_pueue

    - name: Deploy pueue config with fixed unix socket path
      become: true
      become_user: ubuntu
      template:
        src: pueue.yml
        dest: /home/ubuntu/.config/pueue/pueue.yml
        mode: '0644'
      no_log: true
      when: setup_pueue

    - name: Deploy the pueued systemd service file
      become: true
      become_user: root
      template:
        src: pueued.service
        dest: /etc/systemd/system/pueued.service
        mode: '0644'
      no_log: true
      when: setup_pueue

    - name: Reload systemd to read new pueued service file
      become: true
      become_user: root
      systemd:
        daemon_reload: true
      when: setup_pueue

    - name: Run aws config
      ansible.builtin.shell: |
        aws configure set default.region us-central-1
      environment:
        PYTHONNOUSERSITE: "1"   # ignore ~/.local site-packages
      when: setup_full

    - name: Setup aws config
      template:
        src: aws.config
        dest: /home/ubuntu/.aws/config
        mode: '0600'
      become: true
      when: setup_full

    - name: Get IP from inside the stress testing manager EC2 instance
      shell: curl -s http://checkip.amazonaws.com
      register: ip_result
      when: setup_pueue

    - name: Set fact for the stress testing manager IP
      set_fact:
        stress_testing_manager_ip: "{{ ip_result.stdout | trim }}"
      when: setup_pueue

    - name: Enable and (re)start pueued service
      become: true
      become_user: root
      systemd:
        name: pueued
        enabled: true
        state: restarted
        daemon_reload: true
      when: setup_pueue
