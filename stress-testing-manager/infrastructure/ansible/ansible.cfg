[defaults]
host_key_checking = False
# remote_user and private_key_file removed:
#   * OS Login sets the SSH username to the login-derived value (e.g.
#     sa_<numeric> for service accounts, or ext_<user>_<domain> for
#     humans). tf_stack.sh resolves it with `gcloud compute ssh whoami`
#     and passes -e stm_user=… / -e ansible_user=… at invocation.
#   * OS Login also manages SSH keys via IAM, so no static key file.

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null
