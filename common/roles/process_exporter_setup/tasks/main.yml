---
# Graceful cleanup: stop any pre-existing docker-compose process-exporter container
# (no-op on fresh Packer builds; prevents port 9256 conflict on live re-runs)
- name: Check for legacy docker-compose process-exporter file
  ansible.builtin.stat:
    path: /home/ubuntu/docker-compose-process-exporter.yml
  register: process_exporter_compose_file

- name: Stop legacy docker-compose process-exporter (if present)
  ansible.builtin.command:
    cmd: docker-compose -f /home/ubuntu/docker-compose-process-exporter.yml down --remove-orphans
    chdir: /home/ubuntu/
  when: process_exporter_compose_file.stat.exists
  ignore_errors: true
  changed_when: false

- name: Install prometheus-process-exporter
  ansible.builtin.apt:
    name: prometheus-process-exporter
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Ensure /etc/prometheus directory exists
  ansible.builtin.file:
    path: /etc/prometheus
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Deploy process-exporter process mappings config
  ansible.builtin.template:
    src: process_mappings.yml.j2
    dest: "{{ process_exporter_config_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart prometheus-process-exporter

- name: Deploy process-exporter defaults file
  ansible.builtin.template:
    src: prometheus-process-exporter.default.j2
    dest: /etc/default/prometheus-process-exporter
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart prometheus-process-exporter

- name: Ensure prometheus-process-exporter is enabled and started
  ansible.builtin.systemd:
    name: prometheus-process-exporter
    enabled: true
    state: started
    daemon_reload: true
  become: true
