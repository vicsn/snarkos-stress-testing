---
- name: Download snarkOS binary with GitHub CLI # noqa: no-changed-when
  shell: >
    GITHUB_TOKEN="{{ github_token }}" gh release download {{ snarkos_binary_tag }}
    --repo aleoHQ/snarkOS-staging
    --pattern "snarkos*unknown-linux-gnu.zip"
    --output "/usr/bin/snarkos.zip"
    --clobber

    unzip -o /usr/bin/snarkos.zip -d /usr/bin
  args:
    executable: /bin/bash
  become: true

- name: Make snarkos executable
  file:
    path: /usr/bin/snarkos
    mode: "0755"

- name: Deploy the snarkos systemd service file
  template:
    src: snarkos.service
    dest: /etc/systemd/system/snarkos.service
    mode: '0644'
  become: true

- name: Slurp the snarkos service file
  slurp:
    src: /etc/systemd/system/snarkos.service
  register: snarkos_service_file

- name: Decode and print the snarkos service file contents
  debug:
    msg: "{{ snarkos_service_file['content'] | b64decode }}"

- name: Reload systemd to read new snarkos service file
  systemd:
    daemon_reload: true
  become: true

- name: Restart snarkos service
  systemd:
    name: snarkos
    state: restarted
  become: true
