input {
  file {
    path => "/tmp/snarkos.log"
    start_position => "beginning"
    codec => multiline {
      pattern => "^%{TIMESTAMP_ISO8601}"
      negate => true
      what => "previous"
    }
  }
}
filter {
  grok {
    match => { "message" => "^%{TIMESTAMP_ISO8601:timestamp}\s+%{LOGLEVEL:loglevel}\s+%{GREEDYDATA:message}" }
    overwrite => [ "message" ]
  }
  date {
    match => [ "timestamp", "ISO8601" ]
  }
  mutate {
    add_field => {
      "node_public_ip" => "{{ host_public_ip | default('unknown') }}"
      "commit_hash" => "{{ commit_hash | default('unknown') }}"
      {% for key, value in tags.items() %}
      "tags_{{ key | lower }}" => "{{ value }}"
      {% endfor %}
    }
  }
}
output {
  elasticsearch {
    index => "snarkos-logs-{{ devnet_name | lower }}"
    cloud_id => "{{ cloud_id }}"
    api_key => "{{ elastic_api_key }}"
    action => "create"
  }
}