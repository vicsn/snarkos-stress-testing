---
# Graceful cleanup: stop any pre-existing docker-compose node-exporter container
# (no-op on fresh Packer builds; prevents port 9100 conflict on live re-runs)
- name: Check for legacy docker-compose node-exporter file
  ansible.builtin.stat:
    path: /home/ubuntu/docker-compose-node-exporter.yml
  register: node_exporter_compose_file

- name: Stop legacy docker-compose node-exporter (if present)
  ansible.builtin.command:
    cmd: docker-compose -f /home/ubuntu/docker-compose-node-exporter.yml down --remove-orphans
    chdir: /home/ubuntu/
  when: node_exporter_compose_file.stat.exists
  ignore_errors: true
  changed_when: false

- name: Install prometheus-node-exporter
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Deploy node-exporter defaults file
  ansible.builtin.template:
    src: prometheus-node-exporter.default.j2
    dest: /etc/default/prometheus-node-exporter
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart prometheus-node-exporter

- name: Ensure prometheus-node-exporter is enabled and started
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    enabled: true
    state: started
    daemon_reload: true
  become: true
