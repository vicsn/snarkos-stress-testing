      ignore_errors: yes  # Optional, to proceed even if fetching logs fails
      when: ansible_play_hosts.index(inventory_hostname) >= 31 and ansible_play_hosts.index(inventory_hostname) < 32

    - name: Fetch tx-cannon logs of driver
      fetch:
        src: "/home/ubuntu/tx-cannon/tx-cannon2.log"
        dest: "./{{ inventory_hostname }}-tx-cannon2.log"
        flat: yes
      ignore_errors: yes  # Optional, to proceed even if fetching logs fails
      when: ansible_play_hosts.index(inventory_hostname) >= 20 and ansible_play_hosts.index(inventory_hostname) < 21

    - name: Fetch tx-cannon logs of solution driver
      fetch:
        src: "/home/ubuntu/tx-cannon/tx-cannon2.log"
        dest: "./{{ inventory_hostname }}-tx-cannon2.log"
        flat: yes
      ignore_errors: yes  # Optional, to proceed even if fetching logs fails
      when: ansible_play_hosts.index(inventory_hostname) >= 31 and ansible_play_hosts.index(inventory_hostname) < 32
