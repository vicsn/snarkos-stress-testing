# Setting up and running tx-cannon on attacker-tx-cannon-node instances
- name: Set up and run tx-cannon
  hosts: "attacker_tx_cannon_node"
  become: yes
  remote_user: ubuntu
  vars:
    verbosity: "1"
  tasks:
    - name: Install GitHub CLI
      shell: |
        type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
        curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg \
        && sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg \
        && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
        && sudo apt update \
        && sudo apt install gh -y
      args:
        executable: /bin/bash
      become: yes

    - name: Export tx-cannon GitHub token for gh CLI
      ansible.builtin.set_fact:
        gh_token: "{{ lookup('env', 'GITHUB_TOKEN') }}"

    - name: Clone or update tx-cannon
      git:
        repo: "https://{{ gh_token }}:x-oauth-basic@github.com/ProvableHQ/tx-cannon.git"
        dest: "/home/ubuntu/tx-cannon"
        version: "mainnet"

    - name: Gather facts from all nodes
      setup:

    - name: Download tx-cannon binary with GitHub CLI
      shell: >
        TAG=mainnet-latest

        apt-get install -y unzip

        GITHUB_TOKEN="{{ gh_token }}" gh release download ${TAG}
        --repo ProvableHQ/tx-cannon
        --pattern "tx-cannon*unknown-linux-gnu.zip"
        --output "/usr/bin/tx-cannon.zip"
        --skip-existing

        unzip -o /usr/bin/tx-cannon.zip -d /usr/bin
      environment:
        GITHUB_TOKEN: "{{ gh_token }}"
      args:
        executable: /bin/bash
      become: yes

    - name: Make tx-cannon executable
      file:
        path: "/usr/bin/tx-cannon"
        mode: '0755'

    - name: Debug host index
      debug:
        msg: "The index of {{ inventory_hostname }} in ansible_play_hosts is {{ ansible_play_hosts.index(inventory_hostname) }}"

    - name: Run tx-cannon network driver
      shell: |
        cd /home/ubuntu/tx-cannon
        sudo bash -c '/usr/bin/tx-cannon batch-execute --test tests/network_driver/network_driver_no_wait.toml -e http://{{ client_lb_url }}:3030 -r 9000001  >> tx-cannon.log 2>&1'
      args:
        executable: /bin/bash
      async: 36000  # Adjust based on expected duration of the tx-cannon run
      poll: 0
      when: ansible_play_hosts.index(inventory_hostname) >= 0 and ansible_play_hosts.index(inventory_hostname) < 30

    - name: Run tx-cannon Solution driver
      shell: |
        cd /home/ubuntu/tx-cannon
        sudo bash -c '/usr/bin/tx-cannon generate-solutions -a aleo1rhgdu77hgyqd3xjj8ucu3jj9r2krwz6mnzyd80gncr5fxcwlh5rsvzp9px --endpoint http://{{ client_lb_url }}:3030 -c 1  >> tx-cannon.log 2>&1'
      args:
        executable: /bin/bash
      async: 36000  # Adjust based on expected duration of the tx-cannon run
      poll: 0
      when: ansible_play_hosts.index(inventory_hostname) >= 30 and ansible_play_hosts.index(inventory_hostname) < 32

    # wait 2 minutes
    - name: Wait for 2 minutes
      pause:
        minutes: 2

    - name: Fetch tx-cannon logs of driver
      fetch:
        src: "/home/ubuntu/tx-cannon/tx-cannon.log"
        dest: "./{{ inventory_hostname }}-tx-cannon.log"
        flat: yes
      ignore_errors: yes  # Optional, to proceed even if fetching logs fails
      when: ansible_play_hosts.index(inventory_hostname) >= 0 and ansible_play_hosts.index(inventory_hostname) < 1

    - name: Fetch tx-cannon logs of solution driver
      fetch:
        src: "/home/ubuntu/tx-cannon/tx-cannon.log"
        dest: "./{{ inventory_hostname }}-tx-cannon.log"
        flat: yes
      ignore_errors: yes  # Optional, to proceed even if fetching logs fails
      when: ansible_play_hosts.index(inventory_hostname) >= 30 and ansible_play_hosts.index(inventory_hostname) < 32

- name: Measure block production speed
  hosts: "snarkos_node"
  become: yes
  remote_user: ubuntu
  vars:
    branch: "mainnet"
  tasks:
    - name: Fetch the latest block height from a random validator
      uri:
        url: "http://{{ test_network_url }}:3030/mainnet/block/latest"
        method: GET
        return_content: yes
      register: validator_height_response


    - name: Wait for 60 minutes
      pause:
        minutes: 60

    - name: Fetch the latest block height from a random validator after waiting
      uri:
        url: "http://{{ test_network_url }}:3030/mainnet/block/latest"
        method: GET
        return_content: yes
      register: validator_height_response_2

    - name: Convert first height to integer
      set_fact:
        initial_height: "{{ validator_height_response.json['header']['metadata']['height'] | int }}"

    - name: Print initial block height
      debug:
        msg: "Initial block height is {{ initial_height }}"

    - name: Convert second height to integer
      set_fact:
        final_height: "{{ validator_height_response_2.json['header']['metadata']['height'] | int }}"

    - name: Print secondary block height
      debug:
        msg: "Second block height is {{ final_height }}"

    - name: Compute the difference in block numbers
      set_fact:
        block_diff: "{{ (final_height | int) - (initial_height | int) }}"

    - name: Compute the block time in seconds
      set_fact:
        block_time_seconds: "{{ (40 * 60 / (block_diff | int)) if (block_diff | int) > 0 else 'undefined' }}"
      ignore_errors: yes

    - name: Print/Debug the block time
      debug:
        msg: "Average block time over the period is {{ block_time_seconds }} seconds per block"

# Deploy secondary client nodes
- name: Deploy and restart snarkos-secondary-client service on client nodes
  hosts: snarkos_secondary_client_node
  become: yes
  remote_user: ubuntu
  tasks:
    - name: Determine the number of validator instances for client
      set_fact:
        num_instances: "{{ groups['snarkos_node'] | length }}"
      run_once: true

    # The node id starts from num_instances
    - name: Set node_id based on instance tag
      set_fact:
        node_id: "{{ (tags['Dev'] | int)}}"
    
    - name: Set environment variables for snarkos service
      set_fact:
        ansible_env:
          VERBOSITY: 1
          NODE_ID: "{{ node_id }}"
          NUM_INSTANCES: "{{ num_instances }}"
      tags: always
    
    - name: Deploy the snarkos-client systemd service file
      template:
        src: snarkos-client.service
        dest: /etc/systemd/system/snarkos-client.service
    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Restart snarkos-client service
      systemd:
        name: snarkos-client
        state: restarted

    - name: Calculate the port for the current node
      set_fact:
        current_node_port: "{{ 3030 }}"

    - name: Give secondary clients 30 seconds to boot up 
      ansible.builtin.pause:
        seconds: 30

- name: Reconfigure some of the tx cannons to target the secondary client nodes
  hosts: "attacker_tx_cannon_node"
  become: yes
  remote_user: ubuntu
  vars:
    verbosity: "1"
  tasks:
    - name: Stop tx-cannon network driver
      shell: |
        sudo pkill -f '/usr/bin/tx-cannon batch-execute'
      args:
        executable: /bin/bash
      when: ansible_play_hosts.index(inventory_hostname) >= 20 and ansible_play_hosts.index(inventory_hostname) < 30

    - name: Stop tx-cannon solution driver
      shell: |
        sudo pkill -f '/usr/bin/tx-cannon generate-solutions'
      args:
        executable: /bin/bash
      when: ansible_play_hosts.index(inventory_hostname) >= 31 and ansible_play_hosts.index(inventory_hostname) < 32

    - name: Run tx-cannon network driver
      shell: |
        cd /home/ubuntu/tx-cannon
        sudo bash -c '/usr/bin/tx-cannon batch-execute --test tests/network_driver/network_driver_no_wait.toml -e http://{{ secondary_client_lb_url }}:3030 -r 9000001  >> tx-cannon2.log 2>&1'
      args:
        executable: /bin/bash
      async: 36000  # Adjust based on expected duration of the tx-cannon run
      poll: 0
      when: ansible_play_hosts.index(inventory_hostname) >= 20 and ansible_play_hosts.index(inventory_hostname) < 30

    - name: Run tx-cannon Solution driver
      shell: |
        cd /home/ubuntu/tx-cannon
        sudo bash -c '/usr/bin/tx-cannon generate-solutions -a aleo1rhgdu77hgyqd3xjj8ucu3jj9r2krwz6mnzyd80gncr5fxcwlh5rsvzp9px --endpoint http://{{ secondary_client_lb_url }}:3030 -c 1  >> tx-cannon2.log 2>&1'
      args:
        executable: /bin/bash
      async: 36000  # Adjust based on expected duration of the tx-cannon run
      poll: 0
      when: ansible_play_hosts.index(inventory_hostname) >= 31 and ansible_play_hosts.index(inventory_hostname) < 32

- name: Measure sync speed of secondary client nodes
  hosts: snarkos_secondary_client_node
  become: yes
  remote_user: ubuntu
  tasks:
    - name: Fetch the latest block height from the client node
      uri:
        url: "http://{{ inventory_hostname }}:{{ current_node_port }}/mainnet/block/latest"
        method: GET
        return_content: yes
      register: client_height_response

    - name: Give secondary clients 3 minutes to catch up 
      ansible.builtin.pause:
        minutes: 3

    - name: Fetch the latest block height from the client node
      uri:
        url: "http://{{ inventory_hostname }}:{{ current_node_port }}/mainnet/block/latest"
        method: GET
        return_content: yes
      register: client_height_response_2

    - name: Convert first height to integer
      set_fact:
        initial_height: "{{ client_height_response.json['header']['metadata']['height'] | int }}"

    - name: Convert second height to integer
      set_fact:
        final_height: "{{ client_height_response_2.json['header']['metadata']['height'] | int }}"

    - name: Print secondary block height
      debug:
        msg: "Second block height is {{ final_height }}"

    - name: Compute the difference in block numbers
      set_fact:
        block_diff: "{{ (final_height | int) - (initial_height | int) }}"

    - name: Compute the block time in seconds
      set_fact:
        block_time_seconds: "{{ (3 * 60 / (block_diff | int)) if (block_diff | int) > 0 else 'undefined' }}"
      ignore_errors: yes

    - name: Print/Debug the block sync time
      debug:
        msg: "Average block sync time over the period is {{ block_time_seconds }} seconds per block"

- name: Copy tx-cannon logs from the reconfgured tx-cannon nodes
  hosts: "attacker_tx_cannon_node"
  become: yes
  remote_user: ubuntu
  vars:
    verbosity: "1"
  tasks:

    - name: Fetch tx-cannon logs of driver
      fetch:
        src: "/home/ubuntu/tx-cannon/tx-cannon.log"
