# dynamic_inventory_clients.aws_ec2.yml
plugin: amazon.aws.aws_ec2
regions:
  - us-west-2
  - us-west-1
  - us-east-1
  - us-east-2
  - ap-southeast-1
  - ap-southeast-2
  - ap-northeast-1
  - ca-central-1
  - eu-central-1
  - eu-west-1
  - eu-west-2
  - eu-west-3
  - eu-north-1
  - sa-east-1

keyed_groups:
  - key: tags.Role
    prefix: ""
    separator: ""
    value: "snarkos-node"
  - key: tags.Role
    prefix: ""
    separator: ""
    value: "snarkos-client-node"
  - key: tags.Role
    prefix: ""
    separator: ""
    value: "snarkos-secondary-client-node"
  - key: tags.Role
    prefix: ""
    separator: ""
    value: "attacker-tx-cannon-node"
  - key: tags.Role
    prefix: ""
    separator: ""
    value: "prometheus-server"
  - key: tags.Role
    prefix: ""
    separator: ""
    value: "tx-cannon-node"

filters:
  instance-state-name: running
  tag:Role: ["snarkos-node", "snarkos-client-node", "snarkos-secondary-client-node", "attacker-tx-cannon-node", "prometheus-server", "tx-cannon-node"]
  