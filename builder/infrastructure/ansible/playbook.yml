- name: Setup the builder machine
  hosts: all
  become: true
  gather_facts: true
  remote_user: ubuntu
  become_user: ubuntu
  tasks:
    - name: Clone the stress-testing repository
      git:
        repo: "https://{{ github_token }}@github.com/ProvableHQ/stress-testing.git"
        dest: "/home/ubuntu/stress_testing"
        version: main
        force: true

    - name: Update APT package index and install dependencies
      become: true
      become_user: root
      apt:
        update_cache: yes
        cache_valid_time: 3600
        name:
          - jq
          - python3-pip
          - build-essential
          - curl
          - pkg-config
          - libssl-dev
          - libssh2-1-dev

    - name: Ensure Python boto3 is installed
      pip:
        name: boto3
        state: present
        executable: pip3

    - name: Install Rust and Cargo
      shell: |
        set -o pipefail
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        echo 'source $HOME/.cargo/env' >> $HOME/.bashrc
        source $HOME/.cargo/env
      args:
        executable: /bin/bash
        creates: /home/ubuntu/.cargo/bin/cargo

    - name: Add Cargo to PATH for this session
      shell: |
        source $HOME/.cargo/env
        echo $PATH
      args:
        executable: /bin/bash
      register: cargo_path

    - name: Show cargo path
      debug:
        var: cargo_path.stdout

    - name: Clone the Talisker repository
      git:
        repo: "https://{{ github_token }}@github.com/ProvableHQ/talisker.git"
        dest: "/home/ubuntu/talisker-src"
        version: master
        force: true

    - name: Compile Talisker
      shell: |
        source $HOME/.cargo/env
        cd /home/ubuntu/talisker-src && \
        cargo build --release && \
        mkdir -p /home/ubuntu/talisker/bin && \
        cp target/release/talisker /home/ubuntu/talisker/bin
      args:
        executable: /bin/bash

    - name: Ensure the talisker binary is executable
      file:
        path: "/home/ubuntu/talisker/bin/talisker"
        mode: '0755'

    - name: Deploy the talisker systemd service file
      become: true
      become_user: root
      template:
        src: talisker.service
        dest: /etc/systemd/system/talisker.service
        mode: '0644'

    - name: Reload systemd to read new talisker service file
      become: true
      become_user: root
      systemd:
        daemon_reload: true

    - name: Restart talisker service
      become: true
      become_user: root
      systemd:
        name: talisker
        state: restarted

    - name: Run aws config
      ansible.builtin.shell: |
        aws configure set default.region us-central-1

    - name: Setup aws config
      template:
        src: aws.config
        dest: /home/ubuntu/.aws/config
        mode: '0600'
      become: true

    - name: Get IP from inside the builder EC2 instance
      shell: curl -s http://checkip.amazonaws.com
      register: ip_result

    - name: Set fact for the builder IP
      set_fact:
        builder_ip: "{{ ip_result.stdout | trim }}"

    - name: Set up testing ansible vars
      template:
        src: ansible_vars.yml
        dest: /home/ubuntu/stress_testing/test_suites/single-region-tests/playbooks/vars.yml
        mode: '0600'
      become: true

    - name: Set up the auto-run script
      template:
        src: auto_run_test_suite.sh
        dest: /home/ubuntu/stress_testing/test_suites/single-region-tests/auto_run_test_suite.sh
        mode: '0755'
      become: true
