- name: Setup the builder machine
  hosts: all
  become: true
  gather_facts: true
  remote_user: ubuntu
  become_user: ubuntu
  tasks:
    - name: Read additional authorized keys from the template
      set_fact:
        extra_keys_raw: "{{ lookup('file', 'templates/extra_keys.pub') }}"

    - name: Parse keys into a list
      set_fact:
        extra_keys_list: "{{ extra_keys_raw.splitlines() | select('match', '^ssh-') | list }}"

    - name: Add each key if not already present
      ansible.posix.authorized_key:
        user: "ubuntu"
        key: "{{ item }}"
        state: present
      loop: "{{ extra_keys_list }}"

    - name: Clone the stress-testing repository
      git:
        repo: "https://{{ github_token }}@github.com/ProvableHQ/stress-testing.git"
        dest: "/home/ubuntu/stress_testing"
        version: main
        force: true

    - name: Update APT package index and install dependencies
      become: true
      become_user: root
      apt:
        update_cache: yes
        cache_valid_time: 3600
        name:
          - apt-transport-https
          - ca-certificates
          - gnupg
          - lsb-release
          - jq
          - python3-pip
          - build-essential
          - curl
          - pkg-config
          - libssl-dev
          - libssh2-1-dev
          - clang
          - libclang-dev
          - llvm-dev
          - pkg-config
          - cmake

    - name: Ensure Python boto3 is installed
      pip:
        name: boto3
        state: present
        executable: pip3

    - name: Download rustup-init script
      become: false
      run_once: false
      ansible.builtin.get_url:
        url: https://sh.rustup.rs
        dest: /tmp/rustup-init.sh
        mode: '0755'

    - name: Run rustup-init.sh to install Rust and Cargo
      become: false
      run_once: false
      ansible.builtin.command: >
        /tmp/rustup-init.sh -y --no-modify-path
      environment:
        CARGO_HOME: /home/ubuntu/.cargo
        RUSTUP_HOME: /home/ubuntu/.rustup
        HOME: /home/ubuntu
      args:
        creates: /home/ubuntu/.cargo/bin/cargo
      register: rustup_result
      changed_when: "'Rust is installed now' in rustup_result.stdout or rustup_result.rc == 0"
      become_user: ubuntu

    - name: Add Cargo to PATH in .bashrc
      lineinfile:
        path: /home/ubuntu/.bashrc
        line: 'export PATH="$HOME/.cargo/bin:$PATH"'
        insertafter: EOF
      become: false
      become_user: ubuntu

    - name: Add Cargo to PATH for this session
      shell: |
        source $HOME/.cargo/env
        echo $PATH
      args:
        executable: /bin/bash
      register: cargo_path

    - name: Show cargo path
      debug:
        var: cargo_path.stdout

    - name: Clone the Talisker repository
      git:
        repo: "https://{{ github_token }}@github.com/ProvableHQ/talisker.git"
        dest: "/home/ubuntu/talisker-src"
        version: master
        force: true

    - name: Check if talisker.service unit file exists
      stat:
        path: /etc/systemd/system/talisker.service
      register: talisker_service_file

    - name: Stop talisker service if it exists
      become: true
      become_user: root
      systemd:
        name: talisker.service
        state: stopped
      when: talisker_service_file.stat.exists

    - name: Compile Talisker
      shell: |
        source $HOME/.cargo/env
        cd /home/ubuntu/talisker-src && \
        cargo build --release && \
        mkdir -p /home/ubuntu/talisker/bin && \
        cp target/release/talisker /home/ubuntu/talisker/bin
      args:
        executable: /bin/bash

    - name: Ensure the talisker binary is executable
      file:
        path: "/home/ubuntu/talisker/bin/talisker"
        mode: '0755'

    - name: Copy scripts used by Talisker
      ansible.builtin.shell: |
        cp -r /home/ubuntu/talisker-src/scripts /home/ubuntu/scripts
      args:
        executable: /bin/bash

    - name: Deploy the talisker systemd service file
      become: true
      become_user: root
      template:
        src: talisker.service
        dest: /etc/systemd/system/talisker.service
        mode: '0644'

    - name: Reload systemd to read new talisker service file
      become: true
      become_user: root
      systemd:
        daemon_reload: true

    - name: Run aws config
      ansible.builtin.shell: |
        aws configure set default.region us-central-1

    - name: Setup aws config
      template:
        src: aws.config
        dest: /home/ubuntu/.aws/config
        mode: '0600'
      become: true

    - name: Get IP from inside the builder EC2 instance
      shell: curl -s http://checkip.amazonaws.com
      register: ip_result

    - name: Set fact for the builder IP
      set_fact:
        builder_ip: "{{ ip_result.stdout | trim }}"

    - name: Set up testing ansible vars
      template:
        src: ansible_vars.yml
        dest: /home/ubuntu/stress_testing/test_suites/single-region-tests/playbooks/vars.yml
        mode: '0600'
      become: true

    - name: Set up the auto-run script
      template:
        src: auto_run_test_suite.sh
        dest: /home/ubuntu/stress_testing/test_suites/single-region-tests/auto_run_test_suite.sh
        mode: '0755'
      become: true

    - name: Set up the talisker control script
      template:
        src: talisker_control.sh
        dest: /home/ubuntu/talisker_control.sh
        mode: '0755'
      become: true

    - name: Check if Docker is installed
      command: which docker
      register: docker_installed
      ignore_errors: true

    - name: Create keyrings directory
      become: true
      become_user: root
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      when: docker_installed.rc != 0

    - name: Download and dearmor Docker GPG key
      become: true
      become_user: root
      shell: |
        set -o pipefail
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
      args:
        executable: /bin/bash
        creates: /usr/share/keyrings/docker-archive-keyring.gpg
      when: docker_installed.rc != 0

    - name: Set permissions on Docker GPG key
      become: true
      become_user: root
      file:
        path: /usr/share/keyrings/docker-archive-keyring.gpg
        mode: '0644'
      when: docker_installed.rc != 0

    - name: Add Docker APT repository
      become: true
      become_user: root
      apt_repository:
        repo: >
          deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg]
          https://download.docker.com/linux/ubuntu {{ ansible_distribution_release | lower }} stable
        filename: docker
        state: present
      when: docker_installed.rc != 0

    - name: Stop unattended-upgrades service (if running)
      become_user: root
      become: true
      systemd:
        name: unattended-upgrades.service
        state: stopped
        enabled: false
      when: docker_installed.rc != 0

    - name: Install Docker
      become: true
      become_user: root
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
        state: present
        update_cache: yes
      when: docker_installed.rc != 0

    - name: Enable and start Docker service
      become: true
      become_user: root
      systemd:
        name: docker
        enabled: yes
        state: started
      when: docker_installed.rc != 0

    - name: Add ubuntu user to docker group
      become: true
      become_user: root
      user:
        name: ubuntu
        groups: docker
        append: yes
      when: docker_installed.rc != 0

    - name: Reboot to apply group membership
      become_user: root
      become: true
      reboot:
      when: docker_installed.rc != 0

    - name: Wait for system to become reachable
      wait_for_connection:
        delay: 10
        timeout: 300
      when: docker_installed.rc != 0

    - name: Register QEMU emulators for multi-platform builds
      shell: docker run --privileged --rm tonistiigi/binfmt --install all
      when: docker_installed.rc != 0

    - name: Create Buildx builder if not present
      shell: |
        docker buildx inspect multiarch-builder || \
        docker buildx create --name multiarch-builder --driver docker-container --use
      args:
        executable: /bin/bash
      when: docker_installed.rc != 0

    - name: Bootstrap Buildx builder
      shell: docker buildx inspect --bootstrap
      when: docker_installed.rc != 0

    - name: Restart talisker service
      become: true
      become_user: root
      systemd:
        name: talisker
        state: restarted
