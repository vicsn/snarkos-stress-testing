plugin: amazon.aws.aws_ec2

regions:

keyed_groups:
  - key: tags.Role
    prefix: ""
    separator: ""
    value: "snarkos-node"
  - key: tags.Role
    prefix: ""
    separator: ""
    value: "tx-cannon-node"
  - key: tags.Role
    prefix: ""
    separator: ""
    value: "prometheus-server"
  - key: tags.Role
    prefix: ""
    separator: ""
    value: "network-driver-node"

filters:
  instance-state-name: running
  tag:Role: ["snarkos-node", "tx-cannon-node", "prometheus-server", "network-driver-node"]
