- name: Divide hosts into first 30% and the rest
  hosts: snarkos_validator
  remote_user: ubuntu
  tasks:
    - name: Group the first 30% of hosts
      group_by:
        key: "{{ 'malice_validator' if (groups['snarkos_validator'].index(inventory_hostname) < (groups['snarkos_validator'] | length * 0.3) | round(0, 'floor')) else 'rest' }}"

- name: Install malicious snarkos
  hosts: malice_validator
  remote_user: ubuntu
  become: true
  pre_tasks:
    - include_tasks: ../../playbooks/set_validator_facts.yml

    - name: set malice specific facts
      set_fact:
        malicemode: |
          Environment="RoundsFarAhead=1"
          Environment="ROUND_ADVANCE=10"
        snarkos_binary_name: snarkos-malice
      run_once: true

    - name: Set snarkos command with peers and validators
      set_fact:
        snarkos_command: "{{ snarkos_binary_name }} start --metrics --nodisplay --bft 0.0.0.0:5000 --rest 0.0.0.0:3030 --peers {{ validator_client_ips }} --validators {{ formatted_validator_ips }} --verbosity {{ snarkos_verbosity }} --dev {{ node_id }} --dev-num-validators {{ num_instances }} --validator --rest-rps 10 --no-dev-txs"
  roles:
    - snarkos_service

- name: Pause
  hosts: localhost
  tasks:
    - name: Pause for 30 minutes
      pause:
        minutes: 30

- name: Undo malicemode
  hosts: malice_validator
  remote_user: ubuntu
  become: true
  pre_tasks:
    - name: set malice specific facts
      set_fact:
        malicemode: ""
        snarkos_binary_name: snarkos
      run_once: true 

    - name: stop snarkos
      systemd:
        name: snarkos
        state: stopped

    - name: Remove existing .ledger-* directories on malice validators
      ansible.builtin.shell:
        cmd: "rm -rf /home/ubuntu/.ledger-*"

    - name: Set snarkos command with peers and validators
      set_fact:
        snarkos_command: "{{ snarkos_binary_name }} start --metrics --nodisplay --bft 0.0.0.0:5000 --rest 0.0.0.0:3030 --peers {{ validator_client_ips }} --validators {{ formatted_validator_ips }} --verbosity {{ snarkos_verbosity }} --dev {{ node_id }} --dev-num-validators {{ num_instances }} --validator --rest-rps 10 --no-dev-txs"
  roles:
    - snarkos_service

- name: Undo malicemode state on clients
  hosts: snarkos_client[1]
  remote_user: ubuntu
  become: true
  pre_tasks:
    - include_tasks: ../../playbooks/set_client_facts.yml

    - name: Stop the clients
      systemd:
        name: snarkos
        state: stopped

    - name: Remove existing .ledger-* directories on clients
      ansible.builtin.shell:
        cmd: "rm -rf /home/ubuntu/.ledger-*"
  roles:
    - snarkos_service
  tags: snarkos_client
