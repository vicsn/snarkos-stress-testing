# ------------------------------------------------
# tx-cannon

# prepare the cannons
- name: Install and configure tx-cannon and snarkos on all nodes
  hosts: tx_cannon_node
  become: true
  remote_user: ubuntu
  roles:
    - { role: txcannon_setup_s3, when: use_prebuild_tx_cannon is defined }
    - { role: txcannon_setup, when: use_prebuild_tx_cannon is undefined }
    - logstash_txcannon_setup
    - role: snarkos_install_binary
      when: {{use_prebuild_tx_cannon is undefined}}
    - role: snarkos_install_s3
      s3_bucket: "snarkos-releases-for-testing"
      when: {{use_prebuild_tx_cannon is defined}}
    - role: snarkos_service
      num_instances: "{{ groups['snarkos_validator'] | length }}"
      validator_index: 0
      validator_address: "{{ hostvars[groups['snarkos_validator'][validator_index | int]]['public_ip_address'] }}"
      own_address: "{{ hostvars[inventory_hostname]['public_ip_address'] }}"
      client_addresses: "{{ groups['snarkos_client'] | map('extract', hostvars) | map(attribute='public_ip_address') | select('ne', own_address) | join(',') }}"
      node_id: "{{ (num_instances | int) + 100*(validator_index | int) + 10000*(tags['Dev'] | int) }}"
      snarkos_command: "snarkos start --client --nocdn --nodisplay --rest 0.0.0.0:3030 --bft 0.0.0.0:5000 --node 0.0.0.0:4130 --verbosity {{ snarkos_verbosity }} --metrics --peers {{ validator_address }}:4130,{{ client_addresses }} --dev {{ node_id }} --dev-num-validators {{ num_instances }} --rest-rps {{ rest_rps }} --network {{ snarkos_network_int }}"
  tags: tx-cannon

- name: GENERATE THE DEPLOYMENTS!
  hosts: tx_cannon_node
  become: true
  remote_user: ubuntu
  tasks:
    - name: Ask the user for the number of validators in the target network
      pause:
        prompt: "How many validators do you expect in the target network?"
      register: num_validators

    - name: Ask the user for the number of deployments to generate (multiple of num_validators * num_tx_cannons)
      pause:
        prompt: "How many deployments do you want to generate in total?"
      register: total_deployments

    - name: Set facts from user input
      set_fact:
        num_validators: "{{ num_validators.user_input }}"
        total_deployments: "{{ total_deployments.user_input }}"
      run_once: true

    - name: Assert that we're generating enough deployments
      assert:
        that: "(total_deployments | int) % ((num_validators | int) * (groups['tx_cannon_node'] | length)) == 0"
        fail_msg: "The total number of deployments must be divisible by the number of validators and the number of tx-cannon nodes"

    - name: Set node id
      set_fact:
        node_id: "{{ tags['Dev'] }}"

    - name: Run tx-cannon
      shell: |
        cd /home/ubuntu/tx-cannon
        python3 tests/scripts/tx_pregeneration.py --transaction_type deployment --num_validators {{ num_validators }} --num_transactions {{ num_deployments }} --num_proofs_in_parallel {{ prover_parallelization }} --program_file {{ program_file }} --program_suffix {{ program_suffix }} --network {{ snarkos_network_int }} 
      args:
        executable: /bin/bash
      vars:
        program_file: "/home/ubuntu/tx-cannon/tests/1M_constraint_deployment_100_programs_50_nodes/program_original.txt"
        program_suffix: "{{ node_id }}"
        # the default snarkOS rate-limits allow 8 per second for 10 minutes per validator, spread over the different number of tx-cannon workers
        # however, 1000 deployments already cost as much as a month's budget so we go with that
        num_deployments: "{{ ((total_deployments | int) / (groups['tx_cannon_node'] | length)) | float | int }}" 
        prover_parallelization: "3" # suitable for a c5.4xlarge
      register: out
      become: yes
      async: 36000 # 10 hours
      poll: 60
    
    - name: Print output
      debug:
        var: out.stdout_lines

    # - name: Set facts to skip ahead using start-at-task
    #   set_fact:
    #     node_id: "{{ tags['Dev'] }}"
    #     num_validators: 25

    - name: Fetch pregenerated transactions
      fetch:
        src: "/home/ubuntu/tx-cannon/program_deployments/all_deployments.txt"
        dest: "../../transaction_files/deploys-{{ snarkos_network }}-{{ num_validators }}val-{{ node_id }}.txt"
        flat: yes
  tags: tx-cannon
