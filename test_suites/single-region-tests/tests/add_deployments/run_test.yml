- name: Check if all programs are deployed
  hosts: snarkos_validator[1]
  become: true
  remote_user: ubuntu
  become_user: ubuntu
  tasks:
    - name: Wait for multiple endpoints with rescue on fail, so logs are downloaded  always
      block:
        - name: Wait for multiple endpoints to be ready
          vars:
            endpoints:
              - "http://localhost:3030/{{ snarkos_network }}/program/ridiculous_finalize_hash.aleo"
              - "http://localhost:3030/{{ snarkos_network }}/program/hello_hello.aleo"
              - "http://localhost:3030/{{ snarkos_network }}/program/calculator.aleo"
              - "http://localhost:3030/{{ snarkos_network }}/program/temperatureconverter.aleo"
              - "http://localhost:3030/{{ snarkos_network }}/program/animals_nft_v30.aleo"
              - "http://localhost:3030/{{ snarkos_network }}/program/ideaground_friends_beta9.aleo"
              - "http://localhost:3030/{{ snarkos_network }}/program/cassino_game_test_fp.aleo"
              - "http://localhost:3030/{{ snarkos_network }}/program/twoadicity_mmbbn88.aleo"
              - "http://localhost:3030/{{ snarkos_network }}/program/ideaground_friends_beta1.aleo"
              - "http://localhost:3030/{{ snarkos_network }}/program/ans_coupon_card_v1.aleo"
              - "http://localhost:3030/{{ snarkos_network }}/program/root_1_5_2.aleo"
              - "http://localhost:3030/{{ snarkos_network }}/program/root_2_4_2.aleo"
              - "http://localhost:3030/{{ snarkos_network }}/program/root_1_31_1.aleo"
              - "http://localhost:3030/{{ snarkos_network }}/program/root_2_30_1.aleo"
          run_once: true
          block:
            - name: Check each endpoint max. 10 minutes a piece.
              uri:
                url: "{{ item }}"
                method: GET
                status_code: 200
                timeout: 10
              register: result
              until: result.status == 200
              retries: 30
              delay: 20
              loop: "{{ endpoints }}"

      rescue:
        - name: Mark validator check failed
          set_fact:
            validator_check_failed: true

      always:
        - name: Zip txcannon logs from all nodes
          delegate_to: "{{ item }}"
          archive:
            path: "/home/ubuntu/txcannon.log"
            dest: "/home/ubuntu/txcannon.log.gz"
            mode: "0644"
          ignore_errors: true
          loop: "{{ groups['tx_cannon_node'] }}"

        - name: Fetch txcannon logs
          delegate_to: "{{ item }}"
          fetch:
            src: "/home/ubuntu/txcannon.log.gz"
            dest: "../../log_files/tx_cannon_{{ item }}.log.gz"
            flat: true
          ignore_errors: true
          loop: "{{ groups['tx_cannon_node'] }}"

        - name: Fail explicitly if validator check failed
          fail:
            msg: "One or more program endpoints did not become ready."
          when: validator_check_failed | default(false)
