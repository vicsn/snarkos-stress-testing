# ------------------------------------------------
# tx-cannon

# Get load balancer DNS name
- name: Gather information about all ELBs
  hosts: localhost
  gather_facts: false
  remote_user: ubuntu
  tasks:
    - name: Wait for the network to be healthly
      uri:
        url: "http://{{ test_network_url }}:3030/{{ snarkos_network }}/block/height/latest"
        method: GET
        status_code: 200
        timeout: 10
      register: result
      until: result.status == 200
      retries: 10
      delay: 10
  tags: tx-cannon

# prepare the cannons
- name: Install and Configure tx-cannon on all nodes
  hosts: tx_cannon_node
  become: true
  remote_user: ubuntu
  vars:
    ecr_region: "{{ txcannon_ecr_region | default('us-east-1') }}"
    ecr_repo: "{{ txcannon_ecr_repo | default('637423331354.dkr.ecr.us-east-1.amazonaws.com/tx-cannon') }}"
    image_tag: "{{ txcannon_image_tag | default('latest') }}"
  roles:
    - txcannon_setup_ecr
    - logstash_txcannon_setup
  tags: tx-cannon

# Deploy programs
- name: Deploy programs to tx-cannon server 0
  hosts: tx_cannon_node[0]
  become: true
  remote_user: ubuntu
  become_user: ubuntu
  tasks:
    - name: Set txs_accounts
      set_fact:
        txs_accounts: "{{ hostvars['localhost'].validator_data.accounts }}"

    - name: Deploy base programs
      ansible.builtin.shell:
        cmd: |
          tx-cannon batch-deploy \
          --manifest tests/normal_network_traffic/normal_network_traffic.txt \
          --endpoint http://{{ hostvars['localhost']['test_network_url'] }}:3030 \
          -a {{ txs_accounts[0].private_key }} \
          --concurrent-deployments 1 \
          --check-retries 5 \
          --network {{ snarkos_network }} >> /home/ubuntu/txcannon.log 2>&1
      async: 1800
      poll: 0
      register: deploy_results

- name: Deploy programs to tx-cannon server 1
  hosts: tx_cannon_node[1]
  become: true
  remote_user: ubuntu
  become_user: ubuntu
  tasks:
    - name: Set txs_accounts
      set_fact:
        txs_accounts: "{{ hostvars['localhost'].validator_data.accounts }}"

    - name: Deploy nested programs
      ansible.builtin.shell:
        cmd: |
          tx-cannon batch-deploy --manifest {{ manifest }} \
            --endpoint http://{{ hostvars['localhost']['test_network_url'] }}:3030 \
            -a {{ txs_accounts[1].private_key }} \
            --concurrent-deployments 1 \
            --check-retries 20 \
            --network {{ snarkos_network }} > /home/ubuntu/txcannon.log 2>&1
      async: 1800
      poll: 0
      loop:
        - tests/nested_imports/generated_programs/generated_programs_1_31_1.txt
      loop_control:
        loop_var: manifest
      register: deploy_results

