[package]
name = "tx_submitter"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.39", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "sync"] }
reqwest = { version = "0.12", features = ["json", "http2", "stream"] }
aws-config = "1"
aws-sdk-s3 = "1"
chrono = { version = "0.4", features = ["clock"] }
once_cell = "1"
regex = "1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
time = "0.3"
anyhow = "1"
futures = "0.3"
walkdir = "2"
serde_json = "1"
