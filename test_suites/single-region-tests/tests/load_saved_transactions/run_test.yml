- name: Split pregenerated transactions and submit them in parallel
  hosts: localhost
  gather_facts: yes
  tasks:
    - name: Create Python virtual environment
      args:
        chdir: "{{ playbook_dir }}"
        creates: "{{ playbook_dir }}/.venv/bin/activate"
      command: python3 -m venv .venv

    - name: Install script dependencies into virtualenv
      command: "{{ playbook_dir }}/.venv/bin/pip install -r requirements.txt"
      environment:
        PIP_BREAK_SYSTEM_PACKAGES: "1"

    - name: Run the python program using virtualenv
      command:
        argv:
          - "{{ playbook_dir }}/.venv/bin/python"
          - split_transactions_and_submit_parallel.py
          - "{{ snarkos_network }}"
          - "provable-pregenerated-transactions"
          - "{{ pregeneration_bucket_path }}"
          - "{{ pregeneration_execution_tx_count }}"
          - "{{ pregeneration_deployment_tx_count }}"
          - "{{ txs_target_consensus_version }}"
          - "{{ txs_target_consensus_version_height }}"
      register: out

    - name: Print the output
      debug:
        var: out.stdout_lines
