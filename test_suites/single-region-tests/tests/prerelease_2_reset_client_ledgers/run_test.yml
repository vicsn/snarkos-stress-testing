- name: Set bootstrap clients related facts
  hosts: localhost
  any_errors_fatal: true
  roles:
    - choose_bootstrap_client
  tasks:
    - name: Put bootstrap hosts into an inventory group
      add_host:
        name: "{{ item }}"
        groups: bootstrap_clients
      loop: "{{ hostvars['localhost'].bootstrap_clients | default([]) }}"

- name: Reset all clients in parallel
  hosts: snarkos_client:!bootstrap_clients
  remote_user: ubuntu
  become: true
  strategy: free
  pre_tasks:
    - name: Set Client facts
      include_tasks: ../../playbooks/set_client_facts.yml

    - name: Stop the honest clients
      systemd:
        name: snarkos
        state: stopped

    - name: Stop the malice clients
      systemd:
        name: snarkos-malice
        state: stopped
      ignore_errors: yes  # in case we never deployed malice

    - name: Remove existing ledgers on clients
      ansible.builtin.shell: |
        set -euo pipefail
        shopt -s nullglob dotglob
        for d in /home/ubuntu/.ledger-*; do
          [ -d "$d" ] || continue
          find "$d" -mindepth 1 -maxdepth 1 \
            ! -name 'cached_router_peers' \
            ! -name 'cached_gateway_peers' \
            -exec rm -rf {} +
        done
      args:
        executable: /bin/bash

  roles:
    - snarkos_service
  tags: snarkos_client

# Strategy: free doesn't work when we have `pause` and is_synced calls it, so we do it in 3-4 batches instead:
- name: Check sync status in up to 30% of clients at a time
  hosts: snarkos_client:!bootstrap_clients
  remote_user: ubuntu
  become: true
  serial: "30%"
  any_errors_fatal: true
  tasks:
    - name: Wait for the network to advance one block before this host’s sync check
      include_tasks: ../../playbooks/wait_network_advance.yml
      vars:
        node_to_check: "localhost"

    - name: Build ordered host list (inventory order)
      set_fact:
        all_hosts: "{{ ansible_play_hosts_all | list }}"

    - name: Index of current host (ensure int)
      set_fact:
        current_index: "{{ (all_hosts | list).index(inventory_hostname) | int }}"

    - name: Rotate list to start after current (range+extract; fully int-cast)
      set_fact:
        rotated_after_current: >-
          {{
            (range((current_index | int) + 1, (all_hosts | length | int)) | map('extract', all_hosts) | list)
            +
            (range(0, (current_index | int)) | map('extract', all_hosts) | list)
          }}

    - name: Hosts not in the current batch (the other ~70%)
      set_fact:
        non_batch_hosts: "{{ rotated_after_current | difference(ansible_play_batch | default([])) | list }}"

    - name: Choose a next host outside the batch
      set_fact:
        next_host: "{{ non_batch_hosts | first | default('none') }}"

    - name: Check if the node is synced
      include_tasks: ../../playbooks/is_synced.yml
      vars:
        node_to_check: "localhost"
        node_to_compare: "{{ next_host }}"
        retries_var: 30
        delay_var: 30
