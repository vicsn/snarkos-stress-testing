- name: Fetch logs from validators
  hosts: snarkos_validator
  become: true
  remote_user: ubuntu
  pre_tasks:
    - name: Set validator facts
      include_tasks: ../../playbooks/set_validator_facts.yml
  tasks:
    - name: Zip logs
      archive:
        path: "/tmp/snarkos.log"
        dest: "/tmp/snarkos.log.gz"
        mode: "0644"

    - name: Determine how big the zipped file is.
      command: du -sh /tmp/snarkos.log.gz
      register: du_output

    - name: "Check logs size"
      debug:
        var: du_output

    - name: Fetch logs
      fetch:
        src: "/tmp/snarkos.log.gz"
        dest: "../../log_files/val-{{ node_id }}.log.gz"
        flat: true
