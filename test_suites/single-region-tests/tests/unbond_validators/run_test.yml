- name: Set up and run unbond
  hosts: snarkos_client[0]
  become: yes
  remote_user: ubuntu
  vars:
    file_path: "/home/ubuntu/validator_keys.txt"
  tasks:
    - name: Copy validator keys
      copy:
        src: validator_keys.txt
        dest: "{{ file_path }}"
        mode: '0644'
    - name: Timestamp before tx-cannon unbond-nodes
      debug:
        msg: "{{ now() }}"

    - name: Determine the number of instances
      set_fact:
        total_nodes: "{{ groups['snarkos_validator'] | length }}"

    - name: Calculate 30% of total nodes
      set_fact:
        nodes_to_process: "{{ ((total_nodes | int) * 0.3) | round(0, 'ceil') | int }}"

    - name: Read file and save 30% of the lines
      ansible.builtin.shell: "head -n {{ nodes_to_process }} {{ file_path }}"
      register: selected_nodes

    - name: Fetch committee data
      ansible.builtin.uri:
        url: "http://{{ test_network_url }}:3030/mainnet/committee/latest"
        return_content: yes
        method: GET
      register: curl_output

    - name: Parse JSON from the fetched content
      set_fact:
        committee_data: "{{ (curl_output.content | from_json) }}"

    - name: Timestamp before unbonding nodes
      debug:
        msg: "{{ now() }}"

    - name: Try unbonding 30% nodes
      ansible.builtin.shell:
        sudo bash -c "/usr/bin/snarkos developer execute credits.aleo unbond_public {{ item[1] }} {{ committee_data.members[item[1]][0] }}u64 --private-key {{ item[0] }} --query 'http://{{ test_network_url }}:3030' --broadcast 'http://{{ test_network_url }}:3030/mainnet/transaction/broadcast'"
      args:
        executable: /bin/bash
      loop: "{{ selected_nodes.stdout_lines | map('from_json') | list }}"

    - name: Pause the playbook for 2 hours
      ansible.builtin.pause:
        minutes: 120

    - name: Set valid withdrawal addresses
      set_fact:
        valid_withdrawal_addresses:
          - "aleo1ashyu96tjwe63u0gtnnv8z5lhapdu4l5pjsl2kha7fv7hvz2eqxs5dz0rg"
          - "aleo12ux3gdauck0v60westgcpqj7v8rrcr3v346e4jtq04q7kkt22czsh808v2"
          - "aleo1p9sg8gapg22p3j42tang7c8kqzp4lhe6mg77gx32yys2a5y7pq9sxh6wrd"
          - "aleo1l4z0j5cn5s6u6tpuqcj6anh30uaxkdfzatt9seap0atjcqk6nq9qnm9eqf"
          - "aleo1s3ws5tra87fjycnjrwsjcrnw2qxr8jfqqdugnf0xzqqw29q9m5pqem2u4t"

    - name: claim unbond
      ansible.builtin.shell:
        sudo bash -c "/usr/bin/snarkos developer execute credits.aleo claim_unbond_public {{ item[1] }} --private-key {{ item[0] }} --query 'http://{{ test_network_url }}:3030' --broadcast 'http://{{ test_network_url }}:3030/mainnet/transaction/broadcast'"
      args:
        executable: /bin/bash
      loop: "{{ selected_nodes.stdout_lines | map('from_json') | list }}"

    - name: Pause the playbook for 1 min
      ansible.builtin.pause:
        minutes: 1

    - name: Timestamp before rebonding nodes
      debug:
        msg: "{{ now() }}"

    - name: Try rebonding 30% nodes
      ansible.builtin.shell:
        sudo bash -c "/usr/bin/snarkos developer execute credits.aleo bond_validator {{ valid_withdrawal_addresses[idx] }} 50000000000000u64 5u8 --private-key {{ item[0] }} --query 'http://{{ test_network_url }}:3030' --broadcast 'http://{{ test_network_url }}:3030/mainnet/transaction/broadcast'"
      args:
        executable: /bin/bash
      register: shell_output
      loop: "{{ selected_nodes.stdout_lines | map('from_json') | list }}"
      loop_control:
        index_var: idx
