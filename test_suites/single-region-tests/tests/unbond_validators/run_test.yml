- name: Gather information about all ELBs
  hosts: localhost
  gather_facts: no
  remote_user: ubuntu
  tasks:
    - name: Wait for the network to be healthly
      uri:
        url: "http://{{ test_network_url }}:3030/{{ snarkos_network }}/block/height/latest"
        method: GET
        status_code: 200
        timeout: 10
      register: result
      until: result.status == 200
      retries: 10
      delay: 10

- name: Set up and run unbond
  hosts: snarkos_client[0]
  become: yes
  remote_user: ubuntu
  vars:
    file_path: "/home/ubuntu/validator_keys.txt"
  tasks:
    - name: Set txs_accounts
      set_fact:
        txs_accounts: "{{ hostvars['localhost'].validator_data.accounts }}"

    - name: Convert txs_accounts dicts to array lines
      set_fact:
        address_lines: |
          {% set out = [] %}
          {% for item in txs_accounts %}
          {% set _ = out.append('["' ~ item.private_key ~ '", "' ~ item.address ~ '"]') %}
          {% endfor %}
          {{ out }}

    - name: Write address pairs to file
      copy:
        dest: "{{ file_path }}"
        content: "{{ address_lines | join('\n') }}"
        mode: '0644'

    - name: Timestamp before tx-cannon unbond-nodes
      debug:
        msg: "{{ now() }}"

    - name: Determine the number of instances
      set_fact:
        total_nodes: "{{ groups['snarkos_validator'] | length }}"

    - name: Calculate 30% of total nodes
      set_fact:
        nodes_to_process: "{{ ((total_nodes | int) * 0.3) | round(0, 'ceil') | int }}"

    - name: Read file and save 30% of the lines
      ansible.builtin.shell: "head -n {{ nodes_to_process }} {{ file_path }}"
      register: selected_nodes

    - name: Fetch committee data
      ansible.builtin.uri:
        url: "http://{{ test_network_url }}:3030/{{ snarkos_network }}/committee/latest"
        return_content: yes
        method: GET
      register: curl_output

    - name: Parse JSON from the fetched content
      set_fact:
        committee_data: "{{ (curl_output.content | from_json) }}"

    - name: Timestamp before unbonding nodes
      debug:
        msg: "{{ now() }}"

    - name: Try unbonding 30% nodes
      ansible.builtin.shell: >-
        sudo bash -c "/usr/bin/snarkos developer execute credits.aleo unbond_public {{ item[1] }} \
                      {{ committee_data.members[item[1]][0] }}u64 --private-key {{ item[0] }} \
                      --query 'http://{{ test_network_url }}:3030' \
                      --network {{ snarkos_network_int }} \
                      --broadcast 'http://{{ test_network_url }}:3030/{{ snarkos_network }}/transaction/broadcast'"

      args:
        executable: /bin/bash
      loop: "{{ selected_nodes.stdout_lines | map('from_json') | list }}"

    - name: Pause the playbook for 2 hours
      ansible.builtin.pause:
        minutes: 120

    - name: Set valid withdrawal addresses
      set_fact:
        valid_withdrawal_addresses:
          - txs_accounts[1].address
          - txs_accounts[2].address
          - txs_accounts[3].address
          - txs_accounts[4].address
          - txs_accounts[5].address

    - name: Claim unbond
      ansible.builtin.shell: >-
        sudo bash -c "/usr/bin/snarkos developer execute credits.aleo claim_unbond_public {{ item[1] }} \
                      --private-key {{ item[0] }} --query 'http://{{ test_network_url }}:3030' \
                      --network {{ snarkos_network_int }} \
                      --broadcast 'http://{{ test_network_url }}:3030/{{ snarkos_network }}/transaction/broadcast'"

      args:
        executable: /bin/bash
      loop: "{{ selected_nodes.stdout_lines | map('from_json') | list }}"

    - name: Pause the playbook for 1 min
      ansible.builtin.pause:
        minutes: 1

    - name: Timestamp before rebonding nodes
      debug:
        msg: "{{ now() }}"

    - name: Try rebonding 30% nodes
      ansible.builtin.shell: >-
        sudo bash -c "/usr/bin/snarkos developer execute credits.aleo bond_validator \
                      {{ valid_withdrawal_addresses[idx] }} 50000000000000u64 5u8 --private-key {{ item[0] }} \
                      --query 'http://{{ test_network_url }}:3030' \
                      --network {{ snarkos_network_int }} \
                      --broadcast 'http://{{ test_network_url }}:3030/{{ snarkos_network }}/transaction/broadcast'"
      args:
        executable: /bin/bash
      register: shell_output
      loop: "{{ selected_nodes.stdout_lines | map('from_json') | list }}"
      loop_control:
        index_var: idx
