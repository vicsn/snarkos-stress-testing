- name: Set bootstrap clients related facts
  hosts: localhost
  any_errors_fatal: true
  roles:
    - choose_bootstrap_client

- name: Gather full validator host list (unaffected by serial batching)
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Store all snarkos_validator hosts
      set_fact:
        all_validator_hosts: "{{ groups['snarkos_validator'] | list }}"

- name: Reset validators
  hosts: snarkos_validator
  remote_user: ubuntu
  become: true
  # Restart 30% of all validators at a time.
  serial: "30%"
  pre_tasks:
    - name: Set Validators facts
      include_tasks: ../../playbooks/set_validator_facts.yml

    - name: Stop the honest validators
      systemd:
        name: snarkos
        state: stopped

    - name: Stop the malice validators
      systemd:
        name: snarkos-malice
        state: stopped
      ignore_errors: yes # in case we never deployed malice

    - name: Remove existing ledgers on validators
      # Also remove the proposal cache, so it is not out of sync with the ledger
      ansible.builtin.shell: |
        set -euo pipefail
        shopt -s nullglob dotglob
        rm -rf .ledger-*
        rm -rf .node-data-*/current-proposal-cache
      args:
        executable: /bin/bash

  post_tasks:
    - name: Wait for the network to advance one block before this host’s sync check
      include_tasks: ../../playbooks/wait_network_advance.yml
      vars:
        node_to_check: "localhost"

    - name: Build ordered host list (all validators, from localhost)
      set_fact:
        all_hosts: "{{ hostvars['localhost']['all_validator_hosts'] | list }}"

    - name: Hosts not in the current batch (the remaining ~70%)
      set_fact:
        non_batch_hosts: "{{ all_hosts | difference(ansible_play_batch | default([])) | list }}"

    - name: Choose the next host outside the batch
      set_fact:
        next_host: "{{ non_batch_hosts | first | default('none') }}"

    # NOTE: We want to restart only a byzantine minority of nodes. So we wait
    # for all of the previously stopped nodes to be close to tip before we
    # restart the next node. The set of (stopped+syncing) nodes is at most f.
    # Moreover, syncing nodes should be able to sync up to MAX_BLOCKS_BEHIND
    # to participate in consensus again.
    - name: Check if the node is synced.
      include_tasks: ../../playbooks/is_synced.yml
      when: next_host != 'none'
      vars:
        node_to_check: localhost
        node_to_compare: "{{ next_host }}"
        retries_var: 10
        delay_var: 30

  roles:
    - snarkos_service
  tags: snarkos
