- name: _pregenerate_transactions | generate_txs | Print which transaction we are generating
  debug:
    msg: "Generating transaction {{ index }} of {{ pregeneration_tx_count }}"
  loop: "{{ current_batch }}"
  loop_control:
    loop_var: index
    label: "tx {{ index }}"

- name: _pregenerate_transactions | generate_txs | Start async jobs for transaction batch {{ current_batch }}
  ansible.builtin.shell: |
    echo "Generating transaction {{ index }} of {{ pregeneration_tx_count }}"

    {{ snarkos_bin_path }}/snarkos developer execute \
      --private-key APrivateKey1zkp8CZNn3yeCseEtxuVPbDCwSyhGW6yZKUYKfgXmcpoGPWH \
      --query '{"state_root": "{{ txs_target_state_root }}", "height": {{ txs_target_consensus_version_height }}}' \
      credits.aleo transfer_public aleo1rhgdu77hgyqd3xjj8ucu3jj9r2krwz6mnzyd80gncr5fxcwlh5rsvzp9px 1000u64 \
      --network {{ snarkos_network_int }} \
      --store /tmp/transfer_public_tx{{ index }}.txt \
      --store-format string >> transaction_pregeneration.log
  args:
    executable: /bin/bash
  async: 300
  poll: 0
  loop: "{{ current_batch }}"
  loop_control:
    loop_var: index
    label: "tx {{ index }}"
  register: batch_async_jobs

- name: _pregenerate_transactions | generate_txs | Return batch_async_jobs from include
  set_fact:
    current_batch_result_jobs: "{{ batch_async_jobs }}"
