- name: Divide hosts into first 30% and the rest
  hosts: snarkos_validator
  remote_user: ubuntu
  tasks:
    - name: Group the first 30% of hosts
      group_by:
        key: "{{ 'malice_validator' if (groups['snarkos_validator'].index(inventory_hostname) < (groups['snarkos_validator'] | length * 0.3) | round(0, 'floor')) else 'rest' }}"

- name: Install malicious snarkos
  hosts: malice_validator
  remote_user: ubuntu
  become: true
  pre_tasks:
    - name: Set Validators facts
      include_tasks: ../../playbooks/set_validator_facts.yml

    - name: Set malice specific facts
      set_fact:
        malicemode: Environment="PeerResponseFlood=1"
        snarkos_binary_name: snarkos-malice
      run_once: true

    - name: Set snarkos command with peers and validators
      set_fact:
        snarkos_command: >-
          {{ snarkos_binary_name }} start --metrics --nodisplay --bft 0.0.0.0:5000 --rest 0.0.0.0:3030 \
            --peers {{ validator_client_ips }} --validators {{ formatted_validator_ips }} \
            --verbosity {{ snarkos_verbosity }} --dev {{ node_id }} --dev-num-validators {{ num_instances }} \
            --validator --rest-rps {{ rest_rps }} --no-dev-txs --network {{ snarkos_network_int }}
  roles:
    - snarkos_service

- name: Pause
  hosts: localhost
  tasks:
    - name: Pause for 30 minutes
      pause:
        minutes: 30

- name: Undo malicemode
  hosts: malice_validator
  remote_user: ubuntu
  become: true
  pre_tasks:
    - name: Set malice specific facts
      set_fact:
        malicemode: ""
        snarkos_binary_name: snarkos
      run_once: true

    - name: Set snarkos command with peers and validators
      set_fact:
        snarkos_command: >-
          {{ snarkos_binary_name }} start --metrics --nodisplay --bft 0.0.0.0:5000 --rest 0.0.0.0:3030 \
            --peers {{ validator_client_ips }} --validators {{ formatted_validator_ips }} \
            --verbosity {{ snarkos_verbosity }} --dev {{ node_id }} --dev-num-validators {{ num_instances }} \
            --validator --rest-rps {{ rest_rps }} --no-dev-txs --network {{ snarkos_network_int }}
  roles:
    - snarkos_service
