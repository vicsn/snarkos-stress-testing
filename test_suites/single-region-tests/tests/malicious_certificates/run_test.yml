- name: Install malicious snarkos
  hosts: snarkos_validator[1]
  remote_user: ubuntu
  become: true
  pre_tasks:
    - include_tasks: ../../playbooks/set_validator_facts.yml

    - name: set malice specific facts
      set_fact:
        malicemode: Environment="WithholdLeaderCertificate=1"
        snarkos_binary_name: snarkos-malice
      run_once: true

    - name: Set snarkos command with peers and validators
      set_fact:
        snarkos_command: "{{ snarkos_binary_name }} start --metrics --nodisplay --bft 0.0.0.0:5000 --rest 0.0.0.0:3030 --peers {{ validator_client_ips }} --validators {{ formatted_validator_ips }} --verbosity {{ snarkos_verbosity }} --dev {{ validator_id }} --dev-num-validators {{ num_instances }} --validator --rest-rps 10 --no-dev-txs"
  roles:
    - snarkos_service

- name: Pause for 30 minutes
  hosts: localhost
  tasks:
    - name: Pause for 30 minutes
      pause:
        minutes: 30

- name: Undo malicemode
  hosts: snarkos_validator[1]
  remote_user: ubuntu
  become: true
  pre_tasks:
    - name: set malice specific facts
      set_fact:
        malicemode: ""
        snarkos_binary_name: snarkos
      run_once: true

    - name: stop snarkos
      systemd:
        name: snarkos
        state: stopped

    - name: Remove existing .ledger-* directories on malice validators
      ansible.builtin.shell:
        cmd: "rm -rf /home/ubuntu/.ledger-*"

    - name: Set snarkos command with peers and validators
      set_fact:
        snarkos_command: "{{ snarkos_binary_name }} start --metrics --nodisplay --bft 0.0.0.0:5000 --rest 0.0.0.0:3030 --peers {{ validator_client_ips }} --validators {{ formatted_validator_ips }} --verbosity {{ snarkos_verbosity }} --dev {{ validator_id }} --dev-num-validators {{ num_instances }} --validator --rest-rps 10 --no-dev-txs"
  roles:
    - snarkos_service