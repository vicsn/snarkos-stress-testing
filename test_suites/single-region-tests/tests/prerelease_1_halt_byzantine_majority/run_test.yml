- name: Run test 3 times
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Include restart tasks
      include_tasks: restart.yml
      loop: "{{ range(1, 4) | list }}"

- name: Gather full validator host list (unaffected by serial batching)
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Store all snarkos_validator hosts
      set_fact:
        all_validator_hosts: "{{ groups['snarkos_validator'] | list }}"

- name: Check the all the validators are synced
  hosts: snarkos_validator
  remote_user: ubuntu
  become: true
  serial: "30%"
  tasks:
    - name: Set Validators facts
      include_tasks: ../../playbooks/set_validator_facts.yml

    - name: Wait for the network to advance one block before this host’s sync check
      include_tasks: ../../playbooks/wait_network_advance.yml
      vars:
        node_to_check: "localhost"

    - name: Build ordered host list (all validators, from localhost)
      set_fact:
        all_hosts: "{{ hostvars['localhost']['all_validator_hosts'] | list }}"

    - name: Hosts not in the current batch (the remaining ~70%)
      set_fact:
        non_batch_hosts: "{{ all_hosts | difference(ansible_play_batch | default([])) | list }}"

    - name: Choose the next host outside the batch
      set_fact:
        next_host: "{{ non_batch_hosts | first | default('none') }}"

    - name: Check if the node is synced.
      include_tasks: ../../playbooks/is_synced.yml
      when: next_host != 'none'
      vars:
        node_to_check: localhost
        node_to_compare: "{{ next_host }}"
        retries_var: 30
        delay_var: 30
