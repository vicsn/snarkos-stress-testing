# ------------------------------------------------
# tx-cannon

# Get load balancer DNS name
- name: Gather information about all ELBs
  hosts: localhost
  gather_facts: false
  remote_user: ubuntu
  tasks:
    - name: Wait for the network to be healthly
      uri:
        url: "http://{{ test_network_url }}:3030/{{ snarkos_network }}/block/height/latest"
        method: GET
        status_code: 200
        timeout: 10
      register: result
      until: result.status == 200
      retries: 10
      delay: 10
  tags: tx-cannon

# prepare the cannons
- name: Install and Configure tx-cannon on all nodes
  hosts: tx_cannon_node
  become: true
  remote_user: ubuntu
  vars:
    txcannon_setup_s3_bucket: "{{ txcannon_s3_bucket | default('provable-binaries-releases') }}"
  roles:
    - { role: txcannon_setup_s3, when: use_prebuild_tx_cannon is defined }
    - { role: txcannon_setup, when: use_prebuild_tx_cannon is undefined }
    - logstash_txcannon_setup
  tags: tx-cannon

# run deploy tx-cannon
- name: Deploy programs
  hosts: tx_cannon_node
  become: true
  remote_user: ubuntu
  tasks:
    - name: Deploy base programs
      ansible.builtin.shell:
        cmd: |
          tx-cannon deploy -p /home/ubuntu/tx-cannon/tests/ridiculous_finalize_hash/{{ program }} \
          --endpoint http://{{ hostvars['localhost']['test_network_url'] }}:3030 \
          -k APrivateKey1zkp8CZNn3yeCseEtxuVPbDCwSyhGW6yZKUYKfgXmcpoGPWH \
          --network {{ snarkos_network }} > /home/ubuntu/txcannon.log 2>&1
      loop:
        - ridiculous_finalize_hash.aleo
      loop_control:
        loop_var: program
      register: deploy_results

    - name: Batch-deploy base program with different accounts
      ansible.builtin.shell:
        cmd: |
          tx-cannon batch-deploy \
          --manifest /home/ubuntu/tx-cannon/tests/normal_network_traffic/normal_network_traffic.txt \
          --endpoint http://{{ hostvars['localhost']['test_network_url'] }}:3030 \
          -a APrivateKey1zkp8CZNn3yeCseEtxuVPbDCwSyhGW6yZKUYKfgXmcpoGPWH,\
          APrivateKey1zkp2RWGDcde3efb89rjhME1VYA8QMxcxep5DShNBR6n8Yjh,\
          APrivateKey1zkp2GUmKbVsuc1NSj28pa1WTQuZaK5f1DQJAT6vPcHyWokG,\
          APrivateKey1zkpBjpEgLo4arVUkQmcLdKQMiAKGaHAQVVwmF8HQby8vdYs,\
          APrivateKey1zkp3J6rRrDEDKAMMzSQmkBqd3vPbjp4XTyH7oMKFn7eVFwf \
          --network {{ snarkos_network }} > /home/ubuntu/txcannon2.log 2>&1
      register: deploy_results

    - name: Deploy nested programs
      ansible.builtin.shell:
        cmd: |
          tx-cannon batch-deploy --manifest {{ manifest }} \
            --endpoint http://{{ hostvars['localhost']['test_network_url'] }}:3030 \
            -a APrivateKey1zkp8CZNn3yeCseEtxuVPbDCwSyhGW6yZKUYKfgXmcpoGPWH  --check-retries 10 \
            --concurrent-deployments 1 --network {{ snarkos_network }} > /home/ubuntu/txcannon3.log 2>&1
      loop:
        - /home/ubuntu/tx-cannon/tests/nested_imports/generated_programs/generated_programs_1_31_1.txt
        - /home/ubuntu/tx-cannon/tests/nested_imports/generated_programs/generated_programs_1_5_2.txt
        - /home/ubuntu/tx-cannon/tests/nested_imports/generated_programs/generated_programs_2_30_1.txt
        - /home/ubuntu/tx-cannon/tests/nested_imports/generated_programs/generated_programs_2_4_2.txt
      loop_control:
        loop_var: manifest
      register: deploy_results

    - name: Debugging nested
      debug:
        msg: "{{ deploy_results }}"

    - name: Wait for multiple endpoints to be ready
      vars:
        endpoints:
          - "http://localhost:3030/{{ snarkos_network }}/program/ridiculous_finalize_hash.aleo"
          - "http://localhost:3030/{{ snarkos_network }}/program/hello_hello.aleo"
          - "http://localhost:3030/{{ snarkos_network }}/program/calculator.aleo"
          - "http://localhost:3030/{{ snarkos_network }}/program/temperatureconverter.aleo"
          - "http://localhost:3030/{{ snarkos_network }}/program/animals_nft_v30.aleo"
          - "http://localhost:3030/{{ snarkos_network }}/program/ideaground_friends_beta9.aleo"
          - "http://localhost:3030/{{ snarkos_network }}/program/cassino_game_test_fp.aleo"
          - "http://localhost:3030/{{ snarkos_network }}/program/twoadicity_mmbbn88.aleo"
          - "http://localhost:3030/{{ snarkos_network }}/program/ideaground_friends_beta1.aleo"
          - "http://localhost:3030/{{ snarkos_network }}/program/ans_coupon_card_v1.aleo"
          - "http://localhost:3030/{{ snarkos_network }}/program/root_1_31_1.aleo"
          - "http://localhost:3030/{{ snarkos_network }}/program/root_1_5_2.aleo"
          - "http://localhost:3030/{{ snarkos_network }}/program/root_2_30_1.aleo"
          - "http://localhost:3030/{{ snarkos_network }}/program/root_2_4_2.aleo"
      run_once: true
      delegate_to: "{{ groups['snarkos_validator'][1] }}"
      block:
        - name: Check each endpoint
          uri:
            url: "{{ item }}"
            method: GET
            status_code: 200
            timeout: 10
          register: result
          until: result.status == 200
          retries: 5
          delay: 2
          loop: "{{ endpoints }}"
  tags: tx-cannon-deploy

- name: Download cannon logs
  hosts: tx_cannon_node
  become: true
  remote_user: ubuntu
  tasks:
    - name: Zip txcannon logs
      archive:
        path: "/home/ubuntu/{{ log_file }}.log"
        dest: "/home/ubuntu/{{ log_file }}.log.gz"
        mode: "0644"
      loop:
        - txcannon
        - txcannon2
        - txcannon3
      loop_control:
        loop_var: log_file

    - name: Fetch txcannon logs
      fetch:
        src: "/home/ubuntu/{{ log_file }}.log.gz"
        dest: "../../log_files/{{ log_file }}.log.gz"
        flat: true
      loop:
        - txcannon
        - txcannon2
        - txcannon3
      loop_control:
        loop_var: log_file
  tags: tx-cannon-logs
