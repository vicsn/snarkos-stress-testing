- name: prerelease_5_swap_ledgers | swap | Stop the validators in the current group
  ansible.builtin.systemd:
    name: snarkos
    state: stopped
  delegate_to: "{{ node }}"
  become: true
  remote_user: ubuntu
  loop: "{{ current_group }}"
  loop_control:
    loop_var: node

- name: prerelease_5_swap_ledgers | swap | Pause for 60 seconds
  pause:
    seconds: 60

- name: prerelease_5_swap_ledgers | swap | Remove existing .ledger-0-* directories on each validator
  ansible.builtin.shell:
    cmd: "rm -rf /home/ubuntu/.ledger-0-*"
  delegate_to: "{{ node }}"
  loop: "{{ current_group }}"
  loop_control:
    loop_var: node
  become: true
  remote_user: ubuntu

- name: prerelease_5_swap_ledgers | swap | Adjust permissions for .ledger-0-* directories
  ansible.builtin.file:
    path: "/home/ubuntu/.ledger-0-*"
    owner: ubuntu
    group: ubuntu
    mode: '0755'
    recurse: yes
  delegate_to: "{{ source_node }}"
  become: true
  remote_user: ubuntu

- name: prerelease_5_swap_ledgers | swap | Archive .ledger-0-* directories on source node
  ansible.builtin.shell:
    cmd: "tar -czf /tmp/ledger_backup.tar.gz /home/ubuntu/.ledger-0-*"
  delegate_to: "{{ source_node }}"
  remote_user: ubuntu
  retries: 15
  delay: 20
  register: archive_result
  until: archive_result is not failed

- name: prerelease_5_swap_ledgers | swap | Remove existing ledger_backups.tar.gz to prevent checksum mismatches if copy failed but there was a version.
  ansible.builtin.shell:
    cmd: "rm -rf /home/ubuntu/aleo_testing/tests/swap_ledgers/ledger_backups/ledger_backup.tar.gz"
  delegate_to: "{{ node }}"
  remote_user: ubuntu
  loop: "{{ current_group }}"
  loop_control:
    loop_var: node

- name: prerelease_5_swap_ledgers | swap | Fetch ledger backup from source node
  ansible.builtin.fetch:
    src: "/tmp/ledger_backup.tar.gz"
    dest: "./ledger_backups/ledger_backup.tar.gz"
    flat: yes
  delegate_to: "{{ source_node }}"
  remote_user: ubuntu
  retries: 10
  delay: 10
  register: fetch_result
  until: fetch_result is not failed

- name: prerelease_5_swap_ledgers | swap | Copy ledger backup to each validator in the current group
  ansible.builtin.copy:
    src: "./ledger_backups/ledger_backup.tar.gz"
    dest: "/tmp/ledger_backup.tar.gz"
    mode: "0644"
  delegate_to: "{{ node }}"
  remote_user: ubuntu
  loop: "{{ current_group }}"
  loop_control:
    loop_var: node

- name: prerelease_5_swap_ledgers | swap | Extract ledger tarball on each validator in the current group
  ansible.builtin.shell:
    cmd: "tar -xzf /tmp/ledger_backup.tar.gz -C /home/ubuntu/"
  delegate_to: "{{ node }}"
  remote_user: ubuntu
  loop: "{{ current_group }}"
  loop_control:
    loop_var: node

- name: prerelease_5_swap_ledgers | swap | Pause for 60 seconds
  pause:
    seconds: 60

- name: prerelease_5_swap_ledgers | swap | Restart the validators in the current group
  ansible.builtin.systemd:
    name: snarkos
    state: restarted
  delegate_to: "{{ node }}"
  become: true
  remote_user: ubuntu
  loop: "{{ current_group }}"
  loop_control:
    loop_var: node

- name: prerelease_5_swap_ledgers | swap | Include tasks to retry. Configure max attempts and retry delay as needed.
  include_tasks: ../../playbooks/is_synced.yml
  vars:
    node_to_check: "{{ node }}"
    node_to_compare: "{{ source_node }}"
  loop: "{{ current_group }}"
  loop_control:
    loop_var: node

- name: prerelease_5_swap_ledgers | swap | Continue if synchronization is successful
  debug:
    msg: "Synchronization successful"
  when: sync_successful | default(false)
