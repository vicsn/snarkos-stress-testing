- name: Undo malicemode on validators
  hosts: snarkos_validator[1]
  remote_user: ubuntu
  become: true
  pre_tasks:
    - name: Stop the malice validators
      systemd:
        name: snarkos
        state: stopped

    - name: Remove existing .ledger-* directories on malice validators
      ansible.builtin.shell:
        cmd: "rm -rf /home/ubuntu/.ledger-*"

    - name: Set malice specific facts
      set_fact:
        malicemode: ""
        snarkos_binary_name: snarkos

    - name: Set snarkos command with peers and validators
      set_fact:
        snarkos_command: >-
          {{ snarkos_binary_name }} start --metrics --nodisplay --bft 0.0.0.0:5000 --rest 0.0.0.0:3030 \
            --peers {{ validator_client_ips }} --validators {{ formatted_validator_ips }} \
            --verbosity {{ snarkos_verbosity }} --dev {{ node_id }} --dev-num-validators {{ num_instances }} \
            --validator --rest-rps {{ rest_rps }} --no-dev-txs --network {{ snarkos_network_int }}
  roles:
    - snarkos_service

- name: Undo malicemode state on clients
  hosts: snarkos_client[1]
  remote_user: ubuntu
  become: true
  pre_tasks:
    - name: Set Client facts
      include_tasks: ../../playbooks/set_client_facts.yml

    - name: Stop the clients
      systemd:
        name: snarkos
        state: stopped

    - name: Remove existing .ledger-* directories on clients
      ansible.builtin.shell:
        cmd: "rm -rf /home/ubuntu/.ledger-*"
  roles:
    - snarkos_service
  tags: snarkos_client
