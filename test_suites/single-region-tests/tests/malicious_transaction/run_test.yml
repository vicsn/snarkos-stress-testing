- name: Install malicious snarkos
  hosts: snarkos_validator[1]
  remote_user: ubuntu
  become: true
  pre_tasks:
    - name: Set Validator facts
      include_tasks: ../../playbooks/set_validator_facts.yml

    - name: Set malice specific facts
      set_fact:
        malicemode: Environment="SkipTransactionCheck=1"
        snarkos_binary_name: snarkos-malice
      run_once: true

    - name: Set snarkos command with peers and validators
      set_fact:
        snarkos_command: >-
          {{ snarkos_binary_name }} start --metrics --nodisplay --bft 0.0.0.0:5000 --rest 0.0.0.0:3030 \
            --peers {{ validator_client_ips }} --validators {{ formatted_validator_ips }} \
            --verbosity {{ snarkos_verbosity }} --dev {{ node_id }} --dev-num-validators {{ num_instances }} \
            --validator --rest-rps {{ rest_rps }} --no-dev-txs --network {{ snarkos_network_int }}
  roles:
    - snarkos_service

- name: Set up and run tx-cannon
  hosts: "tx_cannon_node"
  become: true
  remote_user: ubuntu
  vars:
    verbosity: "1"
    ecr_region: "{{ txcannon_ecr_region | default('us-east-1') }}"
    ecr_repo: "{{ txcannon_ecr_repo | default('637423331354.dkr.ecr.us-east-1.amazonaws.com/tx-cannon') }}"
    image_tag: "{{ txcannon_image_tag | default('latest') }}"
  roles:
    - txcannon_setup_ecr
    - logstash_txcannon_setup
  tags: tx-cannon

- name: Run the double spend attack
  hosts: "tx_cannon_node[0]"
  become: true
  remote_user: ubuntu
  vars:
    verbosity: "1"
    malicious_ip: "{{ hostvars[groups['snarkos_validator'][1]]['public_ip_address'] }}"
  tasks:
    - name: Print the malicious IP
      debug:
        var: malicious_ip

    - name: Set txs_accounts
      set_fact:
        txs_accounts: "{{ hostvars['localhost'].validator_data.accounts }}"

    - name: Write log message before running tx-cannon
      become: true
      become_user: ubuntu
      shell: |
        echo "Starting tx-cannon in double-spend mode" >> /home/ubuntu/tx-cannon.log
      args:
        executable: /bin/bash

    - name: Run the double spend attack targeting the malicious node
      become: true
      become_user: ubuntu
      shell: |
        cd /home/ubuntu
        /usr/bin/tx-cannon malice --double-spend --endpoint http://{{ malicious_ip }}:3030 \
        --private-key {{ txs_accounts[0].private_key }} -r 90001 >> tx-cannon.log 2>&1
      args:
        executable: /bin/bash
      async: 3600  # Adjust based on expected duration of the tx-cannon run
      poll: 0

    - name: Write log message before running tx-cannon
      become: true
      become_user: ubuntu
      shell: |
        echo "Starting tx-cannon in double-spend mode" >> /home/ubuntu/tx-cannon2.log
      args:
        executable: /bin/bash

    - name: Run the double spend attack targeting the honest node
      become: true
      become_user: ubuntu
      shell: |
        cd /home/ubuntu
        /usr/bin/tx-cannon malice --double-spend --endpoint http://{{ test_network_url }}:3030 \
        --private-key {{ txs_accounts[0].private_key }} -r 90001 >> tx-cannon2.log 2>&1
      args:
        executable: /bin/bash
      async: 3600  # Adjust based on expected duration of the tx-cannon run
      poll: 0

