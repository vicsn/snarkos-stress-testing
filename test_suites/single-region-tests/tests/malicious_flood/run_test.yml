- name: Install malicious snarkos
  hosts: snarkos_validator[1]
  remote_user: ubuntu
  become: true
  pre_tasks:
    - include_tasks: ../../playbooks/set_validator_facts.yml

    - name: set malice specific facts
      set_fact:
        malicemode: Environment="BatchProposalFlood=1"
        snarkos_binary_name: snarkos-malice
      run_once: true

    - name: Set snarkos command with peers and validators
      set_fact:
        snarkos_command: "{{ snarkos_binary_name }} start --metrics --nodisplay --bft 0.0.0.0:5000 --rest 0.0.0.0:3030 --peers {{ validator_client_ips }} --validators {{ formatted_validator_ips }} --verbosity {{ snarkos_verbosity }} --dev {{ node_id }} --dev-num-validators {{ num_instances }} --validator --rest-rps 4294967294 --no-dev-txs --network {{ snarkos_network_int }}"

    - name: Copy pregenerated transactions file
      ansible.builtin.copy:
        src: "../../transaction_files/deploys-{{ num_instances }}val-{{ node_id }}.txt"
        dest: "/tmp/pregenerated_transactions.txt"
      become: yes
  roles:
    - snarkos_service

- name: Pause for 10 minutes
  hosts: localhost
  tasks:
    - name: Pause for 10 minutes
      pause:
        minutes: 10

- name: Undo malicemode
  hosts: snarkos_validator[1]
  remote_user: ubuntu
  become: true
  pre_tasks:
    - name: set malice specific facts
      set_fact:
        malicemode: ""
        snarkos_binary_name: snarkos
      run_once: true 

    - name: Set snarkos command with peers and validators
      set_fact:
        snarkos_command: "{{ snarkos_binary_name }} start --metrics --nodisplay --bft 0.0.0.0:5000 --rest 0.0.0.0:3030 --peers {{ validator_client_ips }} --validators {{ formatted_validator_ips }} --verbosity {{ snarkos_verbosity }} --dev {{ node_id }} --dev-num-validators {{ num_instances }} --validator --rest-rps 4294967294 --no-dev-txs --network {{ snarkos_network_int }}"
  roles:
    - snarkos_service