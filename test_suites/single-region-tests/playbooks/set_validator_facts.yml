- name: Gather facts from all validators
  setup:

- name: Set global facts
  set_fact:
    num_instances: "{{ groups['snarkos_validator'] | length | int }}"
    malicemode: ""
  run_once: true

- name: Set instance-specific facts
  set_fact:
    formatted_validator_ips: >-
      {{
        groups['snarkos_validator']
        | map('extract', hostvars, ['public_ip_address'])
        | map('regex_replace', '^(.*)$', '\1:5000')
        | join(',')
      }}
    formatted_validator_routers: >-
      {{
        groups['snarkos_validator']
        | map('extract', hostvars, ['public_ip_address'])
        | map('regex_replace', '^(.*)$', '\1:4130')
        | join(',')
      }}
    node_id: "{{ tags['Dev'] }}"

- name: Collect prover IPs
  set_fact:
    provers_arg: >-
      {{ (
        ('snarkos_prover' in groups)
          | ternary(groups['snarkos_prover'], [])
          | map('extract', hostvars)
          | map(attribute='public_ip_address')
          | map('regex_replace', '^(.*)$', '\1:4130')
          | list
        )
        | join(',')
      }}

# ---- per-validator client assignment ----

- name: Build ordered validator list
  set_fact:
    all_validators: "{{ groups['snarkos_validator'] | list }}"

- name: Index of current validator (int)
  set_fact:
    current_index: "{{ (all_validators | list).index(inventory_hostname) | int }}"

- name: Prepare client host list
  set_fact:
    all_client_hosts: >-
      {{
        ('snarkos_client' in groups)
          | ternary(groups['snarkos_client'] | list, [])
      }}

- name: Compute clients_per_validator
  set_fact:
    clients_per_validator: >-
      {{
        ((all_client_hosts | length | int) + (num_instances | int) - 1)
        // (num_instances | int)
      }}

- name: Group clients per validator (contiguous groups)
  set_fact:
    clients_grouped: "{{ all_client_hosts | batch(clients_per_validator | int) | list }}"
  when: (clients_per_validator | int) > 0

- name: No clients – set empty groups
  set_fact:
    clients_grouped: []
  when: (clients_per_validator | int) == 0

- name: Get client hostnames for this validator
  set_fact:
    client_hostnames: >-
      {{
        clients_grouped[current_index | int]
        if (clients_grouped | length | int) > (current_index | int)
        else []
      }}

- name: Build client_peers (IPs with port 4130)
  set_fact:
    client_peers: >-
      {{
        client_hostnames
          | map('extract', hostvars)
          | map(attribute='public_ip_address')
          | map('regex_replace', '^(.*)$', '\1:4130')
          | list
          | join(',')
      }}

# ---- combine all peers ----

- name: Build combined peers list (validators + provers + clients)
  set_fact:
    peers_combined: >-
      {{
        [formatted_validator_routers, provers_arg, client_peers]
          | reject('equalto', '')
          | join(',')
      }}

- name: Set snarkos command with peers and validators
  set_fact:
    snarkos_command: >-
      snarkos start --metrics --nodisplay --validator \
        --node 0.0.0.0:4130 --bft 0.0.0.0:5000 --rest 0.0.0.0:3030 \
        --validators {{ formatted_validator_ips }} \
        --verbosity {{ snarkos_verbosity }} \
        --dev {{ node_id }} \
        --dev-num-validators {{ num_instances | int }} --no-dev-txs \
        --rest-rps {{ rest_rps }} \
        --allow-external-peers \
        --peers {{ peers_combined }} \
        --network {{ snarkos_network_int }}

- name: Select global bootstrap clients (hostnames)
  set_fact:
    bootstrap_client_ips: "{{ hostvars['localhost'].bootstrap_client_ips }}"

- name: Build bootstrap_peers_arg with port suffix
  set_fact:
    bootstrap_peers_arg: "{{ bootstrap_client_ips | map('regex_replace', '^(.*)$', '\\1:4130') | join(',') }}"

- name: Build extra environment map for the validator service
  set_fact:
    snarkos_env_extra: >-
      {{
        {'TEST_BOOTSTRAP_PEERS': bootstrap_peers_arg}
      }}

