---
# 1) Decide if snarkOS reinstall is needed
- name: Determine if snarkOS reinstall is needed
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  vars:
    snarkos_hash_state_file: "{{ playbook_dir }}/.last_snarkos_hash"
  tasks:
    - name: Load last deployed snarkOS hash (if present)
      set_fact:
        last_snarkos_hash: "{{ lookup('file', snarkos_hash_state_file) | trim }}"
      ignore_errors: true

    - name: Compute desired snarkOS hash for this run
      set_fact:
        desired_snarkos_hash: >-
          {{
            (snarkos_git_commit_local_build
             | default(snarkos_git_hash, true)
             | default('', true))
          }}

    - name: Decide whether snarkOS should be reinstalled
      set_fact:
        snarkos_force_reinstall: >-
          {{
            last_snarkos_hash is not defined
            or (desired_snarkos_hash | length > 0 and last_snarkos_hash != desired_snarkos_hash)
          }}

    - name: Debug reinstall decision
      debug:
        msg: >-
          snarkos_force_reinstall={{ snarkos_force_reinstall | default(false) }},
          last={{ last_snarkos_hash | default('') }},
          desired={{ desired_snarkos_hash }}
      when: debug | default(false)

# 2) Select installation method and build if needed
- name: Select installation method and build if needed
  hosts: localhost
  gather_facts: true
  any_errors_fatal: true
  pre_tasks:
    - name: Skip play if reinstall not needed
      meta: end_play
      when: not (snarkos_force_reinstall | default(false))
  roles:
    - check_and_setup_snarkos

# ------------------------------------------------
# 3) snarkOS installation

- name: Choose builder machine (only if remote build)
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - name: Skip play if reinstall not needed
      meta: end_play
      when: not (snarkos_force_reinstall | default(false))
  tasks:
    - name: Add chosen host to group 'builder'
      add_host:
        name: >-
          {{ ((groups['snarkos_validator'] | default([])) + (groups['snarkos_client'] | default([]))) | first }}
        groups: builder
      when: (use_remote_build | default(false)) | bool

- name: Build snarkOS once and upload to S3 if use_remote_build
  hosts: builder
  remote_user: ubuntu
  become: true
  any_errors_fatal: true
  pre_tasks:
    - name: Skip play if reinstall not needed
      meta: end_play
      when: not (hostvars['localhost'].snarkos_force_reinstall | default(false))
  vars:
    s3_bucket: "{{ s3_bucket }}"
    snarkos_pre_build_location: "{{ snarkos_pre_build_location }}"
    snarkos_git_hash: "{{ hostvars['localhost'].snarkos_git_hash }}"
    release_name: "{{ hostvars['localhost'].standard_release_name | default('snarkos') }}"
    dest_name: "snarkos"
  tasks:
    - name: Build from git on one validator to reuse on the others
      include_role:
        name: snarkos_build_from_git
      when: hostvars['localhost'].use_remote_build
  run_once: true

- name: Install snarkOS
  hosts:
    - snarkos*
    - tx_runner
  become: true
  remote_user: ubuntu
  any_errors_fatal: true
  strategy: free
  pre_tasks:
    - name: Skip play if reinstall not needed
      meta: end_play
      when: not (hostvars['localhost'].snarkos_force_reinstall | default(false))
  vars:
    s3_bucket: "{{ s3_bucket }}"
    snarkos_pre_build_location: "{{ snarkos_pre_build_location }}"
    snarkos_git_hash: "{{ hostvars['localhost'].snarkos_git_hash }}"
    release_name: "{{ hostvars['localhost'].standard_release_name | default('snarkos') }}"
    dest_name: "snarkos"
  tasks:
    - name: Use local pre-built version
      ansible.builtin.include_role:
        name: snarkos_upload_local
      when: hostvars['localhost'].use_local_pre_build

    - name: Install snarkOS from S3
      ansible.builtin.include_role:
        name: snarkos_install_s3
      vars:
        snarkos_install_s3_release_name: "{{ release_name }}"
        snarkos_install_s3_dest_name: "{{ dest_name }}"
      when: hostvars['localhost'].use_s3_pre_build or hostvars['localhost'].use_local_build

    - name: Install snarkOS from binary
      ansible.builtin.include_role:
        name: snarkos_install_binary
      when: hostvars['localhost'].use_github_build

    - name: Build snarkOS from git
      ansible.builtin.include_role:
        name: snarkos_build_from_git
      when: hostvars['localhost'].use_remote_build
  tags: snarkos_install

# ------------------------------------------------
# 4) Restart services (only when reinstall happened)

- name: Decide on the bootstrap clients
  hosts: localhost
  any_errors_fatal: true
  pre_tasks:
    - name: Skip play if reinstall not needed
      meta: end_play
      when: not (snarkos_force_reinstall | default(false))
  roles:
    - choose_bootstrap_client
  tags: snarkos

- name: Set up and start snarkOS network for validators
  hosts: snarkos_validator
  become: true
  remote_user: ubuntu
  any_errors_fatal: true
  strategy: free
  pre_tasks:
    - name: Skip play if reinstall not needed
      meta: end_play
      when: not (hostvars['localhost'].snarkos_force_reinstall | default(false))
    - name: Set Validator facts
      include_tasks: set_validator_facts.yml
  roles:
    - snarkos_service
  tags: snarkos

- name: Set up and start snarkOS network for clients
  hosts: snarkos_client
  become: true
  remote_user: ubuntu
  any_errors_fatal: true
  strategy: free
  pre_tasks:
    - name: Skip play if reinstall not needed
      meta: end_play
      when: not (hostvars['localhost'].snarkos_force_reinstall | default(false))
    - name: Set client facts
      include_tasks: set_client_facts.yml
  roles:
    - snarkos_service
  tags: snarkos_client

- name: Set up and start snarkOS network for provers
  hosts: snarkos_prover
  become: true
  remote_user: ubuntu
  any_errors_fatal: true
  strategy: free
  pre_tasks:
    - name: Skip play if reinstall not needed
      meta: end_play
      when: not (hostvars['localhost'].snarkos_force_reinstall | default(false))
    - name: Set Prover facts
      include_tasks: set_prover_facts.yml
  roles:
    - snarkos_service
  tags: snarkos

# ------------------------------------------------
# 5) Save the git hash of snarkos that was installed (only when reinstall)

- name: Persist deployed snarkOS hash for future runs
  hosts: localhost
  pre_tasks:
    - name: Skip play if reinstall not needed
      meta: end_play
      when: not (snarkos_force_reinstall | default(false))
  tasks:
    - name: Write current snarkOS hash to file
      copy:
        dest: "{{ playbook_dir }}/.last_snarkos_hash"
        content: "{{ snarkos_git_commit_local_build | default(snarkos_git_hash, true) | default('') }}\n"
        mode: "0644"
