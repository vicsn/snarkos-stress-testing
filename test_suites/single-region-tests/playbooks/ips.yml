- name: Print ips
  hosts: localhost
  tasks:
    - name: Print groups var
      debug:
        var: groups
    - name: store client ips
      copy:
        content: "{{ groups['snarkos_client'] | map('extract', hostvars) | map(attribute='public_ip_address') | join('\n') }}"
        dest: ../client_ip_addresses.txt
    - name: store validator ips
      copy:
        content: "{{ groups['snarkos_validator'] | map('extract', hostvars) | map(attribute='public_ip_address') | join('\n') }}"
        dest: ../ip_addresses.txt
