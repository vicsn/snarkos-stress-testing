- name: Gather facts from all nodes
  setup:

- name: Determine the number of validators
  set_fact:
    num_instances: "{{ groups['snarkos_validator'] | length }}"
  run_once: true

- name: Assign client to validator index
  set_fact:
    validator_id: "{{ tags['Validator'] }}"

- name: Debug validator IP by Dev tag
  debug:
    msg: >-
      {{
        groups['snarkos_validator']
        | map('extract', hostvars)
        | selectattr('tags.Dev', 'equalto', validator_id | string)
        | map(attribute='public_ip_address')
        | first
      }}

- name: Debug validator_id
  debug:
    msg: "Vid: '{{ validator_id }}'"

- name: Set validator address
  set_fact:
    validator_ip: >-
      {{
        groups['snarkos_validator']
        | map('extract', hostvars)
        | selectattr('tags.Dev', 'equalto', validator_id | string)
        | map(attribute='public_ip_address')
        | first
      }}

- name: Set own address
  set_fact:
    own_address: "{{ hostvars[inventory_hostname]['public_ip_address'] }}"

- name: Set node_id based on instance tag
  set_fact:
    node_id: "{{ (num_instances | int) + 100*(validator_id | int) + 10000*(tags['Dev'] | int) }}"

- name: Assert that num_instances is lower than 100
  assert:
    that:
      - (num_instances | int) < 100
    fail_msg: "The client node_id indexing assumes less than 100 validators."

# Map each client host to its tags.Validator (string)
- name: Build client→validator map
  set_fact:
    client_to_validator: >-
      {{
        dict(
          groups['snarkos_client']
          | zip(
              groups['snarkos_client']
              | map('extract', hostvars)
              | map(attribute='tags')
              | map(attribute='Validator')
              | map('string')
            )
        )
      }}

# Hosts (names) in *this* validator's client group sorted
- name: Derive this validator's client group (hostnames)
  set_fact:
    this_group_hosts: >-
      {{
        client_to_validator
        | dict2items
        | selectattr('value', 'equalto', validator_id | string)
        | map(attribute='key')
        | list
        | sort
      }}

# Leader client = first hostname in the group
- name: Pick leader client for this validator group
  set_fact:
    leader_host: "{{ this_group_hosts | first }}"
    leader_ip: "{{ hostvars[this_group_hosts | first]['public_ip_address'] if this_group_hosts | length > 0 else None }}"

- name: Set peer IPs per-group (leader vs others)
  set_fact:
    peer_ips: "{{ [validator_ip] if inventory_hostname == leader_host else [leader_ip] }}"

- name: Assert peer IPs are defined
  assert:
    that:
      - peer_ips is sequence
      - peer_ips | length > 0
      - (peer_ips | select('string') | list | length) == (peer_ips | length)
    fail_msg: "peer_ips not a list of strings: {{ peer_ips | to_nice_json }}"

- name: Render peers string with port suffix
  set_fact:
    peers_arg: "{{ peer_ips | map('regex_replace', '^(.*)$', '\\1:4130') | join(',') }}"

- debug:
    msg:
      - "peer_ips type: {{ peer_ips | type_debug }}"
      - "peer_ips val:  {{ peer_ips }}"

- name: Set snarkos command with the assigned validator
  set_fact:
    snarkos_command: >-
      snarkos start --client --nocdn --nodisplay \
        --rest 0.0.0.0:3030 --node 0.0.0.0:4130 \
        --verbosity {{ snarkos_verbosity }} --metrics \
        --allow-external-peers \
        --peers {{ peers_arg }} \
        --dev {{ node_id }} --dev-num-validators {{ num_instances }} \
        --rest-rps {{ rest_rps }}  --network {{ snarkos_network_int }}
