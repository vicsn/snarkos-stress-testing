- name: Gather facts from all nodes
  become: false
  setup:

- name: Determine the number of validators
  set_fact:
    num_instances: "{{ groups['snarkos_validator'] | length }}"
  run_once: true

- name: Set own address
  set_fact:
    own_address: "{{ hostvars[inventory_hostname]['gcp_private_ip'] }}"

- name: Set node_id based on instance label
  set_fact:
    node_id: "{{ (groups['snarkos_validator'] | length | int) + (gcp_labels.dev | int) + 1 }}"


- name: Assert that num_instances is lower than 100
  assert:
    that:
      - (num_instances | int) < 100
    fail_msg: "The client node_id indexing assumes less than 100 validators."

- name: Select global bootstrap clients (hostnames)
  set_fact:
    bootstrap_clients: "{{ hostvars['localhost'].bootstrap_clients }}"
    bootstrap_client_ips: "{{ hostvars['localhost'].bootstrap_client_ips }}"

- name: Mark whether this host is a bootstrap client
  set_fact:
    is_bootstrap_client: "{{ inventory_hostname in bootstrap_clients }}"

# Peering rule:
# - For all clients    -> TEST_BOOTSTRAP_PEERS = ALL bootstrap clients' IPs 
- name: Set peer IPs based on global role
  set_fact:
    peer_ips: >-
      {{
        (bootstrap_client_ips | list | unique | sort)
      }}

# We had problems with the types of the peer lists in previous implementations, so we assert that here.
- name: Validate peer IP list
  assert:
    that:
      - peer_ips is sequence
      - peer_ips | length > 0
      - (peer_ips | select('string') | list | length) == (peer_ips | length)
    fail_msg: "peer_ips not a list of strings: {{ peer_ips | to_nice_json }}"

- name: Build peers list with port suffix (empty for bootstrap)
  set_fact:
    peers_arg_list: >-
      {{
        [] if is_bootstrap_client
        else (peer_ips | map('regex_replace', '^(.*)$', '\1:4130') | list)
      }}

- name: Build peers_arg string (for env var)
  set_fact:
    peers_arg: "{{ peers_arg_list | join(',') }}"

# Only bootstrap clients rotate external peers
- name: Set rotate flag for bootstrap clients only
  set_fact:
    rotate_flag: "{{ '--rotate-external-peers' if is_bootstrap_client else '' }}"

# Can be removed, but good to have for local tests.
- debug:
    msg:
      - "bootstrap_clients:   {{ bootstrap_clients }}"
      - "is_bootstrap_client: {{ is_bootstrap_client }}"
      - "peer_ips:            {{ peer_ips }}"
      - "peers_arg:           {{ peers_arg }}"
      - "rotate_flag:         {{ rotate_flag }}"

- name: Client flag
  set_fact:
    client_flag: "{{ '--bootstrap-client' if is_bootstrap_client else '--client' }}"

# The 34.12.32.12:9 ip is set to peers, because this is a workaround so that
# the node doesn't attempt to connect to itself as a peer,
# as 127.0.0.1 is the default dev peer right now if there are no --peers.
- name: Dummy Peers flag
  set_fact:
    dummy_peers_flag: "{{ '' if is_bootstrap_client else '--peers 34.12.32.12:9' }}"

- name: Set snarkos command for clients
  set_fact:
    snarkos_command: >-
      snarkos start {{ client_flag }} --nocdn --nodisplay
      --rest 0.0.0.0:3030 --node 0.0.0.0:4130
      --verbosity {{ snarkos_verbosity }} --metrics
      --allow-external-peers
      {{ dummy_peers_flag }}
      {{ rotate_flag }}
      --dev {{ node_id }} --dev-num-validators {{ num_instances }}
      --rest-rps {{ rest_rps }} --network {{ snarkos_network_int }}

- name: Collect committee addresses (all)
  set_fact:
    committee_addrs_all: >-
      {{
        hostvars['localhost'].validator_data.accounts
        | default([])
        | selectattr('address','defined')
        | map(attribute='address')
        | list
        | unique
      }}

- name: Assert we have enough committee addresses
  assert:
    that:
      - (committee_addrs_all | length) >= (num_instances | int)
    fail_msg: >-
      Need at least {{ num_instances }} committee addresses, but found {{ committee_addrs_all | length }}.
  when: is_bootstrap_client

- name: Build committee addresses list (from localhost.validator_data.accounts)
  set_fact:
    committee_addrs_list: "{{ (committee_addrs_all[: (num_instances | int)]) | join(',') }}"

# Pass the peers as environment variable for each client.
- name: Build extra environment map for the client service
  set_fact:
    snarkos_env_extra: >-
      {{
        {'TEST_BOOTSTRAP_PEERS': peers_arg}
        | combine(
            is_bootstrap_client
            | ternary({'TEST_COMMITTEE_ADDRS': committee_addrs_list}, {}),
            recursive=True
          )
      }}
