- name: Gather facts from all nodes
  setup:

- name: Determine the number of validators
  set_fact:
    num_instances: "{{ groups['snarkos_validator'] | length }}"
  run_once: true

- name: Assign client to validator index
  set_fact:
    validator_index: "{{ tags['Validator'] }}"

- name: Set validator address
  set_fact:
    validator_address: "{{ hostvars[groups['snarkos_validator'][validator_index | int]]['public_ip_address'] }}"

- name: Set own address
  set_fact:
    own_address: "{{ hostvars[inventory_hostname]['public_ip_address'] }}"

- name: Set client addresses, filtering out own_address
  set_fact:
    client_addresses: "{{ groups['snarkos_client'] | map('extract', hostvars) | map(attribute='public_ip_address') | select('ne', own_address) | join(',') }}"

- name: Append port :4130 to client addresses
  set_fact:
    client_addresses: "{{ client_addresses | regex_replace('([^,]+)', '\\1:4130') }}"

- name: Set node_id based on instance tag
  set_fact:
    node_id: "{{ (num_instances | int) + 100*(validator_index | int) + 10000*(tags['Dev'] | int) }}"

- name: Assert that num_instances is lower than 100
  assert:
    that:
      - (num_instances | int) < 100
    fail_msg: "The client node_id indexing assumes less than 100 validators."

- name: Set snarkos command with the assigned validator
  set_fact:
    snarkos_command: "snarkos start --client --nocdn --nodisplay --rest 0.0.0.0:3030 --bft 0.0.0.0:5000 --node 0.0.0.0:4130 --verbosity {{ snarkos_verbosity }} --metrics --peers {{ validator_address }}:4130,{{ client_addresses }} --dev {{ node_id }} --dev-num-validators {{ num_instances }} --rest-rps 90000000"

