# ------------------------------------------------
# Observability setup

- name: Install and Configure Google Cloud Ops Agent
  hosts: snarkos*
  become: true
  remote_user: ubuntu
  any_errors_fatal: true
  strategy: free
  roles:
    - google_ops_agent_setup
  vars:
    ops_agent_commit_id: "{{ snarkos_git_hash | default('') }}"
    ops_agent_branch_name: "{{ snarkos_branch | default('') }}"
    ops_agent_owner: "{{ gcp_labels.owner | default('') }}"
    ops_agent_role: "{{ gcp_labels.role | default('') }}"
    ops_agent_mode: "{{ mode | default('') }}"
    ops_agent_tests: "{{ tests | default('') }}"
    ops_agent_snarkos_network: "{{ snarkos_network | default('') }}"

# ------------------------------------------------
# snarkOS validators

- name: Set up and start snarkOS network for validators
  hosts: snarkos_validator
  become: true
  remote_user: ubuntu
  any_errors_fatal: true
  strategy: free
  vars:
    snarkos_commit_id: "{{ snarkos_git_hash | default('') }}"
    snarkos_branch_name: "{{ snarkos_branch | default('') }}"
  pre_tasks:
    - name: Set Validator facts
      include_tasks: set_validator_facts.yml
  roles:
    - snarkos_service
  tags: snarkos

# ------------------------------------------------
# snarkOS clients

- name: Set up and start snarkOS network for clients
  hosts: snarkos_client
  become: true
  remote_user: ubuntu
  any_errors_fatal: true
  strategy: free
  pre_tasks:
    - name: Set client facts
      include_tasks: set_client_facts.yml
  roles:
    - snarkos_service
  tags: snarkos_client

# ------------------------------------------------
# snarkOS provers

- name: Set up and start snarkOS network for provers
  hosts: snarkos_prover
  become: true
  remote_user: ubuntu
  any_errors_fatal: true
  strategy: free
  pre_tasks:
    - name: Set Prover facts
      include_tasks: set_prover_facts.yml
  roles:
    - snarkos_service
  tags: snarkos

# ------------------------------------------------
# TX Runner

- name: Set up the TX Runner
  hosts: tx_runner
  become: true
  remote_user: ubuntu
  any_errors_fatal: true
  pre_tasks:
  roles:
    - setup_tx_runner
  tags: tx_runner

