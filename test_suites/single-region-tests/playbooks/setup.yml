- name: Prepare controller-side facts (validator data + bootstrap clients)
  # These facts must live on localhost so later plays can read them via
  # hostvars['localhost'].*. We cannot target `hosts: localhost` here because the
  # AWS dynamic-inventory --limit uses a devnet&owner intersection that filters
  # localhost out (intersection applies to the whole pattern, so a trailing
  # ":localhost" does not survive). Instead we run once on a matched host and
  # delegate the fact-setting to localhost (delegation ignores --limit).
  hosts: all
  gather_facts: false
  any_errors_fatal: true
  # 'always' so these controller-side facts are set even when setup is run with a
  # tag filter (e.g. --tags snarkos). The validators play is tagged 'snarkos' and
  # the clients play 'snarkos_client', and both read hostvars['localhost'].*, so
  # this prep must never be filtered out.
  tags: always
  tasks:
    - name: Load validator data from JSON (stored on localhost)
      set_fact:
        validator_data: "{{ lookup('file', playbook_dir + '/../validator_data/data.json') | from_json }}"
      run_once: true
      delegate_to: localhost
      delegate_facts: true

    - name: Decide on the bootstrap clients (stored on localhost)
      ansible.builtin.include_role:
        name: choose_bootstrap_client
      run_once: true

- name: Wait for SSH to become available
  hosts: all
  remote_user: ubuntu
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Wait for SSH to become ready
      ansible.builtin.wait_for_connection:

# ------------------------------------------------
# snarkOS installation

- name: Install snarkOS
  hosts:
    - snarkos*
    - tx_runner
  become: true
  remote_user: ubuntu
  any_errors_fatal: true
  strategy: free
  vars:
    s3_bucket: "{{ s3_bucket }}"
    snarkos_pre_build_location: "{{ snarkos_pre_build_location }}"
    snarkos_git_hash: "{{ hostvars['localhost'].snarkos_git_hash }}"
    release_name: "{{ hostvars['localhost'].release_name }}"
    dest_name: "snarkos"
  tasks:
    - name: Install snarkOS from S3
      ansible.builtin.include_role:
        name: snarkos_install_s3
      vars:
        release_name: "{{ release_name }}"
        snarkos_install_s3_dest_name: "{{ dest_name }}"

  tags: snarkos_install

