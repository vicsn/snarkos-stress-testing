- name: Prepare controller-side facts (validator data + bootstrap clients)
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tags: always
  tasks:
    - name: Load validator data from JSON
      set_fact:
        validator_data: "{{ lookup('file', playbook_dir + '/../validator_data/data.json') | from_json }}"

    - name: Decide on the bootstrap clients
      ansible.builtin.include_role:
        name: choose_bootstrap_client

- name: Wait for SSH to become available
  hosts: all
  remote_user: ubuntu
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Wait for SSH to become ready
      ansible.builtin.wait_for_connection:

- name: Install shared SSH keys from repo keys.pub
  hosts: all
  become: true
  remote_user: ubuntu
  gather_facts: false
  roles:
    - shared_ssh_keys

# ------------------------------------------------
# snarkOS installation

- name: Install snarkOS
  hosts:
    - snarkos*
    - tx_runner
  become: true
  remote_user: ubuntu
  any_errors_fatal: true
  strategy: free
  vars:
    gcs_bucket: "{{ gcs_bucket | default('provable-binaries-releases') }}"
    snarkos_pre_build_location: "{{ snarkos_pre_build_location }}"
    snarkos_git_hash: "{{ hostvars['localhost'].snarkos_git_hash }}"
    release_name: "{{ hostvars['localhost'].release_name }}"
    dest_name: "snarkos"
  tasks:
    - name: Install snarkOS from GCS
      ansible.builtin.include_role:
        name: snarkos_install_gcs
      vars:
        release_name: "{{ release_name }}"
        snarkos_install_s3_dest_name: "{{ dest_name }}"

  tags: snarkos_install

