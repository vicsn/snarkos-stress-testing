# Metricbeat, Filebeat, Logstash

- name: Install and Configure Metricbeat, Filebeat and Logstash
  hosts: snarkos*
  become: true
  remote_user: ubuntu
  any_errors_fatal: true
  strategy: free
  roles:
    - logstash_setup
    - metricbeat_setup
    - filebeat_setup
  vars:
    preinstalled: true

