# ------------------------------------------------
# Optionall restart validators if creating a flamegraph to avoid measuring genesis block creation

- name: Optionally restart snarkOS validators
  hosts: snarkos_validator
  become: true
  remote_user: ubuntu
  pre_tasks:
    - name: Set Validator facts
      include_tasks: set_validator_facts.yml
  tasks:
    - name: Restart snarkOS validators
      systemd:
        name: snarkos
        state: restarted
      when: create_flamegraph
  tags: snarkos
