- name: Wait for SSH to become available
  hosts: all
  remote_user: ubuntu
  gather_facts: false
  tasks:
    - name: Wait for SSH to become ready
      ansible.builtin.wait_for_connection:

- name: Check setup integrity
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Fail if both snarkos_git_hash and snarkos_binary_tag are set
      fail:
        msg: "You cannot set both 'snarkos_git_hash' and 'snarkos_binary_tag'. Choose only one."
      when: snarkos_git_hash is defined and snarkos_git_hash | length > 0 and snarkos_binary_tag is defined and snarkos_binary_tag | length > 0

- name: Check which installation method is used
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Check if a local pre-built version should be used
      ansible.builtin.set_fact:
        use_local_pre_build: >-
          {{
            (snarkos_pre_build_location is defined and snarkos_pre_build_location | length > 0)
          }}

    - name: Check if S3 pre-built version should be used
      ansible.builtin.set_fact:
        use_s3_pre_build: >-
          {{
            (snarkos_pre_build_location is undefined) and
            (s3_bucket is defined and s3_bucket | length > 0) and
            (use_snarkos_pre_build_s3 is defined and use_snarkos_pre_build_s3|bool)
          }}

    - name: Check if local build should be used
      ansible.builtin.set_fact:
        use_local_build: >-
          {{
            (snarkos_pre_build_location is undefined) and
            (use_snarkos_pre_build_s3 is undefined or not use_snarkos_pre_build_s3|bool) and
            (snarkos_repo is defined and snarkos_repo | length > 0) and
            (snarkos_git_commit_local_build is defined and snarkos_git_commit_local_build | length > 0)
          }}

    - name: Check if GitHub build should be used
      ansible.builtin.set_fact:
        use_github_build: >-
          {{
            (snarkos_pre_build_location is undefined) and
            (use_snarkos_pre_build_s3 is undefined or not use_snarkos_pre_build_s3|bool) and
            (snarkos_binary_tag is defined and snarkos_binary_tag | length > 0)
          }}

    - name: Check if remote build should be used
      ansible.builtin.set_fact:
        use_remote_build: >-
          {{
            (snarkos_pre_build_location is undefined) and
            (use_snarkos_pre_build_s3 is undefined or not use_snarkos_pre_build_s3|bool) and
            (snarkos_git_hash is defined and snarkos_git_hash | length > 0) and
            (snarkos_repo is defined and snarkos_repo | length > 0)
          }}

    - name: Check malice download method
      ansible.builtin.set_fact:
        use_malicious_snarkos_pre_build: >-
          {{
            (use_malicious_snarkos_pre_build is defined) and (use_malicious_snarkos_pre_build|bool)
          }}

    - name: Ensure exactly one installation method is used
      ansible.builtin.fail:
        msg: "Exactly one installation method should be used."
      when: (use_local_build | int + use_github_build | int + use_remote_build | int | int + use_local_pre_build | int + use_s3_pre_build) != 1

    - name: Ensure that if snarkos_git_commit_local_build_update is set, then the local build installation method is used
      fail:
        msg: "If snarkos_git_commit_local_build_update is set, then use the local build installation method."
      when: snarkos_git_commit_local_build_update is defined and snarkos_git_commit_local_build_update | length > 0 and not use_local_build

- name: Build and upload snarkOS to S3 if required
  hosts: localhost
  gather_facts: true
  tasks:
    - name: Set git commit variable for standard build
      set_fact:
        snarkos_git_commit_to_build: "{{ snarkos_git_commit_local_build }}"
      when: snarkos_git_commit_local_build is defined

    - name: Set standard release name
      set_fact:
        standard_release_name: "{{ generate_release_name | replace('COMMIT_HASH', snarkos_git_commit_to_build) | trim }}"
      when: snarkos_git_commit_local_build is defined

    - name: Debug standard release name
      debug:
        msg: "Standard release name: '{{ standard_release_name }}'"
      when: snarkos_git_commit_local_build is defined

    - name: Build and upload standard snarkOS to S3
      include_role:
        name: snarkos_build_locally
      when: hostvars['localhost'].use_local_build

    - name: Set git commit variable for update build
      set_fact:
        snarkos_git_commit_to_build: "{{ snarkos_git_commit_local_build_update }}"
      when: snarkos_git_commit_local_build_update is defined and snarkos_git_commit_local_build_update | length > 0

    - name: Set update release name
      set_fact:
        update_release_name: "{{ generate_release_name | replace('commit_hash', snarkos_git_commit_to_build) | trim }}"
      when: snarkos_git_commit_local_build_update is defined and snarkos_git_commit_local_build_update | length > 0

    - name: Debug update release name
      debug:
        msg: "Update release name: '{{ update_release_name }}'"
      when: snarkos_git_commit_local_build_update is defined and snarkos_git_commit_local_build_update | length > 0

    - name: Build and upload update snarkOS to S3
      include_role:
        name: snarkos_build_locally
      when: >
        hostvars['localhost'].use_local_build and 
        snarkos_git_commit_local_build_update is defined and 
        snarkos_git_commit_local_build_update | length > 0

# ------------------------------------------------
# snarkOS installation

- name: Install snarkOS
  hosts: snarkos*
  become: true
  remote_user: ubuntu
  vars:
    s3_bucket: "{{ s3_bucket }}"
    snarkos_pre_build_location: "{{ snarkos_pre_build_location }}"
    snarkos_git_hash: "{{ hostvars['localhost'].snarkos_git_hash }}"
    release_name: "{{ hostvars['localhost'].standard_release_name | default('snarkos') }}"
    dest_name: "snarkos"
  tasks:
    - name: Use local pre-built version
      ansible.builtin.include_role:
        name: snarkos_upload_local
      when: hostvars['localhost'].use_local_pre_build

    - name: Install snarkOS from S3
      ansible.builtin.include_role:
        name: snarkos_install_s3
      vars:
        snarkos_install_s3_release_name: "{{ release_name }}"
        snarkos_install_s3_dest_name: "{{ dest_name }}"
      when: hostvars['localhost'].use_s3_pre_build or hostvars['localhost'].use_local_build

    - name: Install snarkOS from binary
      ansible.builtin.include_role:
        name: snarkos_install_binary
      when: hostvars['localhost'].use_github_build

    - name: Build snarkOS from git
      ansible.builtin.include_role:
        name: snarkos_build_from_git
      when: hostvars['localhost'].use_remote_build

    - name: Download malice snarkOS binary with GitHub CLI
      ansible.builtin.shell: >
        TAG="{{ snarkos_malice_tag }}"

        apt-get install -y unzip

        GITHUB_TOKEN="{{ github_token }}" gh release download ${TAG}
        --repo ProvableHQ/snarkOS-staging
        --pattern "snarkos*unknown-linux-gnu.zip"
        --output "/tmp/snarkos-malicious.zip"
        --clobber

        unzip -o /tmp/snarkos-malicious.zip -d /tmp/snarkos-malicious

        mv /tmp/snarkos-malicious/snarkos /usr/bin/snarkos-malice
      args:
        executable: /bin/bash
      register: download_malice_result
      changed_when: download_malice_result is success
      when: not hostvars['localhost'].use_malicious_snarkos_pre_build

    - name: Download malice snarkOS binary from S3
      vars:
        snarkos_install_s3_release_name: "{{ snarkos_malice_tag }}/snarkos"
        snarkos_install_s3_dest_name: "snarkos-malice"
      ansible.builtin.include_role:
        name: snarkos_install_s3
      when: hostvars['localhost'].use_malicious_snarkos_pre_build

  tags: snarkos_install

# ------------------------------------------------
# zip
- name: Install zip
  hosts: snarkos*
  become: true
  remote_user: ubuntu
  tasks:
    - name: Stop unattended-upgrades service because it can block apt
      ansible.builtin.systemd:
        name: unattended-upgrades
        state: stopped
      ignore_errors: yes
      
    - name: Install zip
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
        update_cache: true
        force_apt_get: yes
      with_items:
        - zip
      register: apt_result
      retries: 20
      delay: 30
      until: apt_result is success

# ------------------------------------------------
# flamegraph

- name: Install flamegraph dependencies
  hosts: snarkos_validator
  become: true
  remote_user: ubuntu
  pre_tasks:
    - name: Set Validator Facts
      ansible.builtin.include_tasks: set_validator_facts.yml
  tasks:
    - name: Capture kernel version
      ansible.builtin.command: uname -r
      register: kernel_version
      when: create_flamegraph
      changed_when: kernel_version is success

    - name: Install flamegraph dependencies
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
        update_cache: true
      with_items:
        - linux-tools-common
        - linux-tools-generic
        - linux-tools-{{ kernel_version.stdout }}
        - build-essential
      retries: 20
      delay: 30
      until: apt_result is success
      when: create_flamegraph

    - name: Install Rustup and flamegraph # As advised by https://github.com/flamegraph-rs/flamegraph
      ansible.builtin.command: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y

        . "$HOME/.cargo/env"

        cargo install flamegraph
      args:
        executable: /bin/bash
      when: create_flamegraph

