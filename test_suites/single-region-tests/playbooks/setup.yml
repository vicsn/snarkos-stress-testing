    #     TAG="{{ snarkos_malice_tag }}"

    #     apt-get install -y unzip

    #     GITHUB_TOKEN="{{ github_token }}" gh release download ${TAG}
    #     --repo ProvableHQ/snarkOS-staging
    #     --pattern "snarkos*unknown-linux-gnu.zip"
    #     --output "/tmp/snarkos-malicious.zip"
    #     --clobber

    #     unzip -o /tmp/snarkos-malicious.zip -d /tmp/snarkos-malicious

    #     mv /tmp/snarkos-malicious/snarkos /usr/bin/snarkos-malice
