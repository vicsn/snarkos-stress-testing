[program:block_scanner]
command=/home/ubuntu/venv/bin/python3 /home/ubuntu/block_scanner.py
directory=/home/ubuntu
autostart=true
autorestart=true
stderr_logfile=/home/ubuntu/tx_runner_block_scanner.err.log
stdout_logfile=/home/ubuntu/tx_runner_block_scanner.log
user=ubuntu
environment=PYTHONUNBUFFERED="1",BLOCK_SCANNER_IP={{ test_network_url }},BLOCK_SCANNER_NETWORK={{ snarkos_network }},LATEST_CONSENSUS_VERSION={{ txs_target_consensus_version }}

