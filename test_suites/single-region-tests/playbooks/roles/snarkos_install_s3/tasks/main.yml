- name: Download snarkos binary from S3
  aws_s3:
    bucket: "{{ s3_bucket }}"
    object: "{{ snarkos_install_s3_release_name | trim }}"
    dest: "/usr/bin/{{ snarkos_install_s3_dest_name }}"
    mode: get
  register: s3_download

- name: Ensure the download was successful
  fail:
    msg: "Failed to download snarkos binary from S3."
  when: s3_download.failed

- name: Ensure the binary is executable
  file:
    path: "/usr/bin/{{ snarkos_install_s3_dest_name }}"
    mode: '0755'
