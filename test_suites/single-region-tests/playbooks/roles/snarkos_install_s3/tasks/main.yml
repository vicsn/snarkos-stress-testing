- name: Update APT package index
  apt:
    update_cache: yes
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Ensure Python3 is installed
  apt:
    name: python3
    state: present
  when: ansible_os_family == "Debian"

- name: Ensure pip3 is installed
  apt:
    name: python3-pip
    state: present
  when: ansible_os_family == "Debian"
  register: apt_result
  retries: 5
  delay: 30
  until: apt_result is success

- name: Ensure Python boto3 is installed
  pip:
    name: boto3
    state: present
    executable: pip3
  when: ansible_os_family == "Debian"

- name: Download snarkos binary from S3
  aws_s3:
    bucket: "{{ s3_bucket }}"
    object: "{{ release_name }}"
    dest: "/usr/bin/{{ dest_name }}"
    mode: get
  register: s3_download

- name: Ensure the download was successful
  fail:
    msg: "Failed to download snarkos binary from S3."
  when: s3_download.failed

- name: Ensure the binary is executable
  file:
    path: "/usr/bin/{{ dest_name }}"
    mode: '0755'
