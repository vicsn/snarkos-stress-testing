- name: Wait until node is within ±{{ _tol }} blocks of compare node
  vars:
    _tol: "{{ (tolerance | default(50)) | int }}"
    _retries: "{{ (max_attempts | default(60)) | int }}"
    _delay: "{{ (delay_secs | default(30)) | int }}"
  ansible.builtin.shell: |
    set -euo pipefail
    python3 - <<'PY'
    import json, sys, urllib.request
    a = int(json.load(urllib.request.urlopen("http://{{ node_to_check }}:3030/{{ snarkos_network }}/block/latest"))["header"]["metadata"]["height"])
    b = int(json.load(urllib.request.urlopen("http://{{ node_to_compare }}:3030/{{ snarkos_network }}/block/latest"))["header"]["metadata"]["height"])
    diff = b - a
    print(f"A={a}  B={b}  diff={diff}")
    sys.exit(0 if -{{ _tol }} <= diff <= {{ _tol }} else 1)
    PY
  args:
    executable: /bin/bash
  register: sync_check
  until: sync_check.rc == 0
  retries: "{{ _retries }}"
  delay: "{{ _delay }}"
  changed_when: false
