# https://docs.ansible.com/ansible/latest/collections/google/cloud/gcp_compute_inventory.html
plugin: google.cloud.gcp_compute

#zones:
#  - us-west1-a
#  - us-east4-a
#  - us-central1-a
#  - us-central1-b
#  - us-central1-c
#  - us-central1-d
#  - us-central1-e
#  - us-central1-f

projects:
  - protocol-development-sandbox

#name_suffix: .testnet.provable.dev
hostnames:
  - private_ip

keyed_groups:
  # Create groups from GCE labels
  - prefix: gcp
    key: labels
  # Group by "devnet" label ~> "{devnet_name}"
  - key: "labels.devnet"
    prefix: devnet
    separator: "_"
  # Group by "owner" label ~> "owner_{owner}"
  - key: "labels.owner"
    prefix: owner
    separator: "_"
    # Group by "role" label ~> ex: "snarkos_validator","snarkos_prover","tx_runner"
  - key: "labels.role"
    separator: ""
  # Zone
  - key: "zone"
    prefix: gcp
    separator: "_"
  # Network
  - key: "machineType | regex_replace('.*/', '')"
    prefix: gcp
    separator: "_"

## Role-based groups for playbook compatibility
#groups:
#  snarkos_validator: labels.role == "validator"
#  snarkos_client: labels.role == "client"
#  snarkos_prover: labels.role == "prover"

auth_kind: application
# https://docs.ansible.com/ansible/latest/collections/google/cloud/gcp_compute_inventory.html#parameter-service_account_file
# https://docs.ansible.com/ansible/latest/collections/environment_variables.html#envvar-GCE_CREDENTIALS_FILE_PATH
# service_account_file:

filters:
  - status = RUNNING
  # Keep in sync with every DEVNET_NAME / terraform *.tfvars profile.
  # Hosts whose label is missing here never appear in Ansible groups
  # (snarkos_validator, etc.), so --limit cannot find them.
  - labels.devnet = "single-region-tests" OR labels.devnet = "prerelease-devnet" OR labels.devnet = "stress-testing-manager" OR labels.devnet = "network-sync-tests"

compose:
  ansible_host: "networkInterfaces[0].networkIP"
  ansible_user: "'ubuntu'"
  ansible_ssh_private_key_file: "'/home/ubuntu/snarkos-stress-testing/devnet-key'"
  snarkos_role: "labels.role | regex_replace('snarkos-', '')"
  # Map GCP attributes to variables
  gcp_zone: "zone"
  gcp_machine_type: "machineType"
  gcp_project_id: "project"
  gcp_instance_id: "id"
  gcp_status: "status"
  gcp_private_ip: "networkInterfaces[0].networkIP"
  gcp_public_ip: "networkInterfaces[0].accessConfigs[0].natIP if networkInterfaces[0].accessConfigs else ''"
  gcp_labels: "labels"
  gcp_network_tags: "tags.items | default([])"
