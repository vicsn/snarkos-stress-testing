- name: Fetch logs from clients
  hosts: snarkos_client
  become: true
  remote_user: ubuntu
  strategy: free
  pre_tasks:
    - name: Set client facts
      include_tasks: ../../playbooks/set_client_facts.yml
  tasks:
    - name: Zip logs
      community.general.archive:
        path: "/tmp/snarkos.log"
        dest: "/tmp/snarkos.log.gz"
        mode: "0644"

    - name: Fetch logs
      fetch:
        src: "/tmp/snarkos.log.gz"
        dest: "../../log_files/client-{{ node_id }}.log.gz"
        flat: true
