- name: Fetch flamegraph from validators, assuming they are running with `create_flamegraph`
  hosts: snarkos_validator
  become: true
  remote_user: ubuntu
  pre_tasks:
    - name: Gather validator facts
      include_tasks: ../../playbooks/set_validator_facts.yml
  tasks:
    - name: Stop snarkos
      systemd:
        name: snarkos
        state: stopped
      when: create_flamegraph and node_id == flamegraph_node_id

    - name: Generate flamegraph
      shell: |
        /root/.cargo/bin/flamegraph --perfdata /home/ubuntu/perf.data
      args:
        executable: /bin/bash
        chdir: /home/ubuntu
      when: create_flamegraph and node_id == flamegraph_node_id

    - name: Fetch flamegraph
      fetch:
        src: "/home/ubuntu/flamegraph.svg"
        dest: "../../log_files/val-{{ flamegraph_node_id }}.svg"
        flat: true
      when: create_flamegraph and node_id == flamegraph_node_id

    - name: Start snarkos
      systemd:
        name: snarkos
        state: started
      when: create_flamegraph and node_id == flamegraph_node_id
