- name: pregenerate_transactions | generate_batch | Launch batch {{ batch }}
  include_tasks: generate_txs.yml
  vars:
    current_batch: "{{ batch }}"

- name: pregenerate_transactions | generate_batch | Wait for batch {{ batch }}
  async_status:
    jid: "{{ job.ansible_job_id }}"
  register: current_batch_wait_results
  until: current_batch_wait_results.finished
  retries: 100
  delay: 3
  loop: "{{ current_batch_result_jobs.results }}"
  loop_control:
    loop_var: job
    label: "tx {{ job._ansible_item_label | default(job.ansible_job_id) }}"
