- name: Gather information about the network and configuration
  hosts: localhost
  gather_facts: false
  remote_user: ubuntu
  tasks:
    - name: Confirm validator data loaded
      debug:
        msg: "{{ validator_data.accounts }}"

    - name: Fail early if 'test_network' is not in features
      fail:
        msg: "This playbook requires 'test_network' feature to be enabled."
      when: "'test_network' not in (features | default('') | split(','))"

    - name: Assert required variables are set
      assert:
        that:
          - txs_target_consensus_version_height is defined
          - pregeneration_execution_tx_count is defined
          - pregeneration_deployment_tx_count is defined
          - pregeneration_bucket_path is defined
          - pregeneration_tx_batch_size is defined
        fail_msg: >
          This playbook requires the following variables to be set:
          txs_target_consensus_version_height, pregeneration_execution_tx_count, pregeneration_bucket_path, pregeneration_tx_batch_size, pregeneration_deployment_tx_count

    - name: Load credits.aleo program
      set_fact:
        program_data: "{{ lookup('file', playbook_dir + '/../../programs/credits.aleo') }}"

