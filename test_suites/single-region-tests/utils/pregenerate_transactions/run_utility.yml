- name: Install and Configure snarkos on all tx-sender nodes
  hosts: tx_sender_node
  become: true
  remote_user: ubuntu
  vars:
    snarkos_install_s3_release_name: "{{ hostvars['localhost'].standard_release_name | default('snarkos') }}"
    snarkos_install_s3_dest_name: "snarkos"
  roles:
    - snarkos_install_s3
  tags: tx-sender

