- name: Pregenerate a transfer transactions
  hosts: tx_sender_node
  become: true
  remote_user: ubuntu
  become_user: ubuntu
  tasks:
    - name: Set standard release name as fact
      set_fact:
        release_name: "{{ hostvars['localhost'].standard_release_name }}"

    - name: Read pregenerate_transactions_num_validators var (if set)
      set_fact:
        num_validators_value: "{{ pregenerate_transactions_num_validators | default('', true) }}"

    - name: Ask the user if env var is not set
      pause:
        prompt: "How many validators do you expect in the target network?"
      register: num_validators
      when: num_validators_value == ""

    - name: Set unified num_validators_fact from pause or env
      set_fact:
        num_validators_fact: "{{ (num_validators.user_input | default(num_validators_value)) | trim }}"

    - name: Fail if input is not a number
      fail:
        msg: "The number of validators must be an integer, but got '{{ num_validators_fact }}'"
      when: not (num_validators_fact is match('^[0-9]+$'))

    - name: Set unified num_validators_fact from pause or env
      set_fact:
        transactions_file_id_prefix: "{{ snarkos_network }}-{{ num_validators_fact }}val"

    - name: List existing pregenerated transaction zips for this network + validator count
      aws_s3:
        bucket: "{{ s3_bucket }}"
        mode: list
        prefix: "{{ pregeneration_bucket_path }}/transactions-{{ transactions_file_id_prefix }}-{{ txs_target_consensus_version_height }}-{{ release_name }}-{{ pregeneration_execution_tx_count }}-{{ pregeneration_deployment_tx_count }}"
      register: s3_zip_list
      failed_when: false

    - name: Reset zip list
      set_fact:
        matched_zip_files: []

    - name: Collect .zip files
      set_fact:
        matched_zip_files: "{{ matched_zip_files + [item] }}"
      loop: "{{ s3_zip_list.s3_keys }}"
      when: item is search('\\.zip$')

    - name: Set first matched zip (if any)
      set_fact:
        matched_zip_file: "{{ matched_zip_files[0] }}"
      when: matched_zip_files | length > 0

    - name: Found existing pregenerated zip(s) on S3
      debug:
        msg: |
          Found existing pregenerated zip(s) on S3: {{ matched_zip_file }};

          Current release name : {{ release_name }},
          Number of execution transactions to pre-generate : {{ pregeneration_execution_tx_count }}.
          Number of deployment transactions to pre-generate : {{ pregeneration_deployment_tx_count }}.
      when: matched_zip_file is defined

    - name: Found existing pregenerated zip on S3, do you want to overwrite it (yes/no)?
      pause:
        prompt: >-
          Do you want to overwrite? (yes/no)
      register: overwrite_prompt
      when: matched_zip_file is defined

    - name: Abort if user said no
      fail:
        msg: "User declined to overwrite {{ matched_zip_file }}. Aborting."
      when:
        - matched_zip_file is defined
        - overwrite_prompt.user_input | lower != 'yes'

    - name: Set snarkOS binary path based on installation method
      set_fact:
        snarkos_bin_path: "{{ '/root/.cargo/bin' if snarkos_git_hash is defined else '/usr/bin' }}"

    - name: Set txs_target_state_root based on num_validators_fact
      set_fact:
        txs_target_state_root: "{{ hostvars['localhost'].validator_data.state_roots[num_validators_fact | string] }}"

    - name: Set txs_accounts
      set_fact:
        txs_accounts: "{{ hostvars['localhost'].validator_data.accounts }}"

    - name: Batch transaction indices into chunks
      set_fact:
        execution_tx_batches: "{{ range(0, pregeneration_execution_tx_count | int) | list | batch(pregeneration_tx_batch_size) }}"

    - name: Batch deployment transaction indices into chunks
      set_fact:
        deployment_tx_batches: "{{ range(0, pregeneration_deployment_tx_count | int) | list | batch(pregeneration_tx_batch_size) }}"

    - name: Generate and wait for TX batches
      include_tasks: generate_batch.yml
      loop: "{{ execution_tx_batches }}"
      loop_control:
        loop_var: batch
        label: "execution batch {{ batch | join(', ') }}"
      vars:
        batch_type: "execution"

    - name: Generate and wait for Deployment TX batches
      include_tasks: generate_batch.yml
      loop: "{{ deployment_tx_batches }}"
      loop_control:
        loop_var: batch
        label: "deployment batch {{ batch | join(', ') }}"
      vars:
        batch_type: "deployment"

    - name: Rename generated execution transaction files
      ansible.builtin.shell: |
        mv /tmp/transfer_public_tx{{ item }}.txt /tmp/executions-{{ transactions_file_id_prefix }}-{{ txs_target_consensus_version_height }}-{{ item }}.txt
      args:
        executable: /bin/bash
      loop: "{{ range(0, pregeneration_execution_tx_count | int) | list }}"

    - name: Rename generated deployment transaction files
      ansible.builtin.shell: |
        mv /tmp/deployment_tx{{ item }}.txt /tmp/deploys-{{ transactions_file_id_prefix }}-{{ txs_target_consensus_version_height }}-{{ item }}.txt
      args:
        executable: /bin/bash
      loop: "{{ range(0, pregeneration_deployment_tx_count | int) | list }}"

    - name: Zip all renamed transaction files
      ansible.builtin.shell: |
        cd /tmp && zip -q {{ zip_name }} \
          executions-{{ transactions_file_id_prefix }}-{{ txs_target_consensus_version_height }}-*.txt \
          deploys-{{ transactions_file_id_prefix }}-{{ txs_target_consensus_version_height }}-*.txt
      args:
        executable: /bin/bash
      vars:
        zip_name: "transactions-{{ transactions_file_id_prefix }}-{{ txs_target_consensus_version_height }}-{{ release_name }}-{{ pregeneration_execution_tx_count }}-{{ pregeneration_deployment_tx_count }}.zip"

    - name: Upload zipped transactions to S3
      aws_s3:
        bucket: "{{ s3_bucket }}"
        object: "{{ pregeneration_bucket_path }}/{{ zip_name }}"
        src: "/tmp/{{ zip_name }}"
        mode: put
      vars:
        zip_name: "transactions-{{ transactions_file_id_prefix }}-{{ txs_target_consensus_version_height }}-{{ release_name }}-{{ pregeneration_execution_tx_count }}-{{ pregeneration_deployment_tx_count }}.zip"

    - name: Fetch pregeneration log
      fetch:
        src: "/home/ubuntu/transaction_pregeneration.log"
        dest: "{{ base_workspace_folder }}/../log_files/transactions-pregeneration-{{ transactions_file_id_prefix }}.log"
        flat: true
