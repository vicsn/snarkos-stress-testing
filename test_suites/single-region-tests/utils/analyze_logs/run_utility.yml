- name: Analyse tx_runner and prover logs to get stats
  hosts: localhost
  gather_facts: yes
  tasks:
    - name: Create Python virtual environment
      args:
        chdir: "{{ playbook_dir }}"
        creates: "{{ playbook_dir }}/.venv/bin/activate"
      command: python3 -m venv .venv

    - name: Install script dependencies into virtualenv
      command: "{{ playbook_dir }}/.venv/bin/pip install -r requirements.txt"
      environment:
        PIP_BREAK_SYSTEM_PACKAGES: "1"

    - name: Run the python program using virtualenv
      command:
        argv:
          - "{{ playbook_dir }}/.venv/bin/python"
          - analyze_logs.py
          #- --include-client-connectivity # Uncomment to include client connectivity times. Commented by default to not break Talisker's parsing
      register: out

    - name: Print the output
      debug:
        var: out.stdout_lines
