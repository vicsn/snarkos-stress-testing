# Batch transfer continuously to simulate TPS
- name: Bond
  hosts: tx_cannon_bond
  become: true
  vars_files:
    - vars.yml
  vars:
    txcannon_command: tx-cannon batch-execute --test tests/bond_public_validators/10_devnet_validator_bond_public.toml --endpoint http://{{ hostvars['localhost']['snarkos_lb_dns'] }}:3030 --repetitions 500 --concurrent-transactions 50
  remote_user: ubuntu
  roles:
    - txcannon_service
  tags: tx-cannon

# Batch transfer continuously to simulate TPS
- name: Unbond
  hosts: tx_cannon_unbond
  become: true
  vars_files:
    - vars.yml
  vars:
    txcannon_command: tx-cannon batch-execute --test tests/bond_public_validators/10_devnet_validator_unbond_public.toml --endpoint http://{{ hostvars['localhost']['snarkos_lb_dns'] }}:3030 --repetitions 500 --concurrent-transactions 50
  remote_user: ubuntu
  roles:
    - txcannon_service
  tags: tx-cannon

- name: RejectedAborted
  hosts: tx_cannon_rejectedaborted
  become: true
  vars_files:
    - vars.yml
  vars:
    txcannon_command: tx-cannon malice -k APrivateKey1zkp8CZNn3yeCseEtxuVPbDCwSyhGW6yZKUYKfgXmcpoGPWH --redeploy --double-spend --duplicate-transitions -e http://{{ hostvars['localhost']['snarkos_lb_dns'] }}:3030 --deployment-manifest tests/1_deploy_2_seconds/300k_constraints/programs_to_deploy/programs_2.txt --underreport-constraints 10 --repetitions 90000000000001
  remote_user: ubuntu
  roles:
    - txcannon_service
  tags: tx-cannon