# snarkos_setup.yml

- name: Wait for SSH to become available
  hosts: "snarkos_node"
  remote_user: ubuntu
  gather_facts: no
  tasks:
    - name: Wait for SSH to become ready
      ansible.builtin.wait_for:
        port: 22
        host: "{{ inventory_hostname }}"
        timeout: 480  # Maximum seconds to wait.  Default is 300.
                      # Increased timeout to 8 minutes based on AWS experience.
        delay: 10  # seconds to wait before starting to poll
        sleep: 2  # number of seconds to sleep between checks.  Default is 1.
        state: started  # 'started' is the default---it just means the port is open
      any_errors_fatal: true  # Don't continue without a full complement of instances

- name: Set up snarkOS nodes
  hosts: "snarkos_node"
  become: yes
  remote_user: ubuntu
  vars:
    verbosity: "1"
  tasks:
    - name: Install GitHub CLI
      ansible.builtin.shell: |
        type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
        curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg \
        && sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg \
        && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
        && sudo apt update \
        && sudo apt install gh -y
      args:
        executable: /bin/bash
      become: yes

    - name: Export GitHub token for gh CLI
      ansible.builtin.set_fact:
        gh_token: "{{ lookup('env', 'GITHUB_TOKEN') }}"

    - name: Gather facts from all nodes
      setup:

    - name: Set first node IP address
      ansible.builtin.set_fact:
        first_node_ip: "{{ hostvars[groups['snarkos_node'][0]]['public_ip_address']}}"
      when: groups['snarkos_node'] is defined and groups['snarkos_node'] | length > 0
      run_once: true

    - name: Determine the number of instances
      ansible.builtin.set_fact:
        num_instances: "{{ groups['snarkos_node'] | length }}"
      run_once: true

    - name: Set node_id based on instance tag
      ansible.builtin.set_fact:
        node_id: "{{ tags['Dev'] }}"

    - name: Download snarkOS binary with GitHub CLI 
      ansible.builtin.shell: >
        TAG=mainnet-latest

        apt-get install -y unzip

        GITHUB_TOKEN="{{ gh_token }}" gh release download ${TAG}
        --repo aleoHQ/snarkOS-staging
        --pattern "snarkos*unknown-linux-gnu.zip"
        --output "/usr/bin/snarkos.zip"
        --skip-existing

        unzip -o /usr/bin/snarkos.zip -d /usr/bin
      environment:
        GITHUB_TOKEN: "{{ gh_token }}"
      args:
        executable: /bin/bash
      become: yes

    - name: Slurp the commit hash
      ansible.builtin.slurp:
        src: '/usr/bin/SNARKOS_COMMIT_HASH'
      register: file_content_encoded

    - name: Decode the file commit from base64
      ansible.builtin.set_fact:
        commit_hash: "{{ file_content_encoded['content'] | b64decode | trim }}"

    - name: Make snarkos executable
      file:
        path: "/usr/bin/snarkos"
        mode: '0755'

    - name: Set environment variables for snarkos service
      ansible.builtin.set_fact:
        ansible_env:
          FIRST_NODE_IP: "{{ first_node_ip }}"
          VERBOSITY: "{{ verbosity }}"
          NODE_ID: "{{ node_id }}"
          NUM_INSTANCES: "{{ num_instances }}"
      tags: always

    - name: Deploy the snarkos systemd service file
      template:
        src: snarkos.service
        dest: /etc/systemd/system/snarkos.service
      become: yes

    - name: Reload systemd to read new snarkos service file
      systemd:
        daemon_reload: yes
      become: yes

    - name: Restart snarkos service
      systemd:
        name: snarkos
        state: restarted
      become: yes

    - name: Install Docker
      apt:
        name: docker.io
        state: present
        update_cache: yes
        
    - name: Ensure Docker service is started
      service:
        name: docker
        state: started

    - name: Run Docker Process Exporter for snarkos
      ansible.builtin.shell: >
        docker run -d --rm -p 9256:9256 --privileged -v /proc:/host/proc -v $(pwd):/config ncabatoff/process-exporter --procfs /host/proc -procnames snarkos
      args:
        executable: /bin/bash

# logstash
- name: Install and Configure Logstash
  hosts: "snarkos_node"
  become: yes
  remote_user: ubuntu

  vars:
    cloud_id: "{{ lookup('env', 'ELASTIC_CLOUD_ID') }}"
    api_key: "{{ lookup('env', 'ELASTIC_API_KEY') }}"
    devnet_name: "{{ lookup('env', 'DEVNET_NAME') }}"

  tasks:
    - name: Set AWS Region Fact
      ansible.builtin.set_fact:
        aws_region: "{{ ansible_host.split('.')[1] }}"
      when: ansible_host is defined

    - name: Add Elastic GPG key
      ansible.builtin.shell:
        cmd: "wget -qO - https://artifacts.elastic.co/GPG-KEY-elasticsearch | gpg --batch --yes --dearmor -o /usr/share/keyrings/elastic-keyring.gpg"

    - name: Add Elastic APT repository
      ansible.builtin.lineinfile:
        path: /etc/apt/sources.list.d/elastic-8.x.list
        line: "deb [signed-by=/usr/share/keyrings/elastic-keyring.gpg] https://artifacts.elastic.co/packages/8.x/apt stable main"
        create: yes
        state: present

    - name: Update and install Logstash
      ansible.builtin.apt:
        update_cache: yes
        name: logstash
        state: latest

    - name: Copy Logstash Configuration Template
      ansible.builtin.template:
        src: logstash.conf
        dest: /etc/logstash/conf.d/logstash.conf
      vars:
        host_public_ip: "{{ hostvars[inventory_hostname]['public_ip_address'] }}" 
        commit_hash: "{{ commit_hash }}"

    - name: Start Logstash Service
      ansible.builtin.systemd:
        name: logstash
        state: started
        enabled: yes

# metrics on grafana
- name: Install prometheus and enable remote forwarding to Grafana cloud
  hosts: prometheus_server
  become: yes 
  gather_facts: true 
  vars:
    ansible_user: ubuntu 
    grafana_cloud_api_key: "{{ lookup('env', 'GRAFANA_CLOUD_API_KEY') }}"
    devnet_name: "{{ lookup('env', 'DEVNET_NAME') }}"

  tasks:
    - name: Copy docker-compose.yml
      copy:
        src: docker-compose.yml  
        dest: /home/ubuntu/docker-compose.yml
        owner: ubuntu 
        group: ubuntu  
      become_user: ubuntu

    - name: Install Docker
      apt:
        name: docker.io
        state: present
        update_cache: yes

    - name: Ensure Docker service is started
      service:
        name: docker
        state: started

    - name: Install Docker Compose
      get_url:
        url: "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-{{ ansible_system }}-{{ ansible_architecture }}"
        dest: "/usr/local/bin/docker-compose"
        mode: 'u+x,g+x'

    - name: Create YAML scrape target file of all nodes
      ansible.builtin.template:
        src: prometheus.yml 
        dest: /home/ubuntu/prometheus.yml

    - name: Install unzip
      ansible.builtin.package:
        name: unzip
        state: present

    - name: Download, unzip, and set execute permissions on Grafana Agent
      ansible.builtin.shell: |
        curl -O -L "https://github.com/grafana/agent/releases/latest/download/grafana-agent-linux-amd64.zip" &&
        unzip "grafana-agent-linux-amd64.zip" &&
        chmod a+x grafana-agent-linux-amd64
      args:
        chdir: /home/ubuntu
        creates: grafana-agent-linux-amd64

    - name: Run docker-compose up
      command: docker-compose up -d
      args:
        chdir: /home/ubuntu/

# Setting up and running tx-cannon on tx-cannon instances
- name: Set up and run tx-cannon
  hosts: "tx_cannon_node"
  become: yes
  remote_user: ubuntu
  vars:
    verbosity: "1"
  tasks:
    - name: Install GitHub CLI
      ansible.builtin.shell: |
        type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
        curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg \
        && sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg \
        && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
        && sudo apt update \
        && sudo apt install gh -y
      args:
        executable: /bin/bash
      become: yes

    - name: Export tx-cannon GitHub token for gh CLI
      ansible.builtin.set_fact:
        gh_token: "{{ lookup('env', 'GITHUB_TOKEN') }}"

    - name: Clone or update tx-cannon
      git:
        repo: "https://{{ gh_token }}:x-oauth-basic@github.com/AleoHQ/tx-cannon.git"
        dest: "/home/ubuntu/tx-cannon"
        version: "mainnet"

    - name: Gather facts from all nodes
      setup:

    - name: Download tx-cannon binary with GitHub CLI 
      ansible.builtin.shell: >
        TAG=mainnet-latest

        apt-get install -y unzip

        GITHUB_TOKEN="{{ gh_token }}" gh release download ${TAG}
        --repo aleoHQ/tx-cannon
        --pattern "tx-cannon*unknown-linux-gnu.zip"
        --output "/usr/bin/tx-cannon.zip"
        --skip-existing

        unzip -o /usr/bin/tx-cannon.zip -d /usr/bin
      environment:
        GITHUB_TOKEN: "{{ gh_token }}"
      args:
        executable: /bin/bash
      become: yes
  
    - name: Make tx-cannon executable
      file:
        path: "/usr/bin/tx-cannon"
        mode: '0755'

    # The network driver seems to make the tx-cannon instance respond better to the deployment.
    # (see https://github.com/AleoHQ/stress-observability/blob/main/test_suites/finalize_scope_attacks/finalize_hash_10_validators/snarkos_setup.yml#L232-L248 )
    - name: Timestamp before tx-cannon network driver
      debug:
        msg: "{{ now() }}"

    - name: Run tx-cannon network driver
      ansible.builtin.shell: |
        cd /home/ubuntu/tx-cannon
        sudo bash -c '/usr/bin/tx-cannon batch-execute --test tests/network_driver/network_driver.toml -e http://{{ test_network_url }}:3030 -r 9000001  >> tx-cannon1.log 2>&1'
      args:
        executable: /bin/bash
      async: 36000  # Adjust based on expected duration of the tx-cannon run
      poll: 0

    - name: Timestamp before tx-cannon deploy
      debug:
        msg: "{{ now() }}"

    - name: Deploy hello_hello.aleo to tx-cannon
      ansible.builtin.shell: |
        cd /home/ubuntu/tx-cannon
        sudo bash -c '/usr/bin/tx-cannon deploy -p tests/hello_world_flood/hello_hello.aleo -k APrivateKey1zkp8CZNn3yeCseEtxuVPbDCwSyhGW6yZKUYKfgXmcpoGPWH -e http://{{ test_network_url }}:3030 >> tx-cannon2.log 2>&1'
      args:
        executable: /bin/bash
      register: result
      run_once: true
      delegate_to: "{{ groups['tx_cannon_node'][0] }}"

    # if you do "register: result" in the previous task, you might also do this:
    - debug:
        msg: "Deploy result: {{ result }}"

    - name: Wait for the deployed program to be ready
      uri:
        url: "http://{{ test_network_url }}:3030/mainnet/program/hello_hello.aleo"
        method: GET
        status_code: 200
        timeout: 10
      register: result
      until: result.status == 200
      retries: 30  # Number of retries
      delay: 10  # Delay in seconds between retries

    - name: Timestamp before tx-cannon batch-execute
      debug:
        msg: "{{ now() }}"

    - name: Try running tx-cannon batch-execute
      ansible.builtin.shell: |
        cd /home/ubuntu/tx-cannon
        sudo bash -c "/usr/bin/tx-cannon batch-execute --test tests/hello_world_flood/hello_hello.toml -e http://{{ test_network_url }}:3030 --repetitions 9000001 >> tx-cannon3.log 2>&1"
      args:
        executable: /bin/bash
      async: 21600  # Adjust based on expected duration of the tx-cannon run
      poll: 0
      run_once: true
      # Note: if there is more than one tx-cannon, the following does not necessarily send the task to tx-cannon-node-0.
      # I observed tx-cannon-node-1 having tx-cannon3.log.
      delegate_to: "{{ groups['tx_cannon_node'][0] }}"

    - name: Fetch tx-cannon log 1
      ansible.builtin.fetch:
        src: "/home/ubuntu/tx-cannon/tx-cannon1.log"
        dest: "./{{ inventory_hostname }}-tx-cannon1.log"
        flat: yes
      ignore_errors: yes  # Optional, to proceed even if fetching logs fails

    - name: Fetch tx-cannon log 2
      ansible.builtin.fetch:
        src: "/home/ubuntu/tx-cannon/tx-cannon2.log"
        dest: "./{{ inventory_hostname }}-tx-cannon2.log"
        flat: yes
      ignore_errors: yes  # Optional, to proceed even if fetching logs fails
      run_once: true
      delegate_to: "{{ groups['tx_cannon_node'][0] }}"

    - name: Fetch tx-cannon log 3
      ansible.builtin.fetch:
        src: "/home/ubuntu/tx-cannon/tx-cannon3.log"
        dest: "./{{ inventory_hostname }}-tx-cannon3.log"
        flat: yes
      ignore_errors: yes  # Optional, to proceed even if fetching logs fails
      run_once: true
      delegate_to: "{{ groups['tx_cannon_node'][0] }}"


