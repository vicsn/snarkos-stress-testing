# While the tx-cannon is running, take 30% of the validators at a time,
# pauses them, waits one hour to make sure the others progress,
# then restarts them and allow 8 minutes for them to recover.
# (Repeats until all validators are done, so the last group will be 10%
# or slightly more since the 30% is rounded down.)

- name: Stop snarkOS service on groups of 30%
  hosts: snarkos_node
  serial: 30%
  remote_user: ubuntu
  become: yes
  tasks:
    - name: Set batch_number
      ansible.builtin.set_fact:
        batch_number: "{{ (hostvars['localhost']['batch_number'] | default(0) | int) + 1 }}"
      run_once: true # runs once per serial batch
      # The above will create a different batch_number variable
      # for each batch, and they will all have value 1.
      # To prevent that, we force the variable to be stored in the control node's hostvars.
      delegate_to: localhost
      delegate_facts: true

    - name: Stop snarkOS service
      systemd:
        name: snarkos
        state: stopped

    - name: snarkOS service stopped
      debug:
        msg: "Hosts in batch #{{ hostvars['localhost']['batch_number'] }} stopped at: {{ now() }}"
      run_once: true    # runs once per serial batch

    - name: Wait for 60 minutes to let the validators fall behind.
      pause:
        minutes: 60
      run_once: true    # runs once per serial batch

    - name: Start snarkOS service again
      systemd:
        name: snarkos
        state: started

    - name: snarkOS service restarted
      debug:
        msg: "Hosts in batch #{{ hostvars['localhost']['batch_number'] }} restarted at: {{ now() }}"
      run_once: true    # runs once per serial batch

    - name: Wait for 10 minutes to let the validators recover
      pause:
        minutes: 10
      run_once: true    # runs once per serial batch

- name: See if network remains stable
  hosts: snarkos_node
  remote_user: ubuntu
  become: yes
  tasks:
    - name: Finally run another 20 minutes
      pause:
        minutes: 20
      run_once: true

    - name: Report end time
      debug:
        msg: "Done with test at: {{ now() }}"
      run_once: true

