- name: Pause execution
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Sleep for 10 minutes
      pause:
        minutes: 10

- name: Fetch the tx cannon logs to the local machine
  hosts: "tx_cannon_node"
  become: yes
  remote_user: ubuntu
  vars:
    verbosity: "1"
  tasks:
    - name: Fetch tx-cannon logs targeting the malicious node
      fetch:
        src: "/home/ubuntu/tx-cannon/tx-cannon.log"
        dest: "./{{ inventory_hostname }}-tx-cannon_malicious.log"
        flat: yes
      ignore_errors: yes  # Optional, to proceed even if fetching logs fails

    - name: Fetch tx-cannon logs targeting the honest node
      fetch:
        src: "/home/ubuntu/tx-cannon/tx-cannon2.log"
        dest: "./{{ inventory_hostname }}-tx-cannon_honest.log"
        flat: yes
      ignore_errors: yes  # Optional, to proceed even if fetching logs fails
