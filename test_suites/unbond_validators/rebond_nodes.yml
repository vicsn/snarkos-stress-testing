# Setting up and running tx-cannon on tx-cannon instances
- name: Set up and run tx-cannon
  hosts: "tx_cannon_node"
  become: yes
  remote_user: ubuntu
  vars:
    verbosity: "1"
    file_path: "/home/ubuntu/tx-cannon/tests/test_data/validator_keys.txt"
  tasks:
    - name: Gather facts from all nodes
      setup:

    - name: Determine the number of instances
      set_fact:
        total_nodes: "{{ groups['snarkos_node'] | length }}"
      run_once: true
  
    - name: Calculate 30% of total nodes
      set_fact:
        nodes_to_process: "{{ ((total_nodes | int) * 0.3) | round(0, 'ceil') | int }}"
      run_once: true

    - name: Read file and save 30% of the lines
      ansible.builtin.shell: "head -n {{ nodes_to_process }} {{ file_path }}"
      register: selected_nodes

    - name: claim unbond
      ansible.builtin.shell: 
        sudo bash -c "/usr/bin/snarkos developer execute credits.aleo claim_unbond_public --private-key {{ item[0] }} --query 'http://{{ test_network_url }}:3030' --broadcast 'http://{{ test_network_url }}:3030/mainnet/transaction/broadcast'"
      args:
        executable: /bin/bash
      run_once: true
      delegate_to: "{{ groups['tx_cannon_node'][1] }}"
      loop: "{{ selected_nodes.stdout_lines | map('from_json') | list }}"

    - name: Pause the playbook for 2 min
      ansible.builtin.pause:
        minutes: 2

    - name: Try running tx-cannon rebonding 30% nodes
      ansible.builtin.shell: 
        sudo bash -c "/usr/bin/snarkos developer execute credits.aleo bond_public {{ item[1] }} 50000000000000u64 --private-key {{ item[0] }} --query 'http://{{ test_network_url }}:3030' --broadcast 'http://{{ test_network_url }}:3030/mainnet/transaction/broadcast'"
      args:
        executable: /bin/bash
      run_once: true
      register: shell_output
      delegate_to: "{{ groups['tx_cannon_node'][1] }}"
      loop: "{{ selected_nodes.stdout_lines | map('from_json') | list }}"

    - name: Debug print command output
      ansible.builtin.debug:
        msg: "{{ shell_output }}" 
