plugin: amazon.aws.aws_ec2

regions:

keyed_groups:
  - key: tags.Role
    prefix: ""
    separator: ""
    value: "snarkos-node-standard"
  - key: tags.Role
    prefix: ""
    separator: ""
    value: "snarkos-node-malicious"
  - key: tags.Role
    prefix: ""
    separator: ""
    value: "tx-cannon-node"
  - key: tags.Role
    prefix: ""
    separator: ""
    value: "prometheus-server"

filters:
  instance-state-name: running
  tag:Role: ["snarkos-node-standard", "snarkos-node-malicious", "tx-cannon-node", "prometheus-server"]
