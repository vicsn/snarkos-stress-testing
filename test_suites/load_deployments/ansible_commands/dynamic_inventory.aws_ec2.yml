# dynamic_inventory.aws_ec2.yml
plugin: amazon.aws.aws_ec2
regions:

keyed_groups:
  - key: tags.Role
    prefix: ""
    separator: ""
    value: "snarkos-node"
  - key: tags.Role
    prefix: ""
    separator: ""
    value: "attacker-tx-cannon-node"
  - key: tags.Role
    prefix: ""
    separator: ""
    value: "prometheus-server"
  - key: tags.Role
    prefix: ""
    separator: ""
    value: "tx-cannon-node"

filters:
  instance-state-name: running
  tag:Role: ["snarkos-node", "attacker-tx-cannon-node", "prometheus-server", "tx-cannon-node"]
  