plugin: amazon.aws.aws_ec2

regions: us-east-2,us-west-2

profile: ephnet

keyed_groups:
  - key: tags.Role
    prefix: ""
    separator: ""
  - key: tags.Name
    prefix: ""
    separator: ""

filters:
  instance-state-name: running
  "tag:Devnet": "network-sync-tests"
  "tag:Role":
    - "prometheus-server"
    - "snarkos-client"
    - "builder"

compose:
  ansible_host: public_ip_address
