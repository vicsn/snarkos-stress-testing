- name: Wait for SSH to become available
  hosts: all
  remote_user: ubuntu
  gather_facts: false
  tasks:
    - name: Wait for SSH to become ready
      ansible.builtin.wait_for_connection:

- name: Check which installation method is used
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Check if a local pre-built version should be used
      ansible.builtin.set_fact:
        use_local_pre_build: >-
          {{
            (snarkos_pre_build_location is defined and snarkos_pre_build_location | length > 0)
          }}

    - name: Check if S3 pre-built version should be used
      ansible.builtin.set_fact:
        use_s3_pre_build: >-
          {{
            (snarkos_pre_build_location is undefined) and
            (s3_bucket is defined and s3_bucket | length > 0) and
            (use_snarkos_pre_build_s3 is defined and use_snarkos_pre_build_s3|bool)
          }}

    - name: Check if local build should be used
      ansible.builtin.set_fact:
        use_local_build: >-
          {{
            (snarkos_pre_build_location is undefined) and
            (use_snarkos_pre_build_s3 is undefined or not use_snarkos_pre_build_s3|bool) and
            (snarkos_repo is defined and snarkos_repo | length > 0) and
            (snarkos_git_commit_local_build is defined and snarkos_git_commit_local_build | length > 0)
          }}

    - name: Check if GitHub build should be used
      ansible.builtin.set_fact:
        use_github_build: >-
          {{
            (snarkos_pre_build_location is undefined) and
            (use_snarkos_pre_build_s3 is undefined or not use_snarkos_pre_build_s3|bool) and
            (snarkos_binary_tag is defined and snarkos_binary_tag | length > 0)
          }}

    - name: Check if remote build should be used
      ansible.builtin.set_fact:
        use_remote_build: >-
          {{
            (snarkos_pre_build_location is undefined) and
            (use_snarkos_pre_build_s3 is undefined or not use_snarkos_pre_build_s3|bool) and
            (snarkos_git_hash is defined and snarkos_git_hash | length > 0) and
            (snarkos_repo is defined and snarkos_repo | length > 0)
          }}

    - name: Check malice download method
      ansible.builtin.set_fact:
        use_malicious_snarkos_pre_build: >-
          {{
            (use_malicious_snarkos_pre_build is defined) and (use_malicious_snarkos_pre_build|bool)
          }}

- name: Build and upload snarkOS to S3 if required
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Set git commit variable for standard build
      set_fact:
        snarkos_git_commit_to_build: "{{ snarkos_git_commit_local_build }}"
      when: snarkos_git_commit_local_build is defined

    - name: Set standard release name
      set_fact:
        standard_release_name: "{{ generate_release_name | replace('COMMIT_HASH', snarkos_git_commit_to_build) | trim }}"
      when: snarkos_git_commit_local_build is defined

    - name: Debug standard release name
      debug:
        msg: "Standard release name: '{{ standard_release_name }}'"
      when: snarkos_git_commit_local_build is defined

    - name: Build and upload standard snarkOS to S3
      include_role:
        name: snarkos_build_locally
      when: hostvars['localhost'].use_local_build

# ------------------------------------------------
# snarkOS installation

- name: Install snarkOS
  hosts: snarkos*
  become: true
  remote_user: ubuntu
  vars:
    s3_bucket: "{{ s3_bucket }}"
    snarkos_pre_build_location: "{{ snarkos_pre_build_location }}"
    snarkos_git_hash: "{{ hostvars['localhost'].snarkos_git_hash }}"
    release_name: "{{ hostvars['localhost'].standard_release_name | default('snarkos') }}"
    dest_name: "snarkos"
  tasks:
    - name: Use local pre-built version
      ansible.builtin.include_role:
        name: snarkos_upload_local
      when: hostvars['localhost'].use_local_pre_build

    - name: Install snarkOS from S3
      ansible.builtin.include_role:
        name: snarkos_install_s3
      vars:
        snarkos_install_s3_release_name: "{{ release_name }}"
        snarkos_install_s3_dest_name: "{{ dest_name }}"
      when: hostvars['localhost'].use_s3_pre_build or hostvars['localhost'].use_local_build

    - name: Install snarkOS from binary
      ansible.builtin.include_role:
        name: snarkos_install_binary
      when: hostvars['localhost'].use_github_build

    - name: Build snarkOS from git
      ansible.builtin.include_role:
        name: snarkos_build_from_git
      when: hostvars['localhost'].use_remote_build

  tags: snarkos_install

# ------------------------------------------------
# zip
- name: Install zip
  hosts: snarkos*
  become: true
  remote_user: ubuntu
  tasks:
    - name: Install zip
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
        update_cache: true
      with_items:
        - zip
      retries: 20
      delay: 30
      until: apt_result is success

