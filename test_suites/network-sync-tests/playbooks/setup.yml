- name: Wait for SSH to become available
  hosts: all
  remote_user: ubuntu
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Wait for SSH to become ready
      ansible.builtin.wait_for_connection:

- name: Select installation method and build if needed
  hosts: localhost
  gather_facts: true
  any_errors_fatal: true
  roles:
    - check_and_setup_snarkos

# ------------------------------------------------
# snarkOS installation

- name: Install snarkOS
  hosts: snarkos*
  become: true
  remote_user: ubuntu
  strategy: free
  vars:
    s3_bucket: "{{ s3_bucket }}"
    snarkos_pre_build_location: "{{ snarkos_pre_build_location }}"
    snarkos_git_hash: "{{ hostvars['localhost'].snarkos_git_hash }}"
    release_name: "{{ hostvars['localhost'].standard_release_name | default('snarkos') }}"
    dest_name: "snarkos"
  tasks:
    - name: Use local pre-built version
      ansible.builtin.include_role:
        name: snarkos_upload_local
      when: hostvars['localhost'].use_local_pre_build

    - name: Install snarkOS from S3
      ansible.builtin.include_role:
        name: snarkos_install_s3
      vars:
        snarkos_install_s3_release_name: "{{ release_name }}"
        snarkos_install_s3_dest_name: "{{ dest_name }}"
      when: hostvars['localhost'].use_s3_pre_build or hostvars['localhost'].use_local_build

    - name: Install snarkOS from binary
      ansible.builtin.include_role:
        name: snarkos_install_binary
      when: hostvars['localhost'].use_github_build

    - name: Build snarkOS from git
      ansible.builtin.include_role:
        name: snarkos_build_from_git
      when: hostvars['localhost'].use_remote_build

  tags: snarkos_install

# ------------------------------------------------
# Dependencies
- name: Install dependencies
  hosts: snarkos*
  become: true
  remote_user: ubuntu
  tasks:
    - name: Update apt cache (retry on transient lock/network issues)
      ansible.builtin.apt:
        update_cache: true
      register: apt_update
      until: apt_update is succeeded
      retries: 10
      delay: 6

    - name: Install dependencies
      ansible.builtin.apt:
        name:
          - zip
          - unzip
          - awscli
          - tar
        state: present
      register: apt_result
      until: apt_result is succeeded
      retries: 20
      delay: 30

# ------------------------------------------------
# Observability setup

- name: Force-Run docker-compose up with process exporter # noqa: no-changed-when
  hosts: snarkos*
  become: true
  remote_user: ubuntu
  any_errors_fatal: true
  strategy: free
  tasks:
    - name: Rename docker-compose.yml if process-exporter version does not exist
      ansible.builtin.command: mv /home/ubuntu/docker-compose.yml /home/ubuntu/docker-compose-process-exporter.yml
      args:
        removes: /home/ubuntu/docker-compose.yml  # only runs if this file exists
        creates: /home/ubuntu/docker-compose-process-exporter.yml  # only runs if this doesn't exist
    - name: Force-Run docker-compose up with process exporter, restart
      any_errors_fatal: true
      command:
        cmd: docker-compose -f docker-compose-process-exporter.yml up -d --force-recreate
        chdir: /home/ubuntu/
  tags: process_exporter

# ------------------------------------------------
# snarkOS Node Exporter

- name: Force-Run docker-compose up with node exporter # noqa: no-changed-when
  hosts: snarkos*
  become: true
  remote_user: ubuntu
  any_errors_fatal: true
  strategy: free
  tasks:
    - name: Force-Run docker-compose up with node exporter, restart
      command:
        cmd: docker-compose -f docker-compose-node-exporter.yml up -d --force-recreate
        chdir: /home/ubuntu/
      retries: 5
      delay: 20
      register: docker_compose_up_result
      until: docker_compose_up_result.rc == 0
  tags: node_exporter

# ------------------------------------------------
# Metricbeat, Filebeat, Logstash

- name: Install and Configure Metricbeat, Filebeat and Logstash
  hosts: snarkos*
  become: true
  remote_user: ubuntu
  any_errors_fatal: true
  strategy: free
  pre_tasks:
    - name: Add logging enrichment to Metricbeat, Filebeat and Logstash
      include_tasks: logging_enrichment.yml
      vars:
        use_local_pre_build: "{{ hostvars['localhost'].use_local_pre_build }}"
        use_s3_pre_build: "{{ hostvars['localhost'].use_s3_pre_build }}"
        use_local_build: "{{ hostvars['localhost'].use_local_build }}"
        use_github_build: "{{ hostvars['localhost'].use_github_build }}"
        use_remote_build: "{{ hostvars['localhost'].use_remote_build }}"
        snarkos_git_hash: "{{ hostvars['localhost'].snarkos_git_hash }}"
  roles:
    - logstash_setup
    - metricbeat_setup
    - filebeat_setup
  vars:
    preinstalled: true

# ------------------------------------------------
# Prometheus for Grafana metrics

- name: Install and Configure Prometheus
  hosts: prometheus_server
  become: true
  remote_user: ubuntu
  gather_facts: true
  any_errors_fatal: true
  roles:
    - prometheus_setup_with_clients
  vars:
    test_runner_for_metrics_ip: "{{ test_runner_ip | default('localhost') }}"

# ------------------------------------------------
# snarkOS clients

- name: Prepare snapshot URLs for clients
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Read snapshot URLs file
      slurp:
        src: "{{ playbook_dir }}/snapshot_urls.txt"  # Update with your actual path
      register: snapshot_urls_content
      run_once: true

    - name: Display snapshot URLs content
      debug:
        msg: "{{ snapshot_urls_content.content | b64decode }}"
      run_once: true

# ------------------------------------------------
# snarkOS clients

- name: Set up and start snarkOS network for clients
  hosts: snarkos_client
  become: true
  remote_user: ubuntu
  pre_tasks:
    - name: Set snapshot URL based on client index
      set_fact:
        snapshot_url: "{{ (hostvars['localhost'].snapshot_urls_content.content | b64decode).split('\n')[groups['snarkos_client'].index(inventory_hostname)] if groups['snarkos_client'].index(inventory_hostname) > 0 else '' }}"

    - name: Display assigned snapshot URL
      debug:
        msg: "Host {{ inventory_hostname }} assigned snapshot URL: {{ snapshot_url }}"

    - name: Deploy download and restart script
      template:
        src: download_snapshot.sh.j2
        dest: /home/ubuntu/download_snapshot.sh
        mode: '0755'
        owner: ubuntu
        group: ubuntu

    - name: Set client facts
      include_tasks: set_client_facts.yml

  roles:
    - snarkos_service

  post_tasks:
    - name: Execute download and restart script
      shell: /home/ubuntu/download_snapshot.sh > /home/ubuntu/download_snapshot_$(date +%Y%m%d-%H%M%S).log 2>&1
      async: 18000  # 5 hours timeout
      poll: 0
      register: download_job

  tags: snarkos_client
