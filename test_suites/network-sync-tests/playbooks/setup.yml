# ------------------------------------------------
# snarkOS clients

- name: Prepare snapshot URLs for clients
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Read snapshot URLs file
      slurp:
        src: "{{ playbook_dir }}/snapshot_urls.txt"  # Update with your actual path
      register: snapshot_urls_content
      run_once: true

    - name: Display snapshot URLs content
      debug:
        msg: "{{ snapshot_urls_content.content | b64decode }}"
      run_once: true

# ------------------------------------------------
# snarkOS clients

- name: Set up and start snarkOS network for clients
  hosts: snarkos_client
  become: true
  remote_user: ubuntu
  pre_tasks:
    - name: Set snapshot URL based on client index
      set_fact:
        snapshot_url: "{{ (hostvars['localhost'].snapshot_urls_content.content | b64decode).split('\n')[groups['snarkos_client'].index(inventory_hostname)] if groups['snarkos_client'].index(inventory_hostname) > 0 else '' }}"

    - name: Display assigned snapshot URL
      debug:
        msg: "Host {{ inventory_hostname }} assigned snapshot URL: {{ snapshot_url }}"

    - name: Deploy download and restart script
      template:
        src: download_snapshot.sh.j2
        dest: /tmp/download_snapshot.sh
        mode: '0755'

    - name: Set client facts
      include_tasks: set_client_facts.yml

  roles:
    - snarkos_service

  post_tasks:
    - name: Execute download and restart script
      shell: /tmp/download_snapshot.sh > /var/log/download_snapshot_$(date +%Y%m%d-%H%M%S).log 2>&1
      async: 18000  # 5 hours timeout
      poll: 0
      register: download_job

  tags: snarkos_client
