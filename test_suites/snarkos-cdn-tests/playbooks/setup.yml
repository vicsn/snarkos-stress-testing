- name: Wait for SSH to become available
  hosts: all
  remote_user: ubuntu
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Wait for SSH to become ready
      ansible.builtin.wait_for_connection:

# ------------------------------------------------
# snarkOS installation

- name: Install snarkOS
  hosts: snarkos*
  become: true
  remote_user: ubuntu
  strategy: free
  vars:
    s3_bucket: "{{ s3_bucket }}"
    snarkos_pre_build_location: "{{ snarkos_pre_build_location }}"
    snarkos_git_hash: "{{ hostvars['localhost'].snarkos_git_hash }}"
    release_name: "{{ hostvars['localhost'].release_name | default('snarkos') }}"
    dest_name: "snarkos"
  tasks:
    - name: Install snarkOS from S3
      ansible.builtin.include_role:
        name: snarkos_install_s3
      vars:
        release_name: "{{ release_name }}"
        snarkos_install_s3_dest_name: "{{ dest_name }}"

  tags: snarkos_install

# ------------------------------------------------
# Dependencies
- name: Install dependencies (ensure aria2 is always present)
  hosts: snarkos*
  become: true
  remote_user: ubuntu
  any_errors_fatal: true
  vars:
    gcloud_version: "486.0.0"
    gcloud_tgz_url: "https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-{{ gcloud_version }}-linux-x86_64.tar.gz"
    gcloud_sdk_dir: /usr/local/google-cloud-sdk
  tasks:
    - name: Update apt cache (retry on transient lock/network issues)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      register: apt_update
      until: apt_update is succeeded
      retries: 10
      delay: 6

    - name: Install dependencies
      ansible.builtin.apt:
        name:
          - aria2
          - zip
          - unzip
          - awscli
          - tar
          - zstd
          - curl
        state: present
      register: apt_result
      until: apt_result is succeeded
      retries: 20
      delay: 30

    - name: Verify aria2 installation
      ansible.builtin.command: aria2c --version
      register: aria2_version
      changed_when: false
      failed_when: aria2_version.rc != 0

    - name: Print aria2 version
      debug:
        msg: "aria2 successfully installed: {{ aria2_version.stdout_lines | first }}"

    - name: Download Google Cloud SDK archive
      ansible.builtin.get_url:
        url: "{{ gcloud_tgz_url }}"
        dest: /tmp/gcloud.tar.gz
        mode: '0644'

    - name: Extract Google Cloud SDK
      ansible.builtin.unarchive:
        src: /tmp/gcloud.tar.gz
        dest: /usr/local
        remote_src: yes
        creates: "{{ gcloud_sdk_dir }}"

    - name: Install components (gsutil included by default)
      ansible.builtin.command:
        cmd: "{{ gcloud_sdk_dir }}/install.sh --quiet"
      args:
        creates: "{{ gcloud_sdk_dir }}/bin/gcloud"

    - name: Add PATH for all users
      ansible.builtin.copy:
        dest: /etc/profile.d/google-cloud-sdk.sh
        mode: '0644'
        content: |
          export PATH={{ gcloud_sdk_dir }}/bin:$PATH

    - name: Verify gsutil
      ansible.builtin.command: "{{ gcloud_sdk_dir }}/bin/gsutil version"
      register: gsutil_version
      changed_when: false

    - name: Print gsutil version (which will show it was installed OK)
      debug:
        msg: "gsutil version: {{ gsutil_version.stdout }}"

# ------------------------------------------------
# snarkOS clients

- name: Prepare snapshot URLs for clients
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Read snapshot URLs file
      slurp:
        src: "{{ snapshot_urls_path | default(playbook_dir ~ '/snapshot_urls.txt') }}"
      register: snapshot_urls_content
      run_once: true

    - name: Display snapshot URLs content
      debug:
        msg: "{{ snapshot_urls_content.content | b64decode }}"
      run_once: true


# ------------------------------------------------
# snarkOS clients

- name: Set up and start snarkOS network for clients
  hosts: snarkos_client
  become: true
  remote_user: ubuntu
  pre_tasks:
    - name: Load snapshot URLs from controller hostvars
      set_fact:
        _snapshot_lines_clean: >-
          {{
            hostvars['localhost'].snapshot_urls_content.content
            | b64decode
            | regex_replace('\r', '')
            | regex_findall('[^\n]+')
            | map('regex_replace', '^\s+|\s+$', '')
            | reject('equalto', '')
            | reject('match', '^#')
            | list
          }}

    - name: Debug normalized URLs (once)
      debug:
        var: _snapshot_lines_clean
      run_once: true

    - name: Compute play-scoped client list in group order
      set_fact:
        _clients_in_play: "{{ groups['snarkos_client'] | select('in', ansible_play_hosts_all) | list }}"

    - name: Compute per-client index in this play
      set_fact:
        client_index: "{{ _clients_in_play.index(inventory_hostname) }}"

    - name: Set snapshot URL
      set_fact:
        # noqa jinja[spacing]
        snapshot_url: >-
          {%- set urls = _snapshot_lines_clean -%}
          {%- set num_urls = urls | length -%}
          {%- set idx = client_index | int -%}

          {# Case 1: No URLs at all → no snapshot #}
          {%- if num_urls == 0 -%}
          {{ '' }}

          {# Case 2: Load-ledger mode → all clients use first URL #}
          {%- elif load_ledger_testing | default(false) | bool -%}
          {{ urls[0] }}

          {# Case 3: Normal sync-mode behavior
             - Single client (num_clients==1) with URLs → give it urls[0]
             - First client (idx == 0) in multi-client → starts from zero
             - For idx > 0:
               * idx-1 selects the URL (so first ledger client gets urls[0])
               * if more clients than URLs, extra clients use last URL
          #}
          {%- else -%}
            {%- if _clients_in_play | length == 1 and num_urls > 0 -%}
            {{ urls[0] }}
            {%- elif idx == 0 -%}
            {{ '' }}
            {%- elif idx <= num_urls -%}
            {{ urls[idx - 1] }}
            {%- else -%}
            {{ urls[-1] }}
            {%- endif -%}
          {%- endif -%}

    - name: Debug assigned snapshot URL
      debug:
        msg: >-
          host={{ inventory_hostname }}
          idx={{ client_index }}
          num_clients={{ _clients_in_play | length }}
          num_urls={{ _snapshot_lines_clean | length }}
          load_ledger_testing={{ load_ledger_testing | default(false) }}
          snapshot_url={{ snapshot_url | default('') }}

    - name: Deploy download and restart script
      template:
        src: download_snapshot.sh.j2
        dest: /home/ubuntu/download_snapshot.sh
        mode: '0755'
        owner: ubuntu
        group: ubuntu

    - name: Set client facts
      include_tasks: set_client_facts.yml

  roles:
    - snarkos_service

  post_tasks:
    - name: Execute download and restart script
      shell: /home/ubuntu/download_snapshot.sh > /home/ubuntu/download_snapshot_$(date +%Y%m%d-%H%M%S).log 2>&1
      async: 43200  # 12 hours timeout
      poll: 0
      register: download_job

  tags: snarkos_client

# ------------------------------------------------
# Build network_info.json from what each client was assigned
- name: Generate network_info.json from assigned snapshot URLs
  hosts: localhost
  gather_facts: false
  tags: network_info
  tasks:
    - name: Read snapshot URLs file (independent of earlier slurp)
      slurp:
        src: "{{ snapshot_urls_path | default(playbook_dir ~ '/snapshot_urls.txt') }}"
      register: snapshot_urls_content_final
      run_once: true

    - name: Split snapshot URLs into lines (normalize CRLF)
      set_fact:
        snapshot_lines: >-
          {{
            (snapshot_urls_content_final.content | b64decode | regex_replace('\r',''))
            .split('\n')
          }}

    - name: Collect client list from inventory group
      set_fact:
        clients_list: "{{ groups['snarkos_client'] | default([]) }}"

    - name: Assert we have clients
      assert:
        that:
          - clients_list | length > 0
        fail_msg: "No hosts in group 'snarkos_client'. Check inventory or --limit."

    - name: Build list of {height, ip} pairs from per-host snapshot_url
      set_fact:
        pairs: >-
          {{
            (pairs | default([]))
            + [ {
                  'key':
                    (
                      (
                        (url | regex_findall('checkpoint_(\\d+)') | first)
                        | default((url | regex_findall('(?:mainnet|testnet|canary)-(\\d+)\\.(?:tar(?:\\.gz)?|zip)') | first), true)
                      )
                      | default(((idx > 0) | ternary((idx * 1000000) | string, '0')), true)
                    ),
                  'value': { 'url': (hostvars[item]['ansible_host'] | default(item)) }
                } ]
          }}
      vars:
        url: "{{ hostvars[item].snapshot_url | default('') }}"
      loop: "{{ clients_list }}"
      loop_control:
        index_var: idx
        label: "{{ item }}"

    - name: Debug pairs
      debug:
        var: pairs
      when: pairs is defined
      run_once: true

    - name: Construct {height -> client_ip} map from pairs
      set_fact:
        network_info: "{{ pairs | items2dict(key_name='key', value_name='value') }}"

    - name: Remove old network_info.json (force rewrite)
      ansible.builtin.file:
        path: "{{ playbook_dir }}/network_info.json"
        state: absent

    - name: Write network_info.json
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/network_info.json"
        content: "{{ network_info | to_nice_json }}"
        mode: '0644'

    - name: Ensure we have one entry per client
      assert:
        that:
          - (network_info | length) == (groups['snarkos_client'] | length)
        fail_msg: "network_info has {{ network_info | length }} entries; expected {{ groups['snarkos_client'] | length }}."


# ------------------------------------------------
# Load-ledger analyser setup (only when load ledger testing enabled)

- name: Set up load ledger service (conditionally)
  hosts: snarkos_client
  become: true
  remote_user: ubuntu
  any_errors_fatal: true
  vars:
    analyser_path: /home/ubuntu/load_ledger_analyser.sh
    analyser_service_name: load-ledger-analyser
  tasks:
    - name: Load-ledger analyser block
      when: load_ledger_testing | default(false) | bool
      block:
        - name: Ensure logs directory exists
          ansible.builtin.file:
            path: /home/ubuntu/logs
            state: directory
            owner: ubuntu
            group: ubuntu
            mode: "0755"

        - name: Deploy load_ledger analyser script
          ansible.builtin.template:
            src: load_ledger_analyser.sh.j2
            dest: "{{ analyser_path }}"
            owner: ubuntu
            group: ubuntu
            mode: "0755"

        - name: Create systemd service for load ledger analyser
          ansible.builtin.copy:
            dest: /etc/systemd/system/{{ analyser_service_name }}.service
            content: |
              [Unit]
              Description=Load Ledger Analyser
              After=network.target

              [Service]
              Type=simple
              User=ubuntu
              Group=ubuntu
              WorkingDirectory=/home/ubuntu
              ExecStart={{ analyser_path }}
              Restart=no
              LimitNOFILE=65535

              [Install]
              WantedBy=multi-user.target
            owner: root
            group: root
            mode: "0644"
          notify: "Run daemon-reload"

        - name: Enable and start the analyser service
          ansible.builtin.systemd:
            name: "{{ analyser_service_name }}"
            enabled: true
            state: started

  handlers:
    - name: Run daemon-reload
      ansible.builtin.systemd:
        daemon_reload: true
