- name: Set snarkos command
  set_fact:
    snarkos_command: >-
      snarkos start --client --nodisplay \
        --rest 0.0.0.0:3030 --node 0.0.0.0:4130 \
        --verbosity {{ snarkos_verbosity }} --metrics \
        --rest-rps {{ rest_rps }} \
        --auto-migrate-node-data \
        --storage /home/ubuntu/.aleo/storage/ledger-{{ snarkos_network_int }} \
        --logfile /home/ubuntu/snarkos.log \
        --network {{ snarkos_network_int }}
