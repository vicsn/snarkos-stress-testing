# Observability keys — now managed via GCP Secret Manager (see set_secrets.sh)
#
grafana_cloud_api_key: ${GRAFANA_API_TOKEN}

# Your own github access token.
#
github_token: ${GITHUB_PERSONAL_ACCESS_TOKEN}

# Set the devnet name using DEVNET_NAME
#
devnet_name: "miken-devnet"

# Observability infra vars
#
create_flamegraph: false
flamegraph_node_id: "0" # Validator node ID to generate flamegraph for

# # For local build: (leave commented out if using another installation method)
# #
# snarkos_repo: "git@github.com:ProvableHQ/snarkOS.git" # note the URL format
# snarkos_git_commit_local_build: "0805f9380"

#?# For GitHub build: (note that it uses the ProvableHQ/snarkOS-staging repository. Comment out if using another installation method)
#?# For binary installation:
# #
# snarkos_binary_tag: "v4.9.0-testnet"

# # For remote build: (leave commented out if using another installation method)
# #
# snarkos_git_hash: "mainnet-staging" # NOTE: can be a branch name or a commit hash
# snarkos_repo: "https://github.com/ProvableHQ/snarkOS-staging" # note the URL format
# envs: "RUSTFLAGS=--cfg tokio_unstable,RUST_BACKTRACE=0,CARGO_PROFILE_RELEASE_DEBUG=false" # optional, e.g., "RUST_BACKTRACE=0 CARGO_PROFILE_RELEASE_DEBUG=false"
# features: "test_network,tokio_console" # optional

snarkos_git_hash: "d4c484c" # must be a commit hash
snarkos_repo: "https://github.com/ProvableHQ/snarkOS" # note the URL format

# Other vars
#
envs: "RUSTFLAGS=--cfg tokio_unstable,RUST_BACKTRACE=0,CARGO_PROFILE_RELEASE_DEBUG=false" # optional, e.g., "RUST_BACKTRACE=0 CARGO_PROFILE_RELEASE_DEBUG=false"
features: "test_network" # WARNING: if you turn off test_network, tx-cannon may not use the correct consensus versions.
snarkos_malice_tag: "malice-2349f3eda" # depends on ProvableHQ/snarkVM/skip-tx-checks-* and ProvableHQ/snarkOS-staging/malice-2349f3eda
#
#NOTE if above fails, try:
#
## envs: "RUST_BACKTRACE=0,CARGO_PROFILE_RELEASE_DEBUG=false" # optional, e.g., "RUST_BACKTRACE=0 CARGO_PROFILE_RELEASE_DEBUG=false"

# Optional vars
#
# snarkos_git_commit_local_build_update: "73147585924a33ef009a9af949a098941c9a9ea5" # necessary for the update_validators_and_clients_one_by_one test. Should be used together with the local build method.

# Vars to be used with pre-built releases.
#
# All these vars are use by the auto-builder that is triggered on new releases and shouldn't be used locally.
# Adding them here for documentation purposes:

# To use a snarkos binary put in the root of the configured release bucket:
#
# use_snarkos_pre_build_gcs: true
# gcs_bucket: '<existing-bucket-containing-the-snarkos-binary>'

# To use a local pre-built SnarkOS binary on the given path.
#
# snarkos_pre_build_location: "/home/ubuntu/bin/snarkos"

# TXCannon build related vars (deprecated — tx-cannon not actively used):
#
# txcannon_envs: ""
# txcannon_features: "test_network"

# Application vars
#
snarkos_verbosity: "1"
rest_rps: 1000000000

# Ansible vars
#ansible_python_interpreter: /usr/bin/python3.10

# TX pre-generation variables:
#
txs_target_consensus_version: "10"
txs_target_consensus_version_height: 22
# 40 validators, testnet:
txs_target_state_root: sr1z5xdwjtm5caz603essyuu2jkdm3jczkflxqfj3egj29ajg0fv5qqnpqqa2
# 5 validators, testnet:
# txs_target_state_root: sr1pmfwxzm9r8ywud3mt6kdvaqdjz0d2s6sla3v4xa6jehhp7ky9y9s4wncjw
pregeneration_bucket_path: "pregenerated_transactions"
pregenerate_transactions_num_validators: 40
pregeneration_execution_tx_count: 6000
pregeneration_deployment_tx_count: 20
# pregeneration_tx_batch_size: 5
pregeneration_tx_count: 6000

# Vars controlling load_saved_transactions:
#
# load_saved_transactions_type: "executions" # Possible values executions,deployments,all, default: all

# patch_script_path: "{{ playbook_dir }}/../scripts/patch_snarkvm.sh"

# All these vars are use by the auto-builder that is triggered on new releases and shouldn't be used locally.
# Adding them here for documentation purposes:

##TODO: move to GCP storage bucket
# To use a snarkos binary put in the root of the configured `gcs_bucket`:
#
# use_snarkos_pre_build_gcs: true
gcs_bucket: 'provable-binaries-releases'

# Do not change the code below
generate_release_name: "COMMIT_HASH{{ '_' + features if (features is defined and features | length > 0) else '' }}{{ '_' + (envs | regex_replace('=', '_') | regex_replace(' ', '_')) if (envs is defined and envs | length > 0) else '' }}"
