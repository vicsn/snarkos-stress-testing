---
# AWS counterpart to snarkos_install_gcs. Used by snarkos-cdn-tests.
- name: Print bucket and release name
  ansible.builtin.debug:
    msg: "s3_bucket: {{ s3_bucket }}, release_name: {{ release_name }}, dest: {{ snarkos_install_s3_dest_name }}"

- name: Check for aws CLI
  ansible.builtin.command:
    cmd: aws --version
  register: aws_cli
  changed_when: false
  failed_when: false

- name: Install awscli when missing
  ansible.builtin.apt:
    name: awscli
    state: present
    update_cache: true
    lock_timeout: 120
  register: awscli_apt
  until: awscli_apt is success
  retries: 10
  delay: 15
  when: aws_cli.rc != 0

- name: Download snarkos binary from S3
  ansible.builtin.command:
    cmd: aws s3 cp "s3://{{ s3_bucket }}/{{ release_name | trim }}" "/usr/bin/{{ snarkos_install_s3_dest_name }}"
  register: s3_download
  retries: 5
  delay: 15
  until: s3_download.rc == 0
  changed_when: s3_download.rc == 0

- name: Ensure the download was successful
  ansible.builtin.fail:
    msg: "Failed to download snarkos binary from S3."
  when: s3_download.rc != 0

- name: Ensure the binary is executable
  ansible.builtin.file:
    path: "/usr/bin/{{ snarkos_install_s3_dest_name }}"
    mode: "0755"
