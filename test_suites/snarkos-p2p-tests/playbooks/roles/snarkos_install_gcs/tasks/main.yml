- name: Print bucket and release name
  debug:
    msg: "gcs_bucket: {{ gcs_bucket }}, release_name: {{ release_name }}, snarkos_install_s3_dest_name: {{ snarkos_install_s3_dest_name }}"

- name: Download snarkos binary from GCS
  ansible.builtin.command:
    cmd: gcloud storage cp "gs://{{ gcs_bucket }}/{{ release_name | trim }}" "/usr/bin/{{ snarkos_install_s3_dest_name }}"
  register: gcs_download
  retries: 5
  delay: 15
  until: gcs_download.rc == 0
  changed_when: gcs_download.rc == 0

- name: Ensure the download was successful
  fail:
    msg: "Failed to download snarkos binary from GCS."
  when: gcs_download.rc != 0

- name: Ensure the binary is executable
  file:
    path: "/usr/bin/{{ snarkos_install_s3_dest_name }}"
    mode: '0755'
