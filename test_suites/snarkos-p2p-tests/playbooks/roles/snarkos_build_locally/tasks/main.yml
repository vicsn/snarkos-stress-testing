- name: Prepare release for GCS and local build
  block:
    - name: Debug envs variable
      debug:
        var: envs

    - name: Parse envs into a dictionary using dict filter
      set_fact:
        envs_dict: "{{ dict(envs | default('') | split(',') | map('split', '=', 1)) }}"
      when: envs is defined and envs | length > 0

    - name: Debug envs_dict
      debug:
        var: envs_dict

    - name: Debug release name
      debug:
        msg: "Release name: '{{ release_name }}'"

    - name: Check if the binary for the git hash exists in GCS bucket
      ansible.builtin.command:
        cmd: gcloud storage ls "gs://{{ gcs_bucket }}/{{ release_name | trim }}"
      register: gcs_ls_output
      failed_when: false
      changed_when: false

    - name: Set fact if object exists
      set_fact:
        gcs_binary_exists: "{{ gcs_ls_output.rc == 0 }}"

    - name: Fail if compiling with the 'locktick' feature on macOS - cross-compilation is not supported
      fail:
        msg: "Compiling with the 'locktick' feature is not supported on macOS. Please remove it from the features variable."
      when: not gcs_binary_exists and ansible_system == 'Darwin' and features is defined and 'locktick' in features

    - name: Construct authenticated repo URL if GitHub token is set
      set_fact:
        effective_snarkos_repo: >-
          {{
            snarkos_repo | regex_replace('https://', 'https://' ~ github_token ~ '@')
            if github_token is defined and github_token != '' and github_token != 'your_github_token_here'
            else snarkos_repo
          }}
      when: not gcs_binary_exists

    - name: Clone the repository if the binary is not found in S3
      git:
        repo: "{{ effective_snarkos_repo }}"
        dest: "{{ base_workspace_folder }}/{{ clone_dir_base }}/{{ snarkos_git_commit_to_build }}"
        version: "{{ snarkos_git_commit_to_build }}"
        depth: 1
        force: true
      when: not gcs_binary_exists

    - name: Ensure .cargo folder exists (macOS)
      ansible.builtin.file:
        path: "{{ base_workspace_folder }}/{{ clone_dir_base }}/{{ snarkos_git_commit_to_build }}/.cargo"
        state: directory
        mode: '0755'
      when:
        - not gcs_binary_exists
        - ansible_system == 'Darwin'

    - name: Ensure .cargo/config.toml exists (macOS)
      ansible.builtin.file:
        path: "{{ base_workspace_folder }}/{{ clone_dir_base }}/{{ snarkos_git_commit_to_build }}/.cargo/config.toml"
        state: touch
        mode: '0644'
      when:
        - not gcs_binary_exists
        - ansible_system == 'Darwin'

    - name: Replace entire [target.x86_64-unknown-linux-gnu] section (macOS)
      ansible.builtin.replace:
        path: "{{ base_workspace_folder }}/{{ clone_dir_base }}/{{ snarkos_git_commit_to_build }}/.cargo/config.toml"
        # Match the whole section up to the next section header or EOF
        regexp: '(?ms)^\[target\.x86_64-unknown-linux-gnu\][\s\S]*?(?=^\[|\Z)'
        replace: |
          [target.x86_64-unknown-linux-gnu]
          linker = "x86_64-unknown-linux-gnu-gcc"
        backup: yes
      register: cargo_cfg_replaced
      when:
        - not gcs_binary_exists
        - ansible_system == 'Darwin'

    - name: Append section if it did not exist (macOS)
      ansible.builtin.blockinfile:
        path: "{{ base_workspace_folder }}/{{ clone_dir_base }}/{{ snarkos_git_commit_to_build }}/.cargo/config.toml"
        block: |
          [target.x86_64-unknown-linux-gnu]
          linker = "x86_64-unknown-linux-gnu-gcc"
        marker: "# {mark} managed by Ansible (cargo-target-linker)"
        insertafter: EOF
      when:
        - not gcs_binary_exists
        - ansible_system == 'Darwin'
        - not cargo_cfg_replaced.changed

    - name: Override Rust version (macOS only)
      shell: cd {{ base_workspace_folder }}/{{ clone_dir_base }}/{{ snarkos_git_commit_to_build }} && rustup override set nightly-aarch64-apple-darwin
      when:
        - not gcs_binary_exists
        - ansible_system == 'Darwin'

    - name: Check if OpenSSL is installed
      stat:
        path: "{{ openssl_install_prefix }}"
      register: openssl_stat

    - name: Print the openssl_stat
      debug:
        var: openssl_stat

    - name: Create tmp directory for building OpenSSL
      file:
        path: "{{ base_workspace_folder }}/{{ clone_dir_base }}/{{ snarkos_git_commit_to_build }}/tmp"
        state: directory
        mode: '0755'
      when:
        - not gcs_binary_exists
        - ansible_system == 'Darwin'
        - not openssl_stat.stat.exists

    - name: Download OpenSSL tarball
      get_url:
        url: "{{ openssl_url }}"
        dest: "{{ base_workspace_folder }}/{{ clone_dir_base }}/{{ snarkos_git_commit_to_build }}/tmp/{{ openssl_tarball }}"
        mode: '0755'
      when:
        - not gcs_binary_exists
        - ansible_system == 'Darwin'
        - not openssl_stat.stat.exists

    - name: Extract OpenSSL tarball using tar command
      command: tar -xzf "{{ openssl_tarball }}"
      args:
        chdir: "{{ base_workspace_folder }}/{{ clone_dir_base }}/{{ snarkos_git_commit_to_build }}/tmp"
      when:
        - not gcs_binary_exists
        - ansible_system == 'Darwin'
        - not openssl_stat.stat.exists

    - name: Configure OpenSSL
      command: >
        ./Configure linux-x86_64 no-shared no-module no-dso no-async
        --prefix={{ openssl_install_prefix }}
        --openssldir={{ openssl_install_prefix }}
      args:
        chdir: "{{ base_workspace_folder }}/{{ clone_dir_base }}/{{ snarkos_git_commit_to_build }}/tmp/{{ openssl_dir }}"
      environment:
        CROSS_COMPILE: "x86_64-unknown-linux-gnu-"
        CFLAGS: "-fPIC -fPIE -pie"
      when:
        - not gcs_binary_exists
        - ansible_system == 'Darwin'
        - not openssl_stat.stat.exists

    - name: Build OpenSSL with make -j12
      command: make -j12
      args:
        chdir: "{{ base_workspace_folder }}/{{ clone_dir_base }}/{{ snarkos_git_commit_to_build }}/tmp/{{ openssl_dir }}"
      when:
        - not gcs_binary_exists
        - ansible_system == 'Darwin'
        - not openssl_stat.stat.exists

    - name: Install OpenSSL
      command: make install
      args:
        chdir: "{{ base_workspace_folder }}/{{ clone_dir_base }}/{{ snarkos_git_commit_to_build }}/tmp/{{ openssl_dir }}"
      when:
        - not gcs_binary_exists
        - ansible_system == 'Darwin'
        - not openssl_stat.stat.exists

    - name: Set features flag
      set_fact:
        featureflags: >-
          {{
            "" if (features is not defined or features | length == 0)
            else "--features " ~ features
          }}

    # We can delete the folder right after the run, but it is worth to not do that for some debugging, so we set  1d cleanup on old folders.
    # That way we can debug issues with a snarkos that was compiled in a buggy way and also old checkouts won't be hanging on the next run.
    - name: Check if the folders are too old (including the cache)
      ansible.builtin.find:
        paths: "{{ base_workspace_folder }}/{{ clone_dir_base }}"
        age: 1d
        age_stamp: mtime
        file_type: directory
      register: old_dirs

    - name: Delete old source folders
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_dirs.files }}"

    - name: Ensure the shared target directory exists
      ansible.builtin.file:
        path: "{{ base_workspace_folder }}/{{ clone_dir_base }}/shared"
        state: directory
        mode: '0755'

    - name: Enable locktick build features in Cargo.tml
      shell: |
        tmp="$(mktemp)"
        sed 's/^# debug = "line-tables-only"/debug = "line-tables-only"/' Cargo.toml > "$tmp"
        mv "$tmp" Cargo.toml
        sed 's/^# strip = "none"/strip = "none"/' Cargo.toml > "$tmp"
        mv "$tmp" Cargo.toml
      args:
        executable: /bin/bash
        chdir: "{{ base_workspace_folder }}/{{ clone_dir_base }}/{{ snarkos_git_commit_to_build }}"
      when: not gcs_binary_exists and features is defined and 'locktick' in features and ansible_system != 'Darwin'

    - name: Read CONSENSUS_VERSION_HEIGHTS env var (if set)
      set_fact:
        consensus_version_heights_env: "{{ lookup('env', 'CONSENSUS_VERSION_HEIGHTS') | default('', true) }}"
      when:
        - not gcs_binary_exists

    - name: Compute absolute sccache dir inside workspace
      set_fact:
        sccache_dir_abs: "{{ base_workspace_folder }}/{{ clone_dir_base }}/shared/sccache"
      when:
        - not gcs_binary_exists
        - ansible_system == 'Darwin'

    - name: Ensure sccache dir exists and is writable
      file:
        path: "{{ sccache_dir_abs }}"
        state: directory
        mode: "0775"
        recurse: true
      when:
        - not gcs_binary_exists
        - ansible_system == 'Darwin'

    - name: Restart sccache daemon to pick up env
      shell: sccache --stop || true
      when:
        - not gcs_binary_exists
        - ansible_system == 'Darwin'

    - name: Build the Rust project with OpenSSL (macOS)
      command: cargo build --release --target x86_64-unknown-linux-gnu {{ featureflags }} --config rustflags=\"\"
      args:
        chdir: "{{ base_workspace_folder }}/{{ clone_dir_base }}/{{ snarkos_git_commit_to_build }}"
      environment: >-
        {{
          {
            'OPENSSL_INCLUDE_DIR': openssl_install_prefix + '/include',
            'OPENSSL_LIB_DIR': openssl_install_prefix + '/lib64',
            'OPENSSL_STATIC': '1',
            'CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER': 'x86_64-unknown-linux-gnu-gcc',
            'RUSTC_WRAPPER': 'sccache',
            'SCCACHE_DIR': sccache_dir_abs,
            'SCCACHE_CACHE_SIZE': '5G'
          }
          | combine(
              consensus_version_heights_env is defined and (consensus_version_heights_env | length > 0)
              | ternary({'CONSENSUS_VERSION_HEIGHTS': consensus_version_heights_env}, {})
          )
          | combine(envs_dict | default({}))
        }}
      register: build_output_mac
      when:
        - not gcs_binary_exists
        - ansible_system == 'Darwin'

    - name: Build the Rust project (Linux)
      shell: source "$HOME/.cargo/env" && cargo build --release --locked {{ featureflags }}
      args:
        chdir: "{{ base_workspace_folder }}/{{ clone_dir_base }}/{{ snarkos_git_commit_to_build }}"
        executable: /bin/bash
      environment: >-
        {{
          {
            'RUSTC_WRAPPER': '/usr/local/bin/sccache',
            'SCCACHE_GCS_BUCKET': '{{ compiler_cache_bucket }}',
            'SCCACHE_GCS_KEY_PREFIX': 'linux_rust/',
            'SCCACHE_GCS_RW_MODE': 'READ_WRITE'
          }
          | combine(
              consensus_version_heights_env is defined and (consensus_version_heights_env | length > 0)
              | ternary({'CONSENSUS_VERSION_HEIGHTS': consensus_version_heights_env}, {})
          )
          | combine(envs_dict | default({}))
        }}
      register: build_output
      when:
        - not gcs_binary_exists
        - ansible_system != 'Darwin'

    - name: Debug build_output_mac
      debug:
        var: build_output_mac

    - name: Debug build_output
      debug:
        var: build_output

    - name: Upload the built snarkos binary to GCS (macOS)
      ansible.builtin.command:
        cmd: gcloud storage cp "{{ base_workspace_folder }}/{{ clone_dir_base }}/{{ snarkos_git_commit_to_build }}/target/x86_64-unknown-linux-gnu/release/snarkos" "gs://{{ gcs_bucket }}/{{ release_name | trim }}"
      when:
        - not gcs_binary_exists
        - ansible_system == 'Darwin'
      register: gcs_upload_output
      changed_when: gcs_upload_output.rc == 0

    - name: Upload the built snarkos binary to GCS (Linux)
      ansible.builtin.command:
        cmd: gcloud storage cp "{{ base_workspace_folder }}/{{ clone_dir_base }}/{{ snarkos_git_commit_to_build }}/target/release/snarkos" "gs://{{ gcs_bucket }}/{{ release_name | trim }}"
      when:
        - not gcs_binary_exists
        - ansible_system != 'Darwin'
      register: gcs_upload_output
      changed_when: gcs_upload_output.rc == 0

    - name: Debug message after upload
      debug:
        msg: "Uploaded snarkos binary to GCS."
      when: gcs_upload_output is changed

    - name: Set snarkos_git_hash fact for later use
      set_fact:
        snarkos_git_hash: "{{ snarkos_git_commit_to_build }}"
