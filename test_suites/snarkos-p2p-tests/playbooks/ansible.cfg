[inventory]
enable_plugins = google.cloud.gcp_compute, host_list, script, auto, yaml, ini, toml

[defaults]
stdout_callback = default
# Rewrite hyphens in dynamic-inventory group names (e.g. labels.devnet=
# snarkos-p2p-tests → devnet_snarkos_p2p_tests) so they match
# TARGET_PATTERN in scripts/lib/common.sh. Ansible 2.8+ defaults this
# to "never", which left GCE hosts in a different group than --limit.
force_valid_group_names = always
# Suppresses deprecation warnings from Ansible collections caused by
# import path changes across ansible-core versions.
deprecation_warnings = False
callback_result_format = yaml
bin_ansible_callbacks = True

host_key_checking = False
inventory = ../inventory/

private_key_file = ../../../devnet-key
#private_key_file = $(realpath $SNARKOS_SA_SSH_KEY)           ## ANSIBLE_PRIVATE_KEY_FILE
#remote_user = sa_${SNARKOS_SA_UID}                           ## ANSIBLE_REMOTE_USER

ssh_args = -o ServerAliveInterval=60 -o ControlMaster=auto -o ControlPersist=2m
roles_path = ./roles:../../../common/roles/
# increase forks if # of machines goes up
forks = 100
pipelining = True
gathering = smart
# 10 minute timeout
fact_caching_timeout = 600
# Install mitogen for further speedups
# strategy_plugins = /Library/Frameworks/Python.framework/Versions/3.13/lib/python3.13/site-packages/ansible_mitogen/plugins/strategy
# strategy = mitogen_linear
collections_paths = ~/.ansible/collections:/usr/share/ansible/collections
# SSH timeout
timeout = 60

[persistent_connection]
connect_timeout = 60
command_timeout = 36000
connect_retry_timeout = 3600
