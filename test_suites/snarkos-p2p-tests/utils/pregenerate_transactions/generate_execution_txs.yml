- name: pregenerate_transactions | generate_execution_txs | Launch batch in parallel (single SSH)
  ansible.builtin.shell: |
    set -euo pipefail
    mkdir -p /tmp/pregen_logs

    run_tx() {
      idx="$1"
      echo "Generating execution transaction ${idx} of $(( ({{ pregeneration_execution_tx_count | int }}) / 2 ))" \
        | tee -a "/tmp/pregen_logs/tx_${idx}.log"

      "{{ snarkos_bin_path }}/snarkos" developer execute \
        --private-key "{{ txs_accounts[0].private_key }}" \
        --query '{"state_root": "{{ txs_target_state_root }}", "height": {{ txs_target_consensus_version_height }}}' \
        credits.aleo transfer_public "{{ txs_accounts[1].address }}" 100u64 \
        --network {{ snarkos_network_int }} \
        --store "/tmp/transfer_public_tx${idx}.txt" \
        --store-format string >>"/tmp/pregen_logs/tx_${idx}.log" 2>&1
    }

    pids=()
    for idx in {{ current_batch | join(' ') }}; do
      run_tx "$idx" &
      pids+=("$!")
    done

    ec=0
    for p in "${pids[@]}"; do
      if ! wait "$p"; then ec=1; fi
    done

    # Merge at the end to avoid contention
    cat /tmp/pregen_logs/tx_*.log >> transaction_pregeneration.log || true
    exit $ec
  args:
    executable: /bin/bash
  register: batch_run
  changed_when: true

- name: pregenerate_transactions | generate_execution_txs | Accumulate results (indices only)
  set_fact:
    current_batch_result_jobs:
      results: "{{ current_batch | map('int') | list }}"
