- name: prerelease_1_halt_byzantine_majority | restart | Select half of the validators randomly with Python
  ansible.builtin.command: >
    python3 -c "import random; import sys; hosts=sys.argv[1].split(','); random.shuffle(hosts); half=len(hosts)//2; \
                selected_hosts=hosts[:half]; print(','.join(selected_hosts))" "{{ groups['snarkos_validator'] | join(',') }}"
  register: validators_to_stop_raw
  run_once: true

- name: prerelease_1_halt_byzantine_majority | restart | Convert output to list
  set_fact:
    validators_to_stop: "{{ validators_to_stop_raw.stdout.split(',') }}"
  run_once: true

- name: prerelease_1_halt_byzantine_majority | restart | Debug selected validators
  debug:
    msg: "Validators to stop: {{ validators_to_stop }}"

- name: prerelease_1_halt_byzantine_majority | restart | Stop snarkos service on selected validators
  delegate_to: "{{ validator_to_stop }}"
  become: true
  remote_user: ubuntu
  ansible.builtin.systemd:
    name: snarkos
    state: stopped
  loop: "{{ validators_to_stop }}"
  loop_control:
    loop_var: validator_to_stop

- name: prerelease_1_halt_byzantine_majority | restart | Pause for 15 seconds
  pause:
    seconds: 15
  run_once: true

- name: prerelease_1_halt_byzantine_majority | restart | Restart snarkos service on selected validators
  delegate_to: "{{ validator_to_stop }}"
  become: true
  remote_user: ubuntu
  ansible.builtin.systemd:
    name: snarkos
    state: restarted
  loop: "{{ validators_to_stop }}"
  loop_control:
    loop_var: validator_to_stop

- name: prerelease_1_halt_byzantine_majority | restart | Pause for 120 more seconds
  pause:
    seconds: 120
  run_once: true

- name: prerelease_1_halt_byzantine_majority | restart | Fetch the current block height
  ansible.builtin.uri:
    url: "http://{{ test_network_url }}:3030/{{ snarkos_network }}/block/latest"
    method: GET
    return_content: true
  register: current_block
  run_once: true

- name: prerelease_1_halt_byzantine_majority | restart | Debug the URL
  debug:
    msg: "http://{{ test_network_url }}:3030/{{ snarkos_network }}/block/latest"

- name: prerelease_1_halt_byzantine_majority | restart | Debug current block height
  debug:
    msg: "Current block height: {{  current_block.json['header']['metadata']['height'] }}"
