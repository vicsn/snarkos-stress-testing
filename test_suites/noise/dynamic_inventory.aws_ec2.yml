plugin: amazon.aws.aws_ec2

regions:
  - us-west-1

keyed_groups:
  - key: tags.Role
    prefix: ""
    separator: ""
    value: "snarkos-node"
  # - key: tags.Role
  #   prefix: ""
  #   separator: ""
  #   value: "tx-cannon-node"
  - key: tags.Role
    prefix: ""
    separator: ""
    value: "prometheus-server"

filters:
  instance-state-name: running
  tag:Role: ["snarkos-node", "prometheus-server"]
  # tag:Role: ["snarkos-node", "tx-cannon-node", "prometheus-server"]
